      ${b.progressive ? `<div class="row" style="margin-top:8px"><span style="color:var(--mute);font-size:13.5px">Côté final</span><span class="pt">${breathStep + b.progressive} temps</span></div>` : ''}
    </div>

    <div class="plan">
      <div class="plan-row head" style="grid-template-columns:1fr 60px"><span>${b.progressive ? 'Phase · premier cycle' : 'Phase'}</span><span style="text-align:right">Durée</span></div>
      ${cycle.map(p=>`<div class="plan-row" style="grid-template-columns:1fr 60px">
        <span style="font-size:14px">${p.label}</span>

/* ---SEANCES-ANCHOR--- */
let calOpen  = false;
let calShift = 0;
let chartFilter = 'all';

function sessionBest(e){ return Math.max(0, ...(e.holds || []).map(h=>h.actual)); }
function typeTag(t){
  return t === 'co2' ? 'CO₂' : t === 'o2' ? 'O₂' : t === 'max' ? 'MAX'
       : t === 'custom' ? 'SUR' : 'SOUF';
}
function typeColor(t){
  return t === 'co2' ? 'var(--air)' : t === 'o2' ? 'var(--aqua)'
       : t === 'custom' ? 'var(--rest-c)' : 'var(--bone)';
}

function viewHistory(){
  const all   = S.history.slice().sort((a,b)=>a.ts - b.ts);
  const apnea = all.filter(e=>e.type !== 'breath');     // courbes : apnée seulement
  const best  = all.reduce((m,e)=>Math.max(m, sessionBest(e)), 0);
  const totalHold = all.reduce((m,e)=>m + (e.totalHold||0), 0);
  const totalRest = all.reduce((m,e)=>m + (e.totalRest||0), 0);
  const maxTries  = all.filter(e=>e.type === 'max').length;
  const breathN   = all.filter(e=>e.type === 'breath').length;

  const items = S.history.length ? S.history.map(e=>{
    const cls = e.type === 'co2' ? 'co2' : e.type === 'o2' ? 'o2' : 'max';
    const isB = e.type === 'breath';
    const title = isB
      ? (BREATH[e.breathKey] ? BREATH[e.breathKey].name : 'Respiration') + ' · ' + (e.breathMin||0) + ' min'
      : `${e.holds.length} apnée${e.holds.length>1?'s':''} · plus longue ${fmt(sessionBest(e))}`;
    return `<button class="hist hist-btn" onclick="openSession('${e.id}')">
      <div class="hist-badge ${cls}">${typeTag(e.type)}</div>
      <div class="hist-main">
        <div class="hist-t">${title}</div>
        <div class="hist-m">${dateLabel(e.ts)}${e.done ? '' : ' · interrompue'}${e.note ? ' · ressenti noté' : ''}</div>
      </div>
      <div class="hist-r">${isB ? (e.breathMin||0)+' min' : fmt(e.totalHold)}</div>
    </button>`;
  }).join('') : `<div class="empty">Aucune séance enregistrée.<br>Lance une table depuis l'accueil.</div>`;

  return `
  <div class="screen">
    <div class="eyebrow">Journal</div>
    <h1>Séances.</h1>
    <p class="sub">${S.history.length} séance${S.history.length>1?'s':''} · plus longue apnée ${best ? fmt(best) : '—'} · ${fmtLong(totalHold)} en apnée au total</p>

    <h2>Totaux</h2>
    <div class="card">
      <div class="stat-grid">
        <div class="stat"><div class="stat-v">${S.history.length}</div><div class="stat-l">Séances</div></div>
        <div class="stat"><div class="stat-v tm-hold">${fmtHM(totalHold)}</div><div class="stat-l">Temps d'apnée</div></div>
        <div class="stat"><div class="stat-v tm-rest">${fmtHM(totalRest)}</div><div class="stat-l">Temps de repos</div></div>
        <div class="stat"><div class="stat-v">${maxTries}</div><div class="stat-l">Tentatives de record</div></div>
      </div>
      ${breathN ? `<div class="row" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <span style="color:var(--mute);font-size:13px">Dont séances de souffle</span><span class="pt">${breathN}</span>
      </div>` : ''}
    </div>

    ${apnea.length >= 2 ? progressBlock(apnea) : ''}
    ${pbBlock()}
    ${calendarBlock()}

    <h2 style="margin-top:26px">Historique</h2>
    ${items}
    ${tabbar('history')}
  </div>`;
}

/* --- courbe de progression --- */
function progressBlock(all){
  const pts = chartFilter === 'all' ? all : all.filter(e=>e.type === chartFilter);
  const chart = pts.length >= 2 ? progressChart(pts)
    : `<div class="empty" style="padding:26px;border:none;background:none">Pas encore assez de séances de ce type.</div>`;
  const tabs = [['all','Tout'],['o2','O₂'],['co2','CO₂'],['custom','Sur mesure'],['max','Max']];
  return `
    <h2>Progression</h2>
    <div class="seg" style="grid-template-columns:repeat(5,1fr);font-size:12px;margin-bottom:14px">
      ${tabs.map(([k,l])=>`<button class="${chartFilter===k?'on':''}" onclick="chartFilter='${k}';render()">${l}</button>`).join('')}
    </div>
    <div class="card flat" style="padding:16px 12px 12px">${chart}</div>`;
}

function progressChart(pts){
  const data = pts.slice(-40);
  const W = 320, H = 150, PL = 36, PR = 8, PT = 10, PBo = 20;
  const vals = data.map(sessionBest);
  const vmax = Math.max(...vals), vmin = Math.min(...vals);
  const top = Math.max(30, Math.ceil((vmax * 1.1) / 30) * 30);
  const bot = Math.max(0, Math.floor((vmin * .85) / 30) * 30);
  const span = Math.max(30, top - bot);
  const x = i => PL + (data.length === 1 ? 0 : i * (W - PL - PR) / (data.length - 1));
  const y = v => PT + (1 - (v - bot) / span) * (H - PT - PBo);

  const grid = [0, .5, 1].map(f=>{
    const v = bot + f * span, yy = y(v);
    return `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}" stroke="rgba(111,216,209,.10)" stroke-width="1"/>
      <text x="${PL-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${fmt(v)}</text>`;
  }).join('');

  const series = {};
  data.forEach((e,i)=>{ (series[e.type] = series[e.type] || []).push([x(i), y(sessionBest(e))]); });

  const paths = Object.entries(series).map(([t,p])=>{
    if(p.length < 2) return '';
    let d = `M ${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
    for(let i=1;i<p.length;i++){
      const px = p[i-1][0], py = p[i-1][1], cx = p[i][0], cy = p[i][1], mx = (px+cx)/2;
      d += ` C ${mx.toFixed(1)} ${py.toFixed(1)}, ${mx.toFixed(1)} ${cy.toFixed(1)}, ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    }
    return `<path d="${d}" fill="none" stroke="${typeColor(t)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  }).join('');

  const dots = data.map((e,i)=>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(sessionBest(e)).toFixed(1)}" r="2.6" fill="${typeColor(e.type)}"/>`).join('');

  const dlab = ts => new Date(ts).toLocaleDateString(locale(),{day:'numeric',month:'short'});

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${grid}${paths}${dots}
    <text x="${PL}" y="${H-5}" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${dlab(data[0].ts)}</text>
    <text x="${W-PR}" y="${H-5}" text-anchor="end" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${dlab(data[data.length-1].ts)}</text>
  </svg>
  <p class="hint" style="margin:8px 4px 0">Plus longue apnée de chaque séance.</p>`;
}

/* --- évolution du max de référence --- */
function pbBlock(){
  const h = (S.pbHistory || []).slice(-40);
  if(h.length < 2) return '';
  const W=320, H=120, PL=36, PR=8, PT=10, PBo=20;
  const vals = h.map(p=>p.pb);
  const top = Math.ceil(Math.max(...vals)*1.08/15)*15;
  const bot = Math.max(0, Math.floor(Math.min(...vals)*.9/15)*15);
  const span = Math.max(15, top-bot);
  const x = i => PL + (h.length===1?0: i*(W-PL-PR)/(h.length-1));
  const y = v => PT + (1-(v-bot)/span)*(H-PT-PBo);

  const grid = [0,1].map(f=>{
    const v = bot+f*span, yy = y(v);
    return `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}" stroke="rgba(127,198,190,.10)"/>
      <text x="${PL-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${fmt(v)}</text>`;
  }).join('');

  let d = `M ${x(0).toFixed(1)} ${y(h[0].pb).toFixed(1)}`;
  for(let i=1;i<h.length;i++) d += ` L ${x(i).toFixed(1)} ${y(h[i].pb).toFixed(1)}`;
  const dots = h.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.pb).toFixed(1)}" r="2.6" fill="var(--aqua)"/>`).join('');
  const dl = ts => new Date(ts).toLocaleDateString(locale(),{day:'numeric',month:'short'});
  const gain = h[h.length-1].pb - h[0].pb;

  return `
    <h2 style="margin-top:26px">Max de référence</h2>
    <div class="card flat" style="padding:16px 12px 12px">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        ${grid}
        <path d="${d}" fill="none" stroke="var(--aqua)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
        <text x="${PL}" y="${H-5}" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${dl(h[0].ts)}</text>
        <text x="${W-PR}" y="${H-5}" text-anchor="end" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${dl(h[h.length-1].ts)}</text>
      </svg>
      <p class="hint" style="margin:8px 4px 0">${gain > 0 ? '+' + fmt(gain) + ' depuis le premier relevé.' : gain < 0 ? fmt(-gain) + ' de moins qu\'au premier relevé.' : 'Stable depuis le premier relevé.'}</p>
    </div>`;
}

/* --- calendrier repliable --- */
function calendarBlock(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + calShift);
  const yy = base.getFullYear(), mm = base.getMonth();
  const label = base.toLocaleDateString(locale(),{month:'long',year:'numeric'});

  const byDay = {};
  S.history.forEach(e=>{
    const d = new Date(e.ts);
    if(d.getFullYear() === yy && d.getMonth() === mm){
      const k = d.getDate();
      (byDay[k] = byDay[k] || []).push(e.type);
    }
  });

  const offset = (new Date(yy, mm, 1).getDay() + 6) % 7;   // semaine du lundi
  const days = new Date(yy, mm+1, 0).getDate();
  const today = new Date();
  const isThisMonth = today.getFullYear() === yy && today.getMonth() === mm;

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="cal-cell"></div>`;
  for(let d=1;d<=days;d++){
    const types = [...new Set(byDay[d] || [])];
    const now = isThisMonth && today.getDate() === d;
    cells += `<div class="cal-cell${types.length?' has':''}${now?' now':''}">
      <span>${d}</span>
      <div class="cal-dots">${types.map(t=>`<i style="background:${typeColor(t)}"></i>`).join('')}</div>
    </div>`;
  }

  const count = Object.keys(byDay).length;

  return `
    <h2 style="margin-top:26px">Calendrier</h2>
    <div class="card flat" style="padding:0;overflow:hidden">
      <button class="cal-head" onclick="calOpen=!calOpen;render()">
        <span class="cal-title">${label}</span>
        <span class="cal-meta">${count} jour${count>1?'s':''} d'entraînement</span>
        <span class="cal-chev${calOpen?' up':''}">⌄</span>
      </button>
      ${calOpen ? `
        <div class="cal-body">
          <div class="cal-nav">
            <button onclick="calShift--;render()">◀</button>
            <button onclick="calShift=0;render()" ${calShift===0?'disabled':''}>Aujourd'hui</button>
            <button onclick="calShift++;render()" ${calShift>=0?'disabled':''}>▶</button>
          </div>
          <div class="cal-grid head">${['L','M','M','J','V','S','D'].map(d=>`<div>${d}</div>`).join('')}</div>
          <div class="cal-grid">${cells}</div>
        </div>` : ''}
    </div>`;
}

async function doChangeEmail(){
  if(mgBusy) return;
  const e = (mgDraft.email||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ toast('Adresse e-mail invalide.','err'); return; }
  if(e.toLowerCase() === (S.cloudEmail||'').toLowerCase()){ toast('C\'est déjà ton adresse actuelle.','err'); return; }
  mgBusy = 'mail'; render();
  try{
    await changeEmail(e);
    mgDraft.email = ''; mgBusy = null; render();
    toast('Vérifie tes deux boîtes mail pour confirmer.');
  }catch(err){
    mgBusy = null; render();
    toast(traduireErreur(err && err.message), 'err');
  }
}

async function doChangePassword(){
  if(mgBusy) return;
  if(!mgDraft.cur){ toast('Renseigne ton mot de passe actuel.','err'); return; }
  if((mgDraft.np||'').length < 8){ toast('Nouveau mot de passe trop court : 8 caractères minimum.','err'); return; }
  if(mgDraft.np !== mgDraft.np2){ toast('Les deux mots de passe ne correspondent pas.','err'); return; }
  if(mgDraft.np === mgDraft.cur){ toast('Le nouveau mot de passe est identique à l\'ancien.','err'); return; }
  mgBusy = 'pass'; render();
  try{
    await changePassword(mgDraft.cur, mgDraft.np);
    mgDraft = { email:mgDraft.email, cur:'', np:'', np2:'' };
    mgBusy = null; render();
    toast('Mot de passe mis à jour.');
  }catch(err){
    mgBusy = null; render();
    toast(traduireErreur(err && err.message), 'err');
  }
}

async function syncAndLeave(){

async function doAuth(){
  if(authBusy) return;
  const up    = authMode === 'up';
  const email = (authDraft.email || '').trim();
  const pass  = authDraft.pass || '';

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ authMsg = 'Adresse e-mail invalide.'; render(); return; }
  if(pass.length < 8){ authMsg = 'Mot de passe trop court : 8 caractères minimum.'; render(); return; }
  if(up && pass !== (authDraft.pass2 || '')){ authMsg = 'Les deux mots de passe ne correspondent pas.'; render(); return; }

  // À l'inscription, l'avertissement passe avant la création du compte
  if(up && !disclaimerAccepted()){
    requireDisclaimer(()=>{ authMode = 'up'; goto('account'); setTimeout(doAuth, 60); });
    return;
  }

  authBusy = true; authMsg = ''; render();
  try{
    if(up){
      const d = await signUp(email, pass);
      if(d.user && !d.session){
        authBusy = false;
        authMsg = 'Compte créé. Confirme ton adresse via le mail reçu, puis connecte-toi.';
        authMode = 'in'; render(); return;
      }
    } else {
      await signIn(email, pass);
    }
    const u = await currentUser();
    if(u){
      S.cloudEmail = u.email;
      authDraft = { email:'', pass:'', pass2:'' };
      authBusy = false; authMsg = '';
      save(); render();
      await syncNow();
      const next = authIntent; authIntent = null;
      if(next) next();
    } else {
      authBusy = false; authMsg = 'Connexion impossible. Réessaie.'; render();
    }
  }catch(e){
    authBusy = false;
    authMsg = traduireErreur(e && e.message);
    render();
  }
}

function traduireErreur(m){
  m = String(m || '');
  if(/Invalid login/i.test(m))          return 'E-mail ou mot de passe incorrect.';
  if(/already registered|User already/i.test(m)) return 'Cette adresse a déjà un compte. Passe en connexion.';
  if(/Email not confirmed/i.test(m))    return 'Adresse pas encore confirmée : vérifie ta boîte mail.';
  if(/rate limit|too many|For security/i.test(m)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/Password should be/i.test(m))     return 'Mot de passe trop faible : 8 caractères minimum.';
  if(/Failed to fetch|network|NetworkError/i.test(m)) return "Pas de réseau. L'app reste utilisable hors ligne.";
  return m || 'Erreur inconnue.';
}

function viewGuide(){
  return `
  <div class="screen">
    <div class="eyebrow">Méthode</div>
    <h1>S'entraîner.</h1>
    <p class="sub">Ce que font les tables, comment les placer dans une semaine, et où sont les limites.</p>

    <div class="safety">
      <ul>
        <li><b>À sec, toujours.</b> Jamais dans l'eau, jamais au bord d'un bassin, jamais dans un bain. Une syncope à sec fait tomber ; dans l'eau, elle noie.</li>
        <li><b>Allongé ou assis</b> dans un endroit sûr. Jamais debout, au volant, en marchant, ni en hauteur.</li>
        <li>Problème cardiaque, respiratoire, hypertension, épilepsie, grossesse : avis médical avant de commencer.</li>
      </ul>
    </div>

    ${guideSection('quoi', 'Ce que tu entraînes vraiment', `
      <p>L'envie de respirer ne vient pas du manque d'oxygène mais de l'accumulation de gaz carbonique. Ce sont deux signaux distincts, et les deux tables travaillent chacune l'un d'eux.</p>
      <p><b class="tm-hold">La table CO₂</b> garde des apnées de durée constante et raccourcit les repos. Le gaz carbonique n'a plus le temps d'être évacué, donc chaque apnée démarre avec un niveau plus élevé que la précédente. Tu ne vas jamais très loin en durée, mais tu passes beaucoup de temps dans l'inconfort. C'est un entraînement de tolérance : apprendre à rester posé quand le corps réclame.</p>
      <p><b class="tm-hold">La table O₂</b> fait l'inverse. Les repos restent longs et identiques, les apnées s'allongent progressivement. Chaque répétition descend un peu plus bas en oxygène que la précédente. C'est un entraînement d'adaptation : le corps apprend à fonctionner avec moins.</p>
      <p>Une table CO₂ paraît plus dure sur le moment, une table O₂ laisse plus fatigué après. Ce n'est pas une impression.</p>
    `)}

    ${guideSection('avant', 'Avant la séance', `
      <p>Choisis un moment où tu n'as rien derrière. Une table demande vingt à trente minutes, et finir dans la précipitation ruine l'intérêt de l'exercice.</p>
      <p>Estomac plutôt vide : compte deux à trois heures après un repas complet. Une digestion en cours augmente la consommation d'oxygène et raccourcit tout.</p>
      <p>Pas de café dans l'heure qui précède, pas d'effort intense dans les deux heures. Allonge-toi, ou installe-toi le dos calé, et laisse cinq minutes au rythme cardiaque pour redescendre avant de lancer le chrono.</p>
      <p>Le froid, le bruit, un vêtement serré à la taille : tout ce qui mobilise l'attention coûte des secondes.</p>
    `)}

    ${guideSection('pendant', 'Pendant les phases', `
      <p><b class="tm-rest">La respiration</b> se fait normalement. C'est le point le plus souvent mal compris : il ne s'agit pas de se charger en oxygène. Le sang est déjà saturé au repos, on ne peut pas y ajouter grand-chose. Respire calmement, par le ventre, sans forcer l'amplitude.</p>
      <p><b>L'hyperventilation est à proscrire.</b> Souffler fort et vite avant une apnée fait chuter le gaz carbonique et retarde artificiellement l'envie de respirer. L'apnée paraît plus facile, mais l'oxygène, lui, s'épuise au même rythme. C'est exactement le mécanisme des syncopes sans signe avant-coureur.</p>
      <p>La dernière inspiration se prend sans excès, autour de quatre-vingts pour cent de ta capacité. Un thorax gonflé à bloc crée une tension qui se paie en contractions précoces.</p>
      <p><b class="tm-hold">Pendant l'apnée</b>, ne bouge pas. Chaque geste consomme. Le corps se détache en trois temps : d'abord le calme, puis les premières contractions du diaphragme, puis leur intensification. Les contractions sont normales et attendues, elles ne signalent aucun danger immédiat — elles marquent le début du travail utile.</p>
    `)}

    ${guideSection('arret', 'Quand arrêter', `
      <p>Une table s'interrompt, elle ne se force pas. Le bouton d'arrêt d'apnée est là pour ça, et l'utiliser n'est pas un échec : c'est le comportement correct.</p>
      <p>Tu arrêtes immédiatement, sans discussion, devant l'un de ces signes : vertige, fourmillements dans les mains ou les lèvres, trouble de la vision, sensation de chaleur qui monte, contractions devenues ingérables, ou perte du fil de ce que tu fais.</p>
      <p>Après une apnée interrompue, reprends une respiration ample et laisse le temps de récupération complet avant de décider si tu continues. Écourter la récupération pour rattraper le programme est la meilleure façon de transformer une séance ratée en séance dangereuse.</p>
      <p>Si tu as dû arrêter trois apnées d'affilée, la table est trop dure pour aujourd'hui. Ce n'est pas une question de volonté : ton max du jour dépend du sommeil, du stress et de la digestion, et il varie facilement de vingt pour cent.</p>
    `)}

    ${guideSection('semaine', 'Placer les tables dans la semaine', `
      <p>Une table par séance, jamais deux. Enchaîner une CO₂ et une O₂ dans la même session cumule les deux fatigues sans bénéfice supplémentaire.</p>
      <p>Deux à trois séances par semaine suffisent largement à progresser. Au-delà, la récupération devient le facteur limitant et les gains s'aplatissent.</p>
      <p>Alterne les types plutôt que de les empiler : une CO₂, un jour de repos, une O₂. Si tu ne devais en garder qu'une, la CO₂ est celle qui rend service le plus vite, parce que la tolérance à l'inconfort progresse plus rapidement que l'adaptation physiologique.</p>
      <p>Les tables tolèrent mal d'être posées juste après une grosse séance de sport. Place-les le matin, ou sur un jour léger.</p>
    `)}

    ${guideSection('max', 'Le test de max', `
      <p>Le max sert de base de calcul à toutes tes tables : le fausser fausse tout le reste. Prends une valeur atteinte confortablement, pas un record arraché un jour de forme.</p>
      <p>Teste-le rarement, une fois par mois au plus. Un test de max est une séance à lui seul, il ne s'ajoute pas à une table.</p>
      <p>S'il progresse de plus de vingt pour cent d'un coup, méfie-toi : c'est souvent le signe d'une hyperventilation involontaire plutôt que d'un vrai gain.</p>
      <p>Et un max qui stagne pendant des semaines n'a rien d'anormal. La tolérance progresse avant la durée, et ça ne se voit pas sur le chrono.</p>
    `)}

    ${guideSection('souffle', 'Où placent les pratiques de souffle', `
      <p>Les exercices de l'onglet Souffle ne remplacent pas les tables et ne s'y substituent pas dans la progression. Ils travaillent autre chose : la régulation du système nerveux, la qualité du relâchement, l'habitude de respirer par le nez.</p>
      <p>La <b>respiration carrée</b> en est la porte d'entrée, et elle se décline en trois niveaux. Le <b>carré ouvert</b> retire la rétention poumons vides, celle qui bloque le plus souvent au début. Le <b>carré</b> classique rétablit les quatre temps égaux. Le <b>carré progressif</b> allonge le côté au fil de la séance, ce qui en fait le plus proche d'un vrai travail de tolérance.</p>
      <p>Ils se placent bien les jours sans table, ou juste avant une table pour arriver posé. Le Buteyko est le plus proche du travail de tolérance au gaz carbonique ; le NSDR sert la récupération.</p>
      <p>C'est pour ça qu'ils n'ont pas de courbe de progression : il n'y a rien à battre.</p>
    `)}

    <button class="btn ghost" style="margin-top:20px" onclick="reviewDisclaimer()">Relire les six points de sécurité</button>

    <p class="hint" style="margin-top:20px">Ce guide résume des principes largement partagés dans la pratique de l'apnée. Il ne remplace pas une formation encadrée : si tu comptes pratiquer dans l'eau un jour, passe par un club et un binôme, jamais par une app.</p>

    <button class="btn ghost" style="margin-top:14px" onclick="goto('settings')">Retour</button>
    ${tabbar('settings')}
  </div>`;
}

/* =====================================================================
   AVERTISSEMENT DE SÉCURITÉ

   Une case unique « j'accepte » n'a aucune valeur probante : elle se
   coche sans lire. Chaque risque a donc sa propre case, et l'acceptation
   est horodatée avec la version du texte, pour pouvoir prouver plus tard
   ce qui a été accepté et quand.
   ===================================================================== */

const DISCLAIMER_VERSION = '1.0';

const RISKS = [
  { id:'sec',   t:"La pratique se fait à sec, jamais dans l'eau",
    d:"Une syncope survenue à sec provoque une chute ; survenue dans l'eau, elle provoque une noyade. Cela vaut aussi pour un bord de bassin ou une baignoire. Les accidents graves concernent presque toujours des pratiquants seuls dans l'eau." },

  { id:'pos',   t:"Allongé ou assis, dans un endroit sûr",
    d:"La perte de connaissance peut survenir sans signe annonciateur. Debout, au volant, en marchant ou en hauteur, elle expose à des blessures indépendantes de l'apnée elle-même." },

  { id:'hyper', t:"Sans hyperventilation préalable",
    d:"Respirer fort et vite avant une apnée abaisse le taux de gaz carbonique et retarde l'envie de respirer, sans ralentir la consommation d'oxygène. C'est le mécanisme des syncopes qui surviennent sans avertissement." },

  { id:'stop',  t:"Une séance s'interrompt dès le premier signal",
    d:"Vertige, fourmillements dans les mains ou les lèvres, trouble de la vision, sensation de chaleur qui monte, perte du fil : ce sont des motifs d'arrêt immédiat, pas des étapes à franchir." },

  { id:'med',   t:"Certains états de santé demandent un avis médical",
    d:"Trouble cardiaque ou respiratoire, hypertension, épilepsie, antécédent de perte de connaissance, grossesse. Inspir ne délivre aucun conseil médical et ne remplace pas une formation encadrée." },

  { id:'age',   t:"Pratique réservée aux personnes majeures",
    d:"L'entraînement à l'apnée sans encadrement n'est pas destiné aux mineurs." }
];

let riskChecked = {};

function disclaimerAccepted(){
  return !!(S.disclaimer && S.disclaimer.acceptedAt);
}

function viewDisclaimer(){
  const all = RISKS.every(r=>riskChecked[r.id]);
  return `
  <div class="screen">
    <div class="eyebrow">Avant de commencer</div>
    <h1>Ce qu'il faut savoir</h1>
    <p class="sub">L'apnée statique peut provoquer une perte de connaissance, sans signe annonciateur, y compris chez une personne entraînée. Voici les six points qui distinguent une pratique sûre d'une pratique dangereuse. Chacun se coche une fois lu.</p>

    <div class="risks">
      ${RISKS.map(r=>`
        <button class="risk ${riskChecked[r.id]?'on':''}" onclick="riskChecked['${r.id}']=!riskChecked['${r.id}'];render()">
          <span class="risk-box">${riskChecked[r.id]?'✓':''}</span>
          <span class="risk-txt" data-t><b>${t(r.t)}</b><em>${t(r.d)}</em></span>
        </button>`).join('')}
    </div>

    <p class="hint" style="margin-top:18px">Inspir est un outil de minutage et de suivi. L'application ne surveille aucun état physiologique, ne détecte pas les malaises et ne peut pas porter secours. La responsabilité de la pratique appartient à celui qui la mène.</p>

    <button class="btn primary" ${all?'':'disabled style="opacity:.4"'} onclick="${all?'acceptDisclaimer()':''}">
      ${all ? "J'ai lu et compris ces six points" : (RISKS.length - Object.values(riskChecked).filter(Boolean).length) + ' point' + ((RISKS.length - Object.values(riskChecked).filter(Boolean).length) > 1 ? 's' : '') + ' à lire'}
    </button>
    <button class="btn ghost" onclick="declineDisclaimer()">Plus tard</button>
    ${disclaimerAccepted() ? `<button class="btn ghost" onclick="goto('settings')">Retour</button>` : ''}
  </div>`;
}

function acceptDisclaimer(){
  S.disclaimer = {
    acceptedAt: Date.now(),
    version: DISCLAIMER_VERSION,
    points: RISKS.map(r=>r.id)
  };
  save();
  const next = discIntent; discIntent = null;
  riskChecked = {};
  if(next) next(); else goto('home');
  toast('Merci, c\'est noté.');
}

function declineDisclaimer(){
  openModal({
    title:'Cet écran reviendra',
    body:"Ces six points conditionnent le démarrage d'une séance. Le reste de l'application demeure accessible entre-temps, notamment le guide d'entraînement.",
    actions:[{ label:'Revenir aux six points' }, { label:'Fermer', fn:()=>goto(disclaimerAccepted()?'settings':'gate') }]
  });
}

/* Portail : toute séance passe par ici */
let discIntent = null;
/* Relecture depuis les réglages : les cases repartent cochées,
   pour consulter sans avoir à tout re-cocher. */
function reviewDisclaimer(){
  riskChecked = {};
  if(disclaimerAccepted()) RISKS.forEach(r=>riskChecked[r.id] = true);
  discIntent = null;
  goto('disclaimer');
}

function requireDisclaimer(then){
  if(disclaimerAccepted()){ then(); return; }
  discIntent = then;
  riskChecked = {};
  goto('disclaimer');
}

/* ---------- catalogue des programmes ---------- */
let progSel = null, progDur = null;

function viewPrograms(){
  const cards = Object.entries(PROGRAMS).map(([k,p])=>`
    <button class="tile" onclick="openProgram('${k}')">
      <div class="tile-top"><span class="tile-tag prog-tag">${p.tag}</span>
        <span class="tile-name" data-t>${t(p.name)}</span></div>
      <div class="tile-desc" data-t>${t(p.lede)}</div>
      <div class="tile-meta">${p.durations.join(' · ')} semaines</div>
    </button>`).join('');

  return `
  <div class="screen">
    <div class="eyebrow">Progression</div>
    <h1>Programmes</h1>
    <p class="sub">Une trame de plusieurs semaines qui décide pour toi de l'alternance, de la difficulté et du moment de retester ton max.</p>

    ${S.program && progDef() ? `<div class="card flat">
      <div class="hist-t">${progDef().name} en cours</div>
      <div class="hist-m" style="margin-bottom:14px">Semaine ${progWeek()} sur ${progTotalWeeks()} · assiduité ${progAdherence().pct} %</div>
      <button class="btn ghost" style="margin:0" onclick="stopProgram()">Arrêter le programme</button>
    </div>` : ''}

    ${cards}

    <p class="hint">Les tables d'un programme sont calculées depuis ton max courant et n'encombrent pas ta bibliothèque. Tes tables personnelles restent intactes.</p>
    <button class="btn ghost" style="margin-top:14px" onclick="goto('home')">Retour</button>
    ${tabbar('home')}
  </div>`;
}

function openProgram(k){
  progSel = k;
  progDur = PROGRAMS[k].durations[Math.min(1, PROGRAMS[k].durations.length-1)];
  goto('programOffer');
}

function slotLabel(sl){
  if(sl.t === 'max') return 'Test de max';
  if(sl.t === 'breath') return BREATH[sl.b] ? t(BREATH[sl.b].name) : t('Respiration');
  return (sl.t === 'co2' ? 'Table CO₂' : 'Table O₂') + ' · ' + DIFF[sl.d].name;
}

function viewProgramOffer(){
  const p = PROGRAMS[progSel];
  if(!p) return viewPrograms();
  const list = p.phases[progDur] || [];
  let wk = 1;
  const phases = list.map(ph=>{
    const from = wk, to = wk + ph.weeks - 1; wk = to + 1;
    return `<div class="plan-row" style="grid-template-columns:52px 1fr">
      <span class="pn">${from === to ? 'S'+from : 'S'+from+'-'+to}</span>
      <span style="font-size:13.5px" data-t>${t(ph.name)}<em style="display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:3px">${t(ph.focus)}</em></span>
    </div>`;
  }).join('');

  const first = list[0] ? list[0].week.map(sl=>`<div class="plan-row" style="grid-template-columns:1fr">
      <span style="font-size:13.5px">${slotLabel(sl)}</span></div>`).join('') : '';

  return `
  <div class="screen">
    <div class="eyebrow">${p.tag}</div>
    <h1 data-t>${t(p.name)}</h1>
    <p class="sub" data-t>${t(p.lede)}</p>

    <h2>Comment ça marche</h2>
    <div class="card flat"><p data-t style="font-size:13.5px;color:var(--mute);margin:0;line-height:1.65">${t(p.how)}</p></div>

    ${p.durations.length > 1 ? `
      <h2 style="margin-top:26px">Durée</h2>
      <div class="seg" style="grid-template-columns:repeat(${p.durations.length},1fr);margin-bottom:20px">
        ${p.durations.map(d=>`<button class="${progDur===d?'on':''}" onclick="progDur=${d};render()">${d} sem</button>`).join('')}
      </div>` : ''}

    <h2 style="margin-top:${p.durations.length>1?'0':'26px'}">Phases</h2>
    <div class="plan">${phases}</div>

    <h2 style="margin-top:26px">Première semaine type</h2>
    <div class="plan">${first}</div>
    <p class="hint">Jamais deux tables le même jour. Les jours vides font partie du programme.</p>

    <button class="btn primary" onclick="confirmStart()">Lancer ce programme</button>
    <button class="btn ghost" onclick="goto('programs')">Retour</button>
    ${tabbar('home')}
  </div>`;
}

function confirmStart(){
  const run = () => startProgram(progSel, progDur);
  if(!S.program) return run();
  askConfirm('Remplacer le programme en cours ?',
    'Tu suis actuellement ' + progDef().name + ', semaine ' + progWeek() + ' sur ' + progTotalWeeks() +
    '. Le nouveau programme repartira de la semaine 1. Ton journal de séances n\'est pas touché.',
    'Remplacer', run);
}

/* --- détail du programme en cours, semaine par semaine --- */
function viewProgramDetail(){
  if(!S.program || !progDef()) return viewPrograms();
  const d = progDef(), cur = progWeek(), tot = progTotalWeeks(), adh = progAdherence();

  const weeks = [];
  for(let w=1; w<=tot; w++){
    const ph = progPhaseAt(w), slots = progSlots(w);
    const done = slots.filter(x=>slotDone(x.key)).length;
    const state = w < cur ? 'past' : w === cur ? 'now' : 'next';
    weeks.push(`<div class="pweek ${state}">
      <div class="pweek-h">
        <span class="pweek-n">Semaine ${w}</span>
        <span class="pweek-p" data-t>${ph ? t(ph.name) : ''}</span>
        <span class="pweek-c">${done}/${slots.length}</span>
      </div>
      ${slots.map(sl=>`<div class="pweek-s ${slotDone(sl.key)?'ok':''}">
        <span>${slotLabel(sl)}</span><span>${slotDone(sl.key)?'✓':''}</span></div>`).join('')}
    </div>`);
  }

  return `
  <div class="screen">
    <div class="eyebrow">Programme en cours</div>
    <h1 data-t>${t(d.name)}</h1>
    <p class="sub">Semaine ${cur} sur ${tot} · démarré le ${new Date(S.program.startDate).toLocaleDateString(locale(),{day:'numeric',month:'long'})}</p>

    <div class="card">
      <div class="stat-grid">
        <div class="stat"><div class="stat-v">${cur}/${tot}</div><div class="stat-l">Semaines</div></div>
        <div class="stat"><div class="stat-v">${adh.done}/${adh.total}</div><div class="stat-l">Séances honorées</div></div>
        <div class="stat"><div class="stat-v">${adh.pct} %</div><div class="stat-l">Assiduité</div></div>
        <div class="stat"><div class="stat-v">${fmt(S.pb)}</div><div class="stat-l">Max courant</div></div>
      </div>
    </div>

    <h2 style="margin-top:26px">Déroulé</h2>
    ${weeks.join('')}

    <button class="btn ghost" style="margin-top:16px" onclick="goto('home')">Retour</button>
    <button class="btn ghost" style="color:var(--danger);border-color:rgba(224,121,108,.28)"
            onclick="stopProgram()">Arrêter le programme</button>
    ${tabbar('home')}
  </div>`;
}

/* Le corps du mail embarque le contexte technique : sans ça, chaque
   échange commence par trois allers-retours pour savoir quelle version. */
function supportMail(sujet){
  const ctx = [
    '',
    '',
    '— — — — —',
    'Merci de laisser ces lignes, elles aident au diagnostic :',
    'Version : Inspir ' + APP_VERSION + ' (build ' + APP_BUILD + ')',
    'Compte : ' + (S.cloudEmail || 'non connecté'),
    'Tables : ' + S.tables.length + ' · Séances : ' + S.history.length,
    'Appareil : ' + navigator.userAgent,
    'Langue : ' + (navigator.language || '—')
  ].join('\n');
  return 'mailto:' + SUPPORT_EMAIL +
    '?subject=' + encodeURIComponent('[Inspir] ' + sujet) +
    '&body=' + encodeURIComponent(ctx);
}

    </div>

    <h2 style="margin-top:26px">Aide</h2>
    <button class="tile" onclick="goto('guide')">
      <div class="tile-top"><span class="tile-name">Guide d'entraînement</span></div>
      <div class="tile-desc">Ce que travaillent les tables, comment préparer une séance, quand arrêter, comment les placer dans la semaine.</div>
    </button>
    <button class="tile" onclick="goto('help')">
      <div class="tile-top"><span class="tile-name">Aide et contact</span></div>
      <div class="tile-desc">Questions fréquentes, problèmes courants, et comment signaler un bug ou proposer une amélioration.</div>
    </button>
    <button class="tile" onclick="reviewDisclaimer()">
      <div class="tile-top"><span class="tile-name">Avertissement de sécurité</span></div>
      <div class="tile-desc">${disclaimerAccepted()
        ? 'Lu le ' + new Date(S.disclaimer.acceptedAt).toLocaleDateString(locale(),{day:'numeric',month:'long',year:'numeric'}) + ' · version ' + S.disclaimer.version
        : 'Pas encore lu. Nécessaire avant la première séance.'}</div>
    </button>

    <h2 style="margin-top:26px">Comment les tables sont construites</h2>
    <div class="card flat">
      <p style="font-size:13.5px;color:var(--mute);margin:0 0 10px"><b style="color:var(--bone)">Table CO₂</b> — 8 apnées de durée identique, calées sur ${Math.round(DIFF.facile.co2*100)} / ${Math.round(DIFF.normal.co2*100)} / ${Math.round(DIFF.difficile.co2*100)} % du max selon la difficulté. La respiration démarre à ${fmt(CO2_REST0)} et perd ${CO2_STEP} s à chaque cycle, jusqu'à 0:10. Le CO₂ s'accumule, l'envie de respirer arrive de plus en plus tôt.</p>
      <p style="font-size:13.5px;color:var(--mute);margin:0 0 10px"><b style="color:var(--bone)">Table O₂</b> — respiration constante (un quart du max, minimum 1:00). La dernière apnée vaut ${Math.round(DIFF.facile.o2*100)} / ${Math.round(DIFF.normal.o2*100)} / ${Math.round(DIFF.difficile.o2*100)} % du max ; le pas entre deux apnées s'élargit automatiquement quand la table s'allonge. Chaque apnée descend plus bas en oxygène que la précédente.</p>
      <p style="font-size:13.5px;color:var(--mute);margin:0">Toutes les durées sont arrondies au multiple de 5 s inférieur, et chaque table se termine par une minute de récupération libre.</p>
    </div>

    <div class="safety">
      <ul>
        <li><b>À sec uniquement.</b> Ces tables ne se font jamais dans l'eau ni au bord de l'eau.</li>
        <li><b>Allongé ou assis</b>, jamais debout, jamais au volant.</li>
        <li><b>Pas d'hyperventilation</b> pendant les récupérations : respiration normale.</li>
        <li><b>Une table par jour</b>, et jamais O₂ et CO₂ dans la même séance.</li>
        <li>Vertige, fourmillement, trouble visuel : tu arrêtes immédiatement.</li>
      </ul>
    </div>

    <button class="btn ghost" onclick="wipe()">Effacer les données de cet appareil</button>

    ${LANG !== 'fr' ? `<button class="btn ghost" style="margin-top:16px" onclick="exportMissing()">
      Exporter les chaînes non traduites (${MISSING.size})</button>
      <p class="hint">Se remplit au fil de la navigation : chaque écran visité ajoute ce qui lui manque.</p>` : ''}

    <p class="hint" style="text-align:center;margin-top:22px">Inspir ${APP_VERSION} · build ${APP_BUILD} · ${LANG.toUpperCase()}</p>
    ${tabbar('settings')}
  </div>`;
}
/* Les chaînes non traduites se collectent pendant l'usage réel : c'est
   la seule extraction fiable, le source produisant trop de faux positifs. */
function exportMissing(){
  const list = [...MISSING].sort();
  if(!list.length){ toast(t('Aucune chaîne manquante sur les écrans visités.')); return; }
  const obj = {}; list.forEach(k=>obj[k] = '');
  const txt = JSON.stringify(obj, null, 1);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt)
      .then(()=>toast(list.length + ' ' + t('chaînes copiées dans le presse-papiers.')))
      .catch(()=>showMissing(txt, list.length));
  } else showMissing(txt, list.length);
}
function showMissing(txt, n){
  openModal({
    title: n + ' ' + t('chaînes manquantes'),
    body: t('Copie ce bloc et complète les traductions.'),
    input: { value: txt, text:true },
    actions:[{ label: t('Fermer'), kind:'primary' }]
  });
}

function wipe(){
  askConfirm('Effacer les données de cet appareil ?',
    'Tables, historique et réglages locaux seront supprimés. Si tu es connecté, tout sera récupéré à la prochaine synchronisation.',
    'Effacer', ()=>{ localStorage.removeItem(LS); location.reload(); }, true);
}

/* ---------- tabbar ---------- */
function tabbar(active){
  const t = (key,label,path)=>`<button class="${active===key?'on':''}" onclick="goto('${key==='home'?'home':key}')">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${path}</svg>${label}</button>`;
  return `<nav class="tabbar" style="grid-template-columns:repeat(4,1fr)">
    ${t('home','Tables','<circle cx="12" cy="12" r="8"/><path d="M4.5 14c2-1.6 4-1.6 6 0s4 1.6 6 0"/>')}
    ${t('breath','Souffle','<path d="M3 8h9.5a2.6 2.6 0 1 0-2.6-2.9"/><path d="M3 12h12.2a2.7 2.7 0 1 1-2.7 2.9"/><path d="M3 16h6.5"/>')}
    ${t('history','Séances','<path d="M4 6h16M4 12h16M4 18h10"/>')}
    ${t('settings','Réglages','<circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/>')}
  </nav>`;
}

/* ---------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------- */
load();
migrateIds();
LANG = detectLang();
function needsGate(){ return cloudConfigured && !S.cloudEmail && !gateSkipped; }
if(S.onboarded && needsGate()) route = 'gate';
render();

// Chargement de la traduction : l'app est déjà affichée en français,
// le rendu se rafraîchit dès que le dictionnaire arrive.
if(LANG !== 'fr'){ loadLang(LANG).then(()=>render()); }

// Lien de réinitialisation : Supabase ouvre une session temporaire
if(initSb()){
  initSb().auth.onAuthStateChange((evt)=>{
    if(evt === 'PASSWORD_RECOVERY'){ recoveryMode = true; render(); }
  });
}

// Reprise d'une session cloud existante, sans bloquer l'affichage
(async ()=>{
  const u = await currentUser();
  if(u){ S.cloudEmail = u.email; render(); syncNow(); }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.addEventListener('beforeunload',(e)=>{
  if(RUN.active){ e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
