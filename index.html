<style>
:root{
  --abyss:#06121C;
  --deep:#0C2532;
  --slate:#14384A;
  --aqua:#6FD8D1;
  --aqua-deep:#2E8C95;
  --air:#FFB27A;
  --air-deep:#B4653A;
  --bone:#E8F1F2;
  --mute:#7D98A4;
  --danger:#FF6B5E;
  --font-d:'Saira',system-ui,sans-serif;
  --font-n:'Saira Condensed',system-ui,sans-serif;
  --font-b:'Inter',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--abyss);
  color:var(--bone);
  font-family:var(--font-b);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font-family:inherit}

/* ---------- shell ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;padding:calc(var(--safe-t) + 22px) 20px calc(var(--safe-b) + 108px);max-width:560px;width:100%;margin:0 auto}
.screen.bare{padding-bottom:calc(var(--safe-b) + 24px)}

.eyebrow{font-family:var(--font-b);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--aqua-deep)}
h1{font-family:var(--font-d);font-weight:800;font-size:34px;letter-spacing:-.03em;margin:6px 0 4px;line-height:1.05}
h2{font-family:var(--font-d);font-weight:800;font-size:19px;letter-spacing:-.02em;margin:0 0 10px}
.sub{color:var(--mute);font-size:14px;margin:0 0 26px}

/* ---------- cards ---------- */
.card{background:linear-gradient(160deg,rgba(23,72,94,.55),rgba(12,37,50,.5));border:1px solid rgba(111,216,209,.14);border-radius:18px;padding:18px;margin-bottom:14px}
.card.flat{background:rgba(12,37,50,.42)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}

.pb-val{font-family:var(--font-n);font-weight:700;font-size:56px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pb-unit{font-family:var(--font-b);font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.link{font-size:13px;font-weight:600;color:var(--aqua);border-bottom:1px solid rgba(111,216,209,.35);padding-bottom:1px}

/* ---------- mode tiles ---------- */
.tile{display:block;width:100%;text-align:left;background:rgba(12,37,50,.5);border:1px solid rgba(111,216,209,.14);border-radius:18px;padding:17px 18px;margin-bottom:12px;transition:border-color .18s,transform .12s}
.tile:active{transform:scale(.985)}
.tile-top{display:flex;align-items:baseline;gap:10px}
.tile-tag{font-family:var(--font-n);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--aqua)}
.tile-tag.warm{color:var(--air)}
.tile-name{font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:-.02em}
.tile-desc{color:var(--mute);font-size:13.5px;margin-top:5px;line-height:1.45}
.tile-meta{font-family:var(--font-n);font-size:14px;letter-spacing:.04em;color:var(--bone);opacity:.75;margin-top:9px;font-variant-numeric:tabular-nums}

/* ---------- segmented ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(6,18,28,.7);border:1px solid rgba(111,216,209,.12);border-radius:14px;padding:5px}
.seg button{padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--mute);transition:background .16s,color .16s}
.seg button.on{background:rgba(111,216,209,.16);color:var(--bone)}

/* ---------- table preview ---------- */
.plan{border:1px solid rgba(111,216,209,.14);border-radius:16px;overflow:hidden;margin-bottom:16px}
.plan-row{display:grid;grid-template-columns:38px 1fr 1fr;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid rgba(111,216,209,.09)}
.plan-row:last-child{border-bottom:none}
.plan-row.head{background:rgba(12,37,50,.6);padding:9px 14px}
.plan-row.head span{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.pn{font-family:var(--font-n);font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.pt{font-family:var(--font-n);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pt.rest{color:var(--air)}
.pt.hold{color:var(--aqua)}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:16px;border-radius:15px;font-family:var(--font-d);font-weight:800;font-size:16px;letter-spacing:-.01em;text-align:center;transition:transform .12s,opacity .16s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--aqua);color:#04161A}
.btn.ghost{background:transparent;border:1.5px solid rgba(111,216,209,.28);color:var(--bone)}
.btn.warm{background:var(--air);color:#2A1206}
.btn+.btn{margin-top:10px}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(6,18,28,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(111,216,209,.12);
  padding:9px 0 calc(var(--safe-b) + 9px);z-index:40}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:11px;font-weight:600}
.tabbar button.on{color:var(--aqua)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ---------- RUN screen ---------- */
.run{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 14px) 20px calc(var(--safe-b) + 20px);
  background:radial-gradient(120% 80% at 50% 8%,#0E3244 0%,#06121C 62%);
  transition:background .6s ease}
.run.phase-hold{background:radial-gradient(120% 80% at 50% 8%,#0D3A46 0%,#04101A 62%)}
.run.phase-rest{background:radial-gradient(120% 80% at 50% 8%,#2A2231 0%,#0A1018 62%)}

.run-top{display:flex;align-items:center;justify-content:space-between}
.run-cycle{font-family:var(--font-n);font-size:14px;letter-spacing:.16em;color:var(--mute);font-variant-numeric:tabular-nums}
.run-x{font-size:22px;line-height:1;color:var(--mute);padding:6px 10px}

.run-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.phase-label{font-family:var(--font-d);font-weight:800;font-size:15px;letter-spacing:.22em;text-transform:uppercase;text-align:center}
.phase-label.hold{color:var(--aqua)}
.phase-label.rest{color:var(--air)}

.dial{position:relative;width:min(78vw,320px);aspect-ratio:1}
.dial svg{width:100%;height:100%;display:block}
.dial-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.big{font-family:var(--font-n);font-weight:300;font-size:clamp(58px,20vw,86px);line-height:.86;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.small{font-family:var(--font-n);font-size:15px;letter-spacing:.14em;color:rgba(232,241,242,.55);margin-top:12px;font-variant-numeric:tabular-nums}

.next-up{font-size:13px;color:var(--mute);text-align:center;min-height:19px}
.next-up b{color:rgba(232,241,242,.82);font-weight:600}

.run-ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.run-ctl .btn{margin:0}
.run-ctl.solo{grid-template-columns:1fr}

/* countdown overlay */
.cd{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:rgba(4,16,26,.94)}
.cd span{font-family:var(--font-n);font-weight:300;font-size:34vw;color:var(--aqua);line-height:1;animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:.9}}

/* wave */
.wave-a{fill:var(--aqua);opacity:.30}
.wave-b{fill:var(--aqua);opacity:.16}
.rest .wave-a{fill:var(--air);opacity:.28}
.rest .wave-b{fill:var(--air);opacity:.14}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-300px)}}
#waveA{animation:drift 7s linear infinite}
#waveB{animation:drift 11s linear infinite reverse}

/* ---------- history ---------- */
.hist{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(111,216,209,.1)}
.hist-badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-n);font-weight:700;font-size:13px;letter-spacing:.06em;flex:none}
.hist-badge.co2{background:rgba(255,178,122,.14);color:var(--air)}
.hist-badge.o2{background:rgba(111,216,209,.14);color:var(--aqua)}
.hist-badge.max{background:rgba(232,241,242,.1);color:var(--bone)}
.hist-main{flex:1;min-width:0}
.hist-t{font-weight:600;font-size:14.5px}
.hist-m{font-size:12.5px;color:var(--mute);margin-top:2px}
.hist-r{font-family:var(--font-n);font-size:22px;font-variant-numeric:tabular-nums;color:var(--bone)}

.empty{text-align:center;color:var(--mute);font-size:14px;padding:44px 20px;border:1px dashed rgba(111,216,209,.18);border-radius:16px}

/* ---------- safety ---------- */
.safety{border-left:2px solid var(--danger);padding:2px 0 2px 14px;margin:20px 0}
.safety li{font-size:13.5px;color:var(--mute);margin-bottom:8px;line-height:1.5}
.safety ul{margin:0;padding-left:16px}
.safety b{color:var(--bone);font-weight:600}

.field{width:100%;background:rgba(6,18,28,.75);border:1px solid rgba(111,216,209,.2);border-radius:13px;padding:14px 15px;color:var(--bone);font-size:17px;font-family:var(--font-n);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.field:focus{outline:none;border-color:var(--aqua)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;display:block}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px}

.chip{display:inline-block;font-family:var(--font-n);font-size:13px;letter-spacing:.1em;padding:5px 11px;border-radius:999px;background:rgba(111,216,209,.12);color:var(--aqua);margin-right:6px}
.chip.warm{background:rgba(255,178,122,.12);color:var(--air)}

@media (prefers-reduced-motion:reduce){
  #waveA,#waveB{animation:none}
  .cd span{animation:none}
  *{transition-duration:.01ms !important}
}
</style>

<body>
<div class="app" id="app"></div>

<script>
/* =====================================================================
   STATIQUE — tables O2 / CO2
   Single-file PWA. Vanilla JS. localStorage.
   ===================================================================== */

const LS = 'statique.v1';
let S = {
  pb: 120,                 // max statique en secondes
  level: 'inter',          // debut | inter | avance
  onboarded: false,
  history: [],             // {ts, type, level, pb, holds:[{planned,actual}], totalHold, done}
  sound: true,
  vibrate: true
};

function load(){
  try{ const r = JSON.parse(localStorage.getItem(LS)); if(r) S = Object.assign(S, r); }catch(e){}
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

/* ---------------------------------------------------------------------
   MOTEUR DE TABLES
   Construction calquée sur les tables classiques d'apnée statique à sec.

   CO2 (tolérance au CO2) : durée d'apnée CONSTANTE, récupération DÉCROISSANTE.
   O2  (tolérance à l'hypoxie) : récupération CONSTANTE, apnée CROISSANTE.

   Chaque cycle = récupération (respiration calme) PUIS apnée.
   La 1re récupération sert de ventilation préparatoire.
   --------------------------------------------------------------------- */

const LEVELS = {
  debut:  { name:'Débutant',      co2:{ hold:.40, rest0:150, step:15 }, o2:{ start:.35, inc:.05, rest:150 } },
  inter:  { name:'Intermédiaire', co2:{ hold:.50, rest0:120, step:15 }, o2:{ start:.40, inc:.05, rest:120 } },
  avance: { name:'Avancé',        co2:{ hold:.55, rest0:105, step:12 }, o2:{ start:.45, inc:.05, rest:120 } }
};
const ROUNDS = 8;

function r5(x){ return Math.max(5, Math.round(x/5)*5); }

function buildTable(type, pb, levelKey){
  const L = LEVELS[levelKey];
  const steps = [];
  if(type === 'co2'){
    const hold = r5(pb * L.co2.hold);
    for(let i=0;i<ROUNDS;i++){
      const rest = Math.max(15, L.co2.rest0 - i*L.co2.step);
      steps.push({kind:'rest', dur:rest, cycle:i+1});
      steps.push({kind:'hold', dur:hold, cycle:i+1});
    }
  } else {
    for(let i=0;i<ROUNDS;i++){
      const hold = r5(pb * (L.o2.start + i*L.o2.inc));
      steps.push({kind:'rest', dur:L.o2.rest, cycle:i+1});
      steps.push({kind:'hold', dur:hold, cycle:i+1});
    }
  }
  return steps;
}
function tableTotal(steps){ return steps.reduce((a,s)=>a+s.dur,0); }
function tableHoldTotal(steps){ return steps.filter(s=>s.kind==='hold').reduce((a,s)=>a+s.dur,0); }

/* ---------------------------------------------------------------------
   FORMAT
   --------------------------------------------------------------------- */
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function fmtLong(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  if(m === 0) return s + ' s';
  return m + ' min ' + (s ? String(s).padStart(2,'0') : '00');
}
function dateLabel(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}) +
         ' · ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

/* ---------------------------------------------------------------------
   SON + VIBRATION
   --------------------------------------------------------------------- */
let AC = null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, vol){
  if(!S.sound) return;
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(vol||.22, ac.currentTime + .012);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (dur||.18));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (dur||.18) + .04);
}
function buzz(pattern){
  if(!S.vibrate) return;
  if(navigator.vibrate) navigator.vibrate(pattern);
}
const CUE = {
  tick:   ()=>{ beep(660,.09,.16); buzz(30); },
  goHold: ()=>{ beep(392,.5,.28); buzz([0,180]); },
  endHold:()=>{ beep(880,.16,.26); setTimeout(()=>beep(1174,.28,.26),170); buzz([0,120,80,180]); },
  half:   ()=>{ beep(523,.12,.14); buzz(50); },
  done:   ()=>{ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.3,.26), i*180)); buzz([0,200,100,200,100,400]); }
};

/* ---------------------------------------------------------------------
   WAKE LOCK
   --------------------------------------------------------------------- */
let wakeLock = null;
async function lockScreen(){
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function unlockScreen(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState === 'visible'){
    if(RUN.active) lockScreen();
    if(RUN.active && !RUN.paused) tickLogic();
  }
});

/* ---------------------------------------------------------------------
   ÉTAT DE SESSION
   --------------------------------------------------------------------- */
const RUN = {
  active:false, type:null, level:null, steps:[], idx:0,
  stepStart:0, paused:false, pauseStart:0, pausedMs:0,
  results:[], raf:null, logic:null, cued:{}, countdown:0,
  freeMax:false
};

let route = 'home';
let pending = null;   // {type} pour l'écran de preview

function goto(r){ route = r; render(); window.scrollTo(0,0); }

/* ---------------------------------------------------------------------
   DÉMARRAGE / PILOTAGE
   --------------------------------------------------------------------- */
function startSession(type){
  audio();
  RUN.active = true;
  RUN.type = type;
  RUN.level = S.level;
  RUN.freeMax = (type === 'max');
  RUN.steps = (type === 'max') ? [{kind:'hold', dur:0, cycle:1, free:true}] : buildTable(type, S.pb, S.level);
  RUN.idx = 0;
  RUN.results = [];
  RUN.paused = false; RUN.pausedMs = 0; RUN.cued = {};
  lockScreen();
  if(type === 'max'){
    RUN.countdown = 3;
    RUN.stepStart = 0;
    route = 'run';
    runCountdown();
  } else {
    RUN.stepStart = Date.now();
    goto('run');
  }
  loop();
  RUN.logic = setInterval(tickLogic, 200);
}

function runCountdown(){
  RUN.stepStart = 0;
  render();
  const step = ()=>{
    if(RUN.countdown > 0){
      CUE.tick();
      render();
      RUN.countdown--;
      setTimeout(step, 1000);
    } else {
      RUN.countdown = 0;
      RUN.stepStart = Date.now();
      CUE.goHold();
      render();
    }
  };
  step();
}

function elapsedMs(){
  if(!RUN.stepStart) return 0;
  const now = RUN.paused ? RUN.pauseStart : Date.now();
  return now - RUN.stepStart - RUN.pausedMs;
}
function curStep(){ return RUN.steps[RUN.idx]; }

function loop(){
  cancelAnimationFrame(RUN.raf);
  const frame = ()=>{
    if(!RUN.active) return;
    paint();
    RUN.raf = requestAnimationFrame(frame);
  };
  RUN.raf = requestAnimationFrame(frame);
}

function tickLogic(){
  if(!RUN.active || RUN.paused || !RUN.stepStart) return;
  const st = curStep(); if(!st) return;
  const el = elapsedMs()/1000;

  if(st.free) return;               // test de max : pas de fin automatique

  const rem = st.dur - el;
  const key = RUN.idx + ':';

  if(st.kind === 'rest'){
    if(rem <= 30 && rem > 29 && st.dur > 45 && !RUN.cued[key+'30']){ RUN.cued[key+'30']=1; CUE.half(); }
    if(rem <= 3.4 && !RUN.cued[key+'c'+Math.ceil(rem)] && rem > 0.2){
      RUN.cued[key+'c'+Math.ceil(rem)] = 1; CUE.tick();
    }
  } else {
    const half = st.dur/2;
    if(el >= half && !RUN.cued[key+'h']){ RUN.cued[key+'h']=1; CUE.half(); }
    if(rem <= 5.4 && rem > 0.2 && !RUN.cued[key+'c'+Math.ceil(rem)]){
      RUN.cued[key+'c'+Math.ceil(rem)] = 1; CUE.tick();
    }
  }

  if(rem <= 0) advance(st.dur);
}

function advance(actualHoldSec){
  const st = curStep();
  if(st.kind === 'hold'){
    RUN.results.push({planned: st.dur, actual: Math.round(actualHoldSec)});
    CUE.endHold();
  }
  RUN.idx++;
  RUN.pausedMs = 0; RUN.paused = false;
  if(RUN.idx >= RUN.steps.length){ finish(true); return; }
  RUN.stepStart = Date.now();
  if(curStep().kind === 'hold') CUE.goHold();
  render();
}

function stopHoldEarly(){
  const st = curStep();
  if(!st || st.kind !== 'hold') return;
  const el = elapsedMs()/1000;
  if(st.free){                       // test de max
    RUN.results.push({planned:0, actual: Math.round(el)});
    CUE.endHold();
    finish(true);
    return;
  }
  advance(el);
}

function togglePause(){
  if(RUN.paused){
    RUN.pausedMs += Date.now() - RUN.pauseStart;
    RUN.paused = false;
  } else {
    RUN.pauseStart = Date.now();
    RUN.paused = true;
  }
  render();
}

function abortSession(){
  if(!confirm('Arrêter la séance en cours ?')) return;
  finish(false);
}

function finish(complete){
  clearInterval(RUN.logic); cancelAnimationFrame(RUN.raf);
  unlockScreen();
  RUN.active = false;
  if(complete) CUE.done();

  const totalHold = RUN.results.reduce((a,r)=>a+r.actual,0);
  if(RUN.results.length){
    const entry = {
      ts: Date.now(),
      type: RUN.type,
      level: RUN.level,
      pb: S.pb,
      holds: RUN.results.slice(),
      totalHold,
      done: complete && RUN.idx >= RUN.steps.length
    };
    S.history.unshift(entry);
    S.history = S.history.slice(0,120);
    // Le test de max propose la mise à jour du PB
    if(RUN.type === 'max'){
      const best = RUN.results[0].actual;
      if(best > S.pb){
        setTimeout(()=>{
          if(confirm('Nouveau max : ' + fmt(best) + '.\nMettre à jour ton max de référence ?')){
            S.pb = best; save(); render();
          }
        }, 400);
      }
    }
    save();
  }
  lastSummary = RUN.results.length ? S.history[0] : null;
  goto(lastSummary ? 'summary' : 'home');
}
let lastSummary = null;

/* ---------------------------------------------------------------------
   PEINTURE DU CADRAN (rAF)
   --------------------------------------------------------------------- */
const R_RING = 138, C_RING = 2*Math.PI*R_RING;

function paint(){
  if(route !== 'run') return;
  const st = curStep(); if(!st) return;
  const big = document.getElementById('big');
  const small = document.getElementById('small');
  const ring = document.getElementById('ring');
  const waves = document.getElementById('waves');
  if(!big || !ring) return;

  if(RUN.countdown > 0 || !RUN.stepStart) return;

  const el = elapsedMs()/1000;
  let p, mainTxt, subTxt;

  if(st.free){
    p = Math.min(1, el / Math.max(60, S.pb * 1.2));
    mainTxt = fmt(el);
    subTxt = 'MAX ACTUEL ' + fmt(S.pb);
  } else if(st.kind === 'hold'){
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    subTxt = 'ÉCOULÉ ' + fmt(el) + '  ·  SUR ' + fmt(st.dur);
  } else {
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    const nx = RUN.steps[RUN.idx+1];
    subTxt = nx ? 'APNÉE SUIVANTE ' + fmt(nx.dur) : '';
  }

  big.textContent = mainTxt;
  if(small) small.textContent = subTxt;
  ring.style.strokeDashoffset = String(C_RING * (1 - p));
  if(waves) waves.setAttribute('transform', 'translate(0,' + (300 - p*310).toFixed(1) + ')');
}

/* ---------------------------------------------------------------------
   RENDU
   --------------------------------------------------------------------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(!S.onboarded)        html = viewOnboard();
  else if(route === 'run')     html = viewRun();
  else if(route === 'preview') html = viewPreview();
  else if(route === 'summary') html = viewSummary();
  else if(route === 'history') html = viewHistory();
  else if(route === 'settings')html = viewSettings();
  else                          html = viewHome();
  app.innerHTML = html;
  if(route === 'run') paint();
}

/* ---------- onboarding ---------- */
function viewOnboard(){
  return `
  <div class="screen bare">
    <div class="eyebrow">Apnée statique · à sec</div>
    <h1>Statique.</h1>
    <p class="sub">Tables O2 et CO2 construites sur ton max, avec un chrono plein écran.</p>

    <div class="safety">
      <ul>
        <li><b>Toujours à sec.</b> Jamais dans l'eau, jamais au bord d'un bassin, jamais dans un bain.</li>
        <li><b>Allongé ou assis</b>, dans un endroit sûr. Jamais debout, jamais en conduisant, jamais en marchant.</li>
        <li><b>Pas d'hyperventilation.</b> Respiration calme et normale pendant les récupérations.</li>
        <li><b>Tu arrêtes</b> au moindre vertige, fourmillement, trouble visuel ou contraction ingérable. Une table s'interrompt, elle ne se force pas.</li>
        <li><b>Une table par jour.</b> Ne pas enchaîner O2 et CO2 dans la même séance : laisse au moins quelques heures entre les deux.</li>
        <li>Si tu as un problème cardiaque, respiratoire, une hypertension, une épilepsie ou si tu es enceinte, demande un avis médical avant.</li>
      </ul>
    </div>

    <div class="card">
      <label class="lbl" for="pbIn">Ton max de retenue de souffle</label>
      <input class="field" id="pbIn" type="text" inputmode="numeric" value="${fmt(S.pb)}" placeholder="2:00">
      <p class="hint">Format m:ss. Prends une valeur atteinte confortablement, pas un record arraché. Tu pourras la mesurer plus tard avec le test de max.</p>
    </div>

    <button class="btn primary" onclick="finishOnboard()">J'ai compris, commencer</button>
  </div>`;
}
function finishOnboard(){
  const v = parseTime(document.getElementById('pbIn').value);
  if(!v || v < 15){ alert('Entre un max valide, au format m:ss (minimum 0:15).'); return; }
  S.pb = v; S.onboarded = true; save(); goto('home');
}
function parseTime(str){
  str = String(str||'').trim().replace(',', ':').replace(/\s/g,'');
  if(/^\d+$/.test(str)) return parseInt(str,10);
  const m = str.match(/^(\d+):(\d{1,2})$/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

function setLevel(k){ S.level = k; save(); render(); }
function editPB(){
  const v = prompt('Ton max de retenue de souffle (m:ss)', fmt(S.pb));
  if(v === null) return;
  const p = parseTime(v);
  if(!p || p < 15){ alert('Valeur invalide.'); return; }
  S.pb = p; save(); render();
}

/* ---------- preview table ---------- */
function openPreview(type){ pending = {type}; goto('preview'); }

function viewPreview(){
  const type = pending.type;
  const steps = buildTable(type, S.pb, S.level);
  const isCO2 = type === 'co2';
  const rows = [];
  for(let i=0;i<ROUNDS;i++){
    const rest = steps[i*2], hold = steps[i*2+1];
    rows.push(`<div class="plan-row">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <span class="pt rest">${fmt(rest.dur)}</span>
      <span class="pt hold">${fmt(hold.dur)}</span>
    </div>`);
  }
  return `
  <div class="screen">
    <div class="eyebrow">${isCO2 ? 'Table CO₂' : 'Table O₂'} · ${LEVELS[S.level].name}</div>
    <h1>${isCO2 ? 'Tolérance au CO₂.' : 'Tolérance à l\'hypoxie.'}</h1>
    <p class="sub">${isCO2
      ? 'Construite sur ' + Math.round(LEVELS[S.level].co2.hold*100) + ' % de ton max. La récupération perd ' + LEVELS[S.level].co2.step + ' s à chaque cycle.'
      : 'De ' + Math.round(LEVELS[S.level].o2.start*100) + ' % à ' + Math.round((LEVELS[S.level].o2.start + 7*LEVELS[S.level].o2.inc)*100) + ' % de ton max, récupération fixe.'}</p>

    <div>
      <span class="chip warm">RÉCUP ${isCO2 ? 'DÉCROISSANTE' : 'FIXE'}</span>
      <span class="chip">APNÉE ${isCO2 ? 'FIXE' : 'CROISSANTE'}</span>
    </div>

    <div class="plan" style="margin-top:16px">
      <div class="plan-row head"><span>#</span><span>Récupération</span><span>Apnée</span></div>
      ${rows.join('')}
    </div>

    <div class="card flat">
      <div class="row"><span style="color:var(--mute);font-size:13.5px">Durée totale</span><span class="pt">${fmtLong(tableTotal(steps))}</span></div>
      <div class="row" style="margin-top:8px"><span style="color:var(--mute);font-size:13.5px">Dont apnée</span><span class="pt hold">${fmtLong(tableHoldTotal(steps))}</span></div>
    </div>

    <p class="hint" style="margin-bottom:16px">Chaque cycle commence par la récupération : tu respires calmement, puis tu bloques. La première récupération sert de ventilation préparatoire.</p>

    <button class="btn primary" onclick="startSession('${type}')">Lancer la table</button>
    <button class="btn ghost" onclick="goto('home')">Retour</button>

    ${tabbar('home')}
  </div>`;
}

/* ---------- run ---------- */
function viewRun(){
  const st = curStep();
  if(!st) return '';
  const isHold = st.kind === 'hold';
  const cycleTot = RUN.freeMax ? 1 : ROUNDS;

  if(RUN.countdown > 0){
    return `<div class="cd"><span>${RUN.countdown}</span></div>`;
  }

  const phaseCls = isHold ? 'hold' : 'rest';
  const label = st.free ? 'APNÉE LIBRE' : (isHold ? 'APNÉE' : 'RESPIRE');

  return `
  <div class="run phase-${phaseCls} ${phaseCls}">
    <div class="run-top">
      <span class="run-cycle">${RUN.freeMax ? 'TEST DE MAX' : 'CYCLE ' + st.cycle + ' / ' + cycleTot}</span>
      <button class="run-x" onclick="abortSession()">✕</button>
    </div>

    <div class="run-mid">
      <div class="phase-label ${phaseCls}">${label}</div>

      <div class="dial">
        <svg viewBox="0 0 300 300">
          <defs>
            <clipPath id="disc"><circle cx="150" cy="150" r="126"/></clipPath>
          </defs>
          <g clip-path="url(#disc)">
            <circle cx="150" cy="150" r="126" fill="rgba(255,255,255,.03)"/>
            <g id="waves" transform="translate(0,300)">
              <path id="waveA" class="wave-a" d="${wavePath(9)}"/>
              <path id="waveB" class="wave-b" d="${wavePath(6)}"/>
            </g>
          </g>
          <g transform="rotate(-90 150 150)">
            <circle cx="150" cy="150" r="${R_RING}" fill="none"
                    stroke="rgba(255,255,255,.08)" stroke-width="5"/>
            <circle id="ring" cx="150" cy="150" r="${R_RING}" fill="none"
                    stroke="${isHold ? 'var(--aqua)' : 'var(--air)'}" stroke-width="5" stroke-linecap="round"
                    stroke-dasharray="${C_RING}" stroke-dashoffset="${C_RING}"/>
          </g>
        </svg>
        <div class="dial-face">
          <div class="big" id="big">0:00</div>
          <div class="small" id="small"></div>
        </div>
      </div>

      <div class="next-up">${nextUpText()}</div>
    </div>

    <div class="run-ctl ${isHold ? '' : 'solo'}">
      ${isHold
        ? `<button class="btn ghost" onclick="togglePause()">${RUN.paused ? 'Reprendre' : 'Pause'}</button>
           <button class="btn ${st.free ? 'primary' : 'warm'}" onclick="stopHoldEarly()">${st.free ? 'Stopper' : "J'arrête l'apnée"}</button>`
        : `<button class="btn ghost" onclick="skipRest()">Passer à l'apnée</button>`}
    </div>
  </div>`;
}

function wavePath(amp){
  // Sinusoïde répétée sur 900px de large, remplie vers le bas.
  let d = 'M -300 0';
  for(let x=-300; x<600; x+=150){
    d += ` q 37.5 ${-amp} 75 0 t 75 0`;
  }
  d += ' L 600 340 L -300 340 Z';
  return d;
}

function nextUpText(){
  const st = curStep();
  if(!st || st.free) return 'Tu arrêtes quand tu veux.';
  if(st.kind === 'rest'){
    const nx = RUN.steps[RUN.idx+1];
    return nx ? `Ensuite · <b>apnée ${fmt(nx.dur)}</b>` : '';
  }
  const nx = RUN.steps[RUN.idx+1];
  if(!nx) return 'Dernière apnée de la table.';
  return `Ensuite · <b>récup ${fmt(nx.dur)}</b>`;
}

function skipRest(){
  const st = curStep();
  if(!st || st.kind !== 'rest') return;
  RUN.idx++;
  RUN.pausedMs = 0; RUN.paused = false;
  RUN.stepStart = Date.now();
  CUE.goHold();
  render();
}

/* ---------- summary ---------- */
function viewSummary(){
  const e = lastSummary;
  if(!e) return viewHome();
  const rows = e.holds.map((h,i)=>{
    const off = h.planned ? h.actual - h.planned : 0;
    const col = h.planned && off < -2 ? 'var(--air)' : 'var(--aqua)';
    return `<div class="plan-row" style="grid-template-columns:38px 1fr 1fr">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <span class="pt" style="color:var(--mute)">${h.planned ? fmt(h.planned) : '—'}</span>
      <span class="pt" style="color:${col}">${fmt(h.actual)}</span>
    </div>`;
  }).join('');
  return `
  <div class="screen">
    <div class="eyebrow">${e.done ? 'Table terminée' : 'Séance interrompue'}</div>
    <h1>${e.done ? 'C\'est plié.' : 'Bien joué quand même.'}</h1>
    <p class="sub">${typeLabel(e.type)} · ${LEVELS[e.level] ? LEVELS[e.level].name : ''} · ${dateLabel(e.ts)}</p>

    <div class="card">
      <div class="row">
        <div><div class="pb-val">${fmt(e.totalHold)}</div><div class="pb-unit">Temps total en apnée</div></div>
        <div style="text-align:right"><div class="pb-val" style="font-size:38px">${e.holds.length}</div><div class="pb-unit">apnées</div></div>
      </div>
    </div>

    <div class="plan">
      <div class="plan-row head"><span>#</span><span>Prévu</span><span>Réalisé</span></div>
      ${rows}
    </div>

    <button class="btn primary" onclick="goto('home')">Terminer</button>
    ${tabbar('home')}
  </div>`;
}
function typeLabel(t){ return t === 'co2' ? 'Table CO₂' : t === 'o2' ? 'Table O₂' : 'Test de max'; }

/* ---------- history ---------- */
function viewHistory(){
  const best = S.history.reduce((a,e)=>{
    const m = Math.max(...e.holds.map(h=>h.actual), 0);
    return Math.max(a, m);
  }, 0);
  const items = S.history.length ? S.history.map(e=>{
    const cls = e.type === 'co2' ? 'co2' : e.type === 'o2' ? 'o2' : 'max';
    const tag = e.type === 'co2' ? 'CO₂' : e.type === 'o2' ? 'O₂' : 'MAX';
    const longest = Math.max(...e.holds.map(h=>h.actual), 0);
    return `<div class="hist">
      <div class="hist-badge ${cls}">${tag}</div>
      <div class="hist-main">
        <div class="hist-t">${e.holds.length} apnée${e.holds.length>1?'s':''} · plus longue ${fmt(longest)}</div>
        <div class="hist-m">${dateLabel(e.ts)}${e.done ? '' : ' · interrompue'}</div>
      </div>
      <div class="hist-r">${fmt(e.totalHold)}</div>
    </div>`;
  }).join('') : `<div class="empty">Aucune séance enregistrée.<br>Lance une table depuis l'accueil.</div>`;

  return `
  <div class="screen">
    <div class="eyebrow">Journal</div>
    <h1>Séances.</h1>
    <p class="sub">${S.history.length} séance${S.history.length>1?'s':''} · plus longue apnée ${best ? fmt(best) : '—'}</p>
    ${items}
    ${tabbar('history')}
  </div>`;
}

    <button class="btn ghost" onclick="wipe()">Effacer toutes les données</button>

}
function wipe(){
  if(!confirm('Effacer ton max, ton historique et tes réglages ?')) return;
  localStorage.removeItem(LS);
  location.reload();
}

/* ---------- tabbar ---------- */
function tabbar(active){
  const t = (key,label,path)=>`<button class="${active===key?'on':''}" onclick="goto('${key==='home'?'home':key}')">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${path}</svg>${label}</button>`;
  return `<nav class="tabbar">
    ${t('home','Tables','<circle cx="12" cy="12" r="8"/><path d="M4.5 14c2-1.6 4-1.6 6 0s4 1.6 6 0"/>')}
    ${t('history','Séances','<path d="M4 6h16M4 12h16M4 18h10"/>')}
    ${t('settings','Réglages','<circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/>')}
  </nav>`;
}
