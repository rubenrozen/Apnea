<style>
:root{
  --abyss:#0A1C23;
  --deep:#123039;
  --slate:#1B4451;
  --aqua:#7FC6BE;
  --aqua-deep:#54968F;
  --air:#E4AE8C;
  --air-deep:#A9704D;
  --bone:#EDF2F1;
  --mute:#8CA3A8;
  --danger:#E0796C;
  --hold-c:#E2796B;      /* apnée — rouge */
  --rest-c:#7FBE8C;      /* repos — vert  */
  --ease:cubic-bezier(.22,.61,.36,1);
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --line:rgba(127,198,190,.11);
  --font-d:'Outfit',system-ui,sans-serif;
  --font-n:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-b:'Plus Jakarta Sans',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:
    radial-gradient(120% 70% at 50% -8%, #133741 0%, transparent 58%),
    var(--abyss);
  background-attachment:fixed;
  color:var(--bone);
  font-family:var(--font-b);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font-family:inherit}

/* ---------- shell ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;padding:calc(var(--safe-t) + 22px) 20px calc(var(--safe-b) + 108px);max-width:560px;width:100%;margin:0 auto}
.screen.bare{padding-bottom:calc(var(--safe-b) + 24px)}

.eyebrow{font-family:var(--font-b);font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--aqua-deep)}
h1{font-family:var(--font-d);font-weight:600;font-size:35px;letter-spacing:-.028em;margin:8px 0 6px;line-height:1.1}
h2{font-family:var(--font-d);font-weight:600;font-size:19px;letter-spacing:-.02em;margin:0 0 12px}
.sub{color:var(--mute);font-size:14.5px;line-height:1.6;margin:0 0 26px}

/* ---------- cards ---------- */
.card{background:linear-gradient(158deg,rgba(26,78,100,.42),rgba(12,37,50,.34));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 28px -18px rgba(0,0,0,.8)}
.card.flat{background:rgba(12,37,50,.30);box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}

.pb-val{font-family:var(--font-n);font-weight:300;font-size:54px;line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.pb-unit{font-family:var(--font-b);font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.link{font-size:13px;font-weight:600;color:var(--aqua);border-bottom:1px solid rgba(111,216,209,.35);padding-bottom:1px}

/* ---------- mode tiles ---------- */
.tile{display:block;width:100%;text-align:left;
  background:linear-gradient(158deg,rgba(22,66,86,.34),rgba(12,37,50,.30));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:12px;
  box-shadow:0 8px 26px -20px rgba(0,0,0,.9);
  transition:border-color .35s var(--ease),transform .35s var(--ease),background .35s var(--ease)}
.tile:active{transform:scale(.988);border-color:rgba(111,216,209,.22)}
.tile-top{display:flex;align-items:baseline;gap:10px}
.tile-tag{font-family:var(--font-b);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--aqua)}
.tile-tag.warm{color:var(--air)}
.tm-hold{color:var(--hold-c)}
.tm-rest{color:var(--rest-c)}
.legend{display:flex;gap:16px;align-items:center;margin:-4px 2px 14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tile-name{font-family:var(--font-d);font-weight:600;font-size:17.5px;letter-spacing:-.018em}
.tile-desc{color:var(--mute);font-size:13.5px;margin-top:5px;line-height:1.45}
.tile-meta{font-family:var(--font-n);font-weight:500;font-size:13.5px;letter-spacing:.01em;color:var(--bone);opacity:.72;margin-top:10px;font-variant-numeric:tabular-nums}

/* ---------- segmented ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:rgba(6,18,28,.55);border:1px solid var(--line);border-radius:var(--r-md);padding:5px}
.seg button{padding:11px 4px;border-radius:13px;font-size:13.5px;font-weight:600;color:var(--mute);
  transition:background .4s var(--ease),color .3s var(--ease)}
.seg button.on{background:rgba(111,216,209,.14);color:var(--bone);box-shadow:0 2px 12px -6px rgba(111,216,209,.5)}

/* ---------- table preview ---------- */
.plan{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;background:rgba(12,37,50,.22)}
.plan-row{display:grid;grid-template-columns:38px 1fr 1fr;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid rgba(111,216,209,.09)}
.plan-row:last-child{border-bottom:none}
.plan-row.head{background:rgba(12,37,50,.6);padding:9px 14px}
.plan-row.head span{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.pn{font-family:var(--font-n);font-weight:500;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.pt{font-family:var(--font-n);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pt.rest{color:var(--rest-c)}
.pt.hold{color:var(--hold-c)}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:17px;border-radius:var(--r-md);font-family:var(--font-b);font-weight:600;
  font-size:15.5px;letter-spacing:.005em;text-align:center;
  transition:transform .4s var(--ease),opacity .3s var(--ease),box-shadow .4s var(--ease),background .3s var(--ease)}
.btn:active{transform:scale(.978)}
.btn.primary{background:linear-gradient(152deg,#9AD6CE,#6FB4AC);color:#08221F;
  box-shadow:0 10px 26px -16px rgba(127,198,190,.6)}
.btn.ghost{background:rgba(111,216,209,.04);border:1px solid rgba(111,216,209,.20);color:var(--bone)}
.btn.warm{background:var(--air);color:#2A1206}
.btn+.btn{margin-top:10px}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(3,1fr);
  will-change:auto;
  background:rgba(10,28,35,.92);backdrop-filter:blur(18px) saturate(1.2);border-top:1px solid rgba(127,198,190,.10);
  padding:9px 0 calc(var(--safe-b) + 9px);z-index:40}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:11px;font-weight:600}
.tabbar button.on{color:var(--aqua)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ---------- RUN screen ---------- */
.run ~ .tabbar,.run .tabbar{display:none}
.run{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 14px) 20px calc(var(--safe-b) + 20px);
  background:radial-gradient(125% 80% at 50% 6%,#15414C 0%,#0A1C23 64%);
  transition:background .9s var(--ease)}
.run.phase-hold{background:radial-gradient(125% 80% at 50% 6%,#154550 0%,#081A20 64%)}
.run.phase-rest{background:radial-gradient(125% 80% at 50% 6%,#3A2E2B 0%,#131A1C 64%)}

.run-top{display:flex;align-items:center;justify-content:space-between}
.run-cycle{font-family:var(--font-b);font-weight:500;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.run-x{font-size:22px;line-height:1;color:var(--mute);padding:6px 10px}

.run-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.phase-label{font-family:var(--font-b);font-weight:600;font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;text-align:center}
.phase-label.hold{color:var(--aqua)}
.phase-label.rest{color:var(--air)}

.dial{position:relative;width:min(78vw,320px);aspect-ratio:1}
.dial svg{width:100%;height:100%;display:block}
.dial-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.big{font-family:var(--font-n);font-weight:200;font-size:clamp(56px,19vw,84px);line-height:.9;letter-spacing:-.045em;font-variant-numeric:tabular-nums;text-shadow:0 2px 22px rgba(0,0,0,.45)}
.small{font-family:var(--font-b);font-size:12px;font-weight:500;letter-spacing:.12em;color:rgba(237,242,241,.5);margin-top:14px;font-variant-numeric:tabular-nums}

.next-up{font-size:13px;color:var(--mute);text-align:center;min-height:19px}
.next-up b{color:rgba(232,241,242,.82);font-weight:600}

.run-ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.run-ctl .btn{margin:0}
.run-ctl.solo{grid-template-columns:1fr}

/* countdown overlay */
.cd{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:rgba(4,16,26,.94)}
.cd span{font-family:var(--font-n);font-weight:200;font-size:32vw;letter-spacing:-.04em;color:var(--aqua);line-height:1;animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:.9}}

/* wave */
.wave-a{fill:var(--aqua);opacity:.30}
.wave-b{fill:var(--aqua);opacity:.16}
.rest .wave-a{fill:var(--air);opacity:.28}
.rest .wave-b{fill:var(--air);opacity:.14}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-300px)}}
#waveA{animation:drift 9s linear infinite}
#waveB{animation:drift 14s linear infinite reverse}
#waves{transition:transform .45s var(--ease)}
#ring{transition:stroke-dashoffset .3s linear}

/* ---------- history ---------- */
.hist{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(111,216,209,.1)}
.hist-badge{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-family:var(--font-b);font-weight:700;font-size:12.5px;letter-spacing:.04em;flex:none}
.hist-badge.co2{background:rgba(255,178,122,.14);color:var(--air)}
.hist-badge.o2{background:rgba(111,216,209,.14);color:var(--aqua)}
.hist-badge.max{background:rgba(232,241,242,.1);color:var(--bone)}
.hist-main{flex:1;min-width:0}
.hist-t{font-weight:600;font-size:14.5px}
.hist-m{font-size:12.5px;color:var(--mute);margin-top:2px}
.hist-r{font-family:var(--font-n);font-weight:400;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--bone)}

.empty{text-align:center;color:var(--mute);font-size:14px;padding:44px 20px;
  border:1px dashed rgba(111,216,209,.14);border-radius:var(--r-lg);background:rgba(12,37,50,.16)}

/* ---------- bandeau de confirmation ---------- */
.toast{position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + 78px);z-index:300;
  display:flex;align-items:center;gap:11px;
  background:linear-gradient(150deg,rgba(28,84,92,.97),rgba(17,52,60,.97));
  border:1px solid rgba(127,198,190,.20);border-radius:16px;padding:14px 16px;
  box-shadow:0 16px 40px -20px rgba(0,0,0,.95);
  animation:toastIn .42s var(--ease) both}
.toast.out{animation:toastOut .3s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px)}}
.toast-ico{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--aqua);color:#08221F}
.toast.err .toast-ico{background:var(--danger);color:#2A0F0B}
.toast-txt{font-size:13.5px;font-weight:500;line-height:1.4;color:var(--bone)}

/* états animés du bouton */
.btn.busy{pointer-events:none;animation:breathe 1.5s var(--ease) infinite}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.72;transform:scale(.988)}}
.btn.ok{pointer-events:none;background:linear-gradient(152deg,#A8DED6,#7CC0B8);
  animation:pop-ok .5s var(--ease) both}
@keyframes pop-ok{0%{transform:scale(.97)}55%{transform:scale(1.025)}100%{transform:scale(1)}}

/* bloc compte dans les réglages */
.guide p{font-size:13.5px;color:var(--mute);line-height:1.7;margin:0 0 12px}
.guide p:last-child{margin-bottom:0}
.guide b{color:var(--bone);font-weight:600}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.stat-v{font-family:var(--font-n);font-weight:300;font-size:29px;line-height:1;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;color:var(--bone)}
.stat-l{font-size:11.5px;font-weight:500;color:var(--mute);margin-top:6px;letter-spacing:.02em}

.acc{display:flex;align-items:center;gap:14px}
.acc-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mute)}
.acc-dot.on{background:var(--aqua);box-shadow:0 0 0 4px rgba(127,198,190,.14)}
.acc-mail{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-state{font-size:12.5px;color:var(--mute);margin-top:2px}

/* ---------- portail d'entrée ---------- */
.gate{min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 18px) 22px calc(var(--safe-b) + 26px);max-width:520px;margin:0 auto;width:100%}
.gate-top{display:flex;justify-content:flex-end;margin-bottom:8px}
.gate-x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--mute);font-size:19px;line-height:1;background:rgba(127,198,190,.06);
  transition:color .3s var(--ease),background .3s var(--ease)}
.gate-x:active{background:rgba(127,198,190,.14);color:var(--bone)}
.gate-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;
  animation:rise .5s var(--ease) both}
.gate-mark{width:74px;height:74px;margin-bottom:26px}
.gate h1{font-size:40px;margin:0 0 12px}
.gate-lede{color:var(--mute);font-size:15px;line-height:1.65;margin:0 0 4px;max-width:34ch}
.gate-foot{display:flex;flex-direction:column;gap:10px;animation:rise .5s var(--ease) .1s both}
.gate-skip{text-align:center;font-size:13px;color:var(--mute);padding:12px;margin-top:2px}

/* ---------- modale ---------- */
.veil{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(5,14,18,.62);backdrop-filter:blur(6px);animation:veilIn .3s var(--ease) both}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;background:linear-gradient(170deg,#173D48,#102A33);
  border:1px solid rgba(127,198,190,.14);border-top-left-radius:28px;border-top-right-radius:28px;
  padding:26px 22px calc(var(--safe-b) + 22px);
  box-shadow:0 -20px 60px -30px rgba(0,0,0,.95);animation:sheetIn .42s var(--ease) both}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:rgba(127,198,190,.24);margin:0 auto 20px}
.sheet h3{font-family:var(--font-d);font-weight:600;font-size:21px;letter-spacing:-.024em;margin:0 0 8px}
.sheet p{color:var(--mute);font-size:14px;line-height:1.6;margin:0 0 20px}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen{animation:rise .42s var(--ease) both}
.screen > *:not(.tabbar){animation:rise .5s var(--ease) both}
.screen > .tabbar{animation:none;transform:none}
.screen > *:nth-child(2){animation-delay:.03s}
.screen > *:nth-child(3){animation-delay:.06s}
.screen > *:nth-child(4){animation-delay:.09s}
.screen > *:nth-child(n+5){animation-delay:.12s}

/* ---------- safety ---------- */

<body>
<div class="app" id="app"></div>

<script src="./config.js" onerror="window.STATIQUE_CONFIG=null"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   STATIQUE — tables O2 / CO2
   Single-file PWA. Vanilla JS. localStorage.
   ===================================================================== */

const LS = 'statique.v1';
let S = {
  pb: 120,                 // max statique en secondes
  pbAt: 0,                 // horodatage de la dernière modif du max (arbitrage de synchro)
  onboarded: false,
  tables: [],              // {id, name, type, difficulty, pb, createdAt, updatedAt}
  history: [],             // {id, ts, tableId, type, difficulty, pb, holds, totalHold, done}
  deleted: [],             // ids de tables supprimées localement, à propager
  sound: true,
  vibrate: true,
  cloudEmail: null         // e-mail du compte lié, null si usage local seul
};

function load(){
  try{ const r = JSON.parse(localStorage.getItem(LS)); if(r) S = Object.assign(S, r); }catch(e){}
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  queueSync();
}

/* =====================================================================
   SYNCHRO SUPABASE

   Doctrine : localStorage reste la source de vérité en lecture.
   L'app démarre et tourne sans réseau ; le cloud n'est qu'une copie
   partagée entre appareils. Arbitrage des conflits : dernière écriture
   gagnante, par comparaison d'horodatage.
   ===================================================================== */

/* Config injectée au build depuis les secrets GitHub (voir config.js).
   Absente en local tant que tu n'as pas créé ton config.js : dans ce cas
   l'app reste pleinement fonctionnelle, simplement sans synchro. */
const CFG = window.STATIQUE_CONFIG || null;
const cloudConfigured = !!(CFG && CFG.url && CFG.key);

let sb = null;
let syncState = { busy:false, queued:false, last:0, error:null };

function initSb(){
  if(sb) return sb;
  if(!cloudConfigured || !window.supabase) return null;
  sb = window.supabase.createClient(CFG.url.replace(/\/+$/,''), CFG.key, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
  return sb;
}

function uid(){
  if(crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function isoNow(){ return new Date().toISOString(); }

async function currentUser(){
  const c = initSb(); if(!c) return null;
  try{
    const { data } = await c.auth.getSession();
    return data && data.session ? data.session.user : null;
  }catch(e){ return null; }
}

/* --- Authentification : e-mail + mot de passe --- */
async function signUp(email, password){
  const c = initSb(); if(!c) throw new Error('Client indisponible');
  const { data, error } = await c.auth.signUp({ email, password });
  if(error) throw error;
  return data;
}
async function signIn(email, password){
  const c = initSb(); if(!c) throw new Error('Client indisponible');
  const { data, error } = await c.auth.signInWithPassword({ email, password });
  if(error) throw error;
  return data;
}
async function changeEmail(newEmail){
  const c = initSb(); if(!c) throw new Error('Client indisponible');
  const { error } = await c.auth.updateUser(
    { email: newEmail },
    { emailRedirectTo: location.origin + location.pathname }
  );
  if(error) throw error;
}

/* Vérifie le mot de passe actuel avant de le remplacer.
   Indépendant de l'option "Secure password change" de Supabase. */
async function changePassword(currentPass, newPass){
  const c = initSb(); if(!c) throw new Error('Client indisponible');
  const u = await currentUser();
  if(!u) throw new Error('Session expirée');
  const { error: e1 } = await c.auth.signInWithPassword({ email: u.email, password: currentPass });
  if(e1) throw new Error('Mot de passe actuel incorrect.');
  const { error: e2 } = await c.auth.updateUser({ password: newPass });
  if(e2) throw e2;
}

async function sendReset(email){
  const c = initSb(); if(!c) throw new Error('Client indisponible');
  const { error } = await c.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname
  });
  if(error) throw error;
}

async function deleteAccount(){
  const c = initSb(); if(!c) throw new Error('Client indisponible');
  const { data } = await c.auth.getSession();
  if(!data || !data.session) throw new Error('Session expirée');
  const res = await fetch(CFG.url.replace(/\/+$/,'') + '/functions/v1/delete-account', {
    method:'POST',
    headers:{ Authorization:'Bearer ' + data.session.access_token, apikey: CFG.key }
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(t || 'Suppression impossible (fonction non déployée ?)');
  }
  await c.auth.signOut();
}

async function signOut(){
  const c = initSb(); if(!c) return;
  await c.auth.signOut();
  S.cloudEmail = null; authDraft = { email:'', pass:'', pass2:'' };
  gateSkipped = false;
  save(); goto(cloudConfigured ? 'gate' : 'home');
}

/* --- Envoi des changements locaux --- */
async function cloudPush(user){
  const c = initSb();

  if(S.deleted.length){
    const { error } = await c.from('tables')
      .update({ archived:true }).in('id', S.deleted).eq('user_id', user.id);
    if(!error) S.deleted = [];
  }

  await c.from('profiles').upsert({
    id: user.id, pb: S.pb, sound: S.sound, vibrate: S.vibrate,
    updated_at: new Date(S.pbAt || Date.now()).toISOString()
  }, { onConflict:'id' });

  if(S.tables.length){
    await c.from('tables').upsert(S.tables.map(t=>({
      id: t.id, user_id: user.id, name: t.name, type: t.type,
      difficulty: t.difficulty === 'normal' || t.difficulty === 'facile' || t.difficulty === 'difficile' ? t.difficulty : 'normal',
      pb: t.pb, archived: false,
      created_at: new Date(t.createdAt).toISOString(),
      updated_at: new Date(t.updatedAt || t.createdAt).toISOString()
    })), { onConflict:'id' });
  }

  if(S.history.length){
    await c.from('sessions').upsert(S.history.map(h=>({
      id: h.id, user_id: user.id, table_id: h.tableId || null,
      type: h.type, difficulty: h.difficulty || null, pb: h.pb,
      holds: h.holds, done: !!h.done,
      started_at: new Date(h.ts).toISOString()
    })), { onConflict:'id' });
  }
}

/* --- Récupération et fusion --- */
async function cloudPull(user){
  const c = initSb();
  const [prof, tabs, sess] = await Promise.all([
    c.from('profiles').select('*').eq('id', user.id).maybeSingle(),
    c.from('tables').select('*').eq('user_id', user.id).eq('archived', false),
    c.from('sessions').select('*').eq('user_id', user.id).order('started_at',{ascending:false}).limit(200)
  ]);

  // Profil : la valeur la plus récente l'emporte
  if(prof.data){
    const remoteAt = new Date(prof.data.updated_at).getTime();
    if(remoteAt > (S.pbAt || 0)){
      S.pb = prof.data.pb; S.pbAt = remoteAt;
      S.sound = prof.data.sound; S.vibrate = prof.data.vibrate;
    }
  }

  // Tables : fusion par id, la plus récemment modifiée gagne
  if(tabs.data){
    const byId = new Map(S.tables.map(t=>[t.id, t]));
    for(const r of tabs.data){
      if(S.deleted.includes(r.id)) continue;
      const local = byId.get(r.id);
      const remoteAt = new Date(r.updated_at).getTime();
      if(!local || remoteAt > (local.updatedAt || local.createdAt || 0)){
        byId.set(r.id, {
          id: r.id, name: r.name, type: r.type, difficulty: r.difficulty,
          pb: r.pb, createdAt: new Date(r.created_at).getTime(), updatedAt: remoteAt
        });
      }
    }
    S.tables = [...byId.values()].sort((a,b)=>b.createdAt - a.createdAt);
  }

  // Séances : union simple, elles sont immuables
  if(sess.data){
    const byId = new Map(S.history.map(h=>[h.id, h]));
    for(const r of sess.data){
      if(byId.has(r.id)) continue;
      byId.set(r.id, {
        id: r.id, ts: new Date(r.started_at).getTime(), tableId: r.table_id,
        type: r.type, difficulty: r.difficulty, pb: r.pb,
        holds: r.holds || [], totalHold: r.total_hold, done: r.done
      });
    }
    S.history = [...byId.values()].sort((a,b)=>b.ts - a.ts).slice(0,200);
  }
}

/* --- Orchestration --- */
async function syncNow(){
  if(syncState.busy){ syncState.queued = true; return; }
  const user = await currentUser();
  if(!user) return;
  syncState.busy = true; syncState.error = null;
  try{
    await cloudPush(user);
    await cloudPull(user);
    S.cloudEmail = user.email;
    syncState.last = Date.now();
    try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
    if(['settings','home','history','account'].includes(route)) render();
  }catch(e){
    syncState.error = (e && e.message) ? e.message : 'Synchro impossible';
  }finally{
    syncState.busy = false;
    if(syncState.queued){ syncState.queued = false; setTimeout(syncNow, 800); }
  }
}

let syncTimer = null;
function queueSync(){
  if(!navigator.onLine) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
window.addEventListener('online', ()=>syncNow());

/* --- Migration des identifiants locaux vers des UUID --- */
function migrateIds(){
  let touched = false;
  const map = {};
  S.tables.forEach(t=>{
    if(!/^[0-9a-f-]{36}$/i.test(t.id)){ const n = uid(); map[t.id] = n; t.id = n; touched = true; }
    if(!t.updatedAt) t.updatedAt = t.createdAt || Date.now();
  });
  S.history.forEach(h=>{
    if(!h.id){ h.id = uid(); touched = true; }
    if(h.tableId && map[h.tableId]) h.tableId = map[h.tableId];
  });
  if(!S.pbAt){ S.pbAt = Date.now(); touched = true; }
  if(!Array.isArray(S.deleted)){ S.deleted = []; touched = true; }
  if(touched) try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
}

/* ---------------------------------------------------------------------
   MOTEUR DE TABLES  —  calqué sur STAmina (rétro-ingénierie sur 20 tables)

   Structure : 8 cycles, chaque cycle = respiration PUIS apnée,
   suivis d'une phase finale "se calmer" de 1:00.

   CO2 : apnée constante, respiration décroissante 1:20 -> 0:10 (pas -10 s)
   O2  : respiration constante, apnée croissante

        respiration = max(60, floor5(0.25 * max))
        derniere    = floor5(PCT * max)
        pas         = 5 * max(1, floor(derniere / 85))
        premiere    = derniere - 7 * pas

   La difficulté ne touche qu'un seul coefficient par table.
   --------------------------------------------------------------------- */

const ROUNDS = 8;
const CALM   = 60;

/* =====================================================================
   RESPIRATION — pratiques hors apnée
   Chaque pratique est une boucle de phases répétée N cycles.
   Phases : in (inspire) · hin (rétention poumons pleins) ·
            out (expire) · hout (rétention poumons vides) · free (libre)
   ===================================================================== */

const BREATH = {
  box: {
    name:'Box breathing',
    tag:'BOX',
    lede:"Quatre temps égaux, en carré. Le rythme le plus simple pour ramener le calme avant une table ou après une journée chargée.",
    how:"Assis, dos droit, respiration par le nez. Inspire sur quatre temps, garde poumons pleins, expire sur la même durée, garde poumons vides. Si la rétention vide te crispe, raccourcis-la plutôt que de forcer.",
    durations:[3,5,10],
    cycle: t => [
      {kind:'in',   dur:t, label:'Inspire'},
      {kind:'hin',  dur:t, label:'Retiens'},
      {kind:'out',  dur:t, label:'Expire'},
      {kind:'hout', dur:t, label:'Poumons vides'}
    ],
    steps:[4,5,6],
    stepLabel: v => v + ' temps'
  },

  nadi: {
    name:'Nadi Shodhana',
    tag:'NADI',
    lede:"Respiration alternée par une narine puis l'autre. Pratique issue du yoga, réputée pour équilibrer et poser l'attention.",
    how:"Pouce sur la narine droite, annulaire sur la gauche. Inspire à gauche, bouche les deux, expire à droite, inspire à droite, bouche, expire à gauche. Ce cycle complet compte pour un. Le geste reste léger, on ne comprime pas le nez.",
    durations:[5,10,15],
    cycle: t => [
      {kind:'in',   dur:t,             label:'Inspire · narine gauche'},
      {kind:'hin',  dur:Math.round(t/2), label:'Retiens'},
      {kind:'out',  dur:t,             label:'Expire · narine droite'},
      {kind:'in',   dur:t,             label:'Inspire · narine droite'},
      {kind:'hin',  dur:Math.round(t/2), label:'Retiens'},
      {kind:'out',  dur:t,             label:'Expire · narine gauche'}
    ],
    steps:[4,5,6],
    stepLabel: v => v + ' s par temps'
  },

  buteyko: {
    name:'Méthode Buteyko',
    tag:'BUT',
    lede:"Respiration réduite : on respire moins, pas plus. Travail de tolérance au CO₂ très proche de ce que cherchent les tables.",
    how:"Respiration nasale exclusive, volume délibérément diminué jusqu'à ressentir un manque d'air léger et supportable. La pause de contrôle qui suit se fait après une expiration normale, jamais après une grande inspiration. Tu dois pouvoir reprendre un souffle calme à la fin, sans halètement.",
    durations:[5,10,15],
    cycle: t => [
      {kind:'in',   dur:3,   label:'Inspire courte'},
      {kind:'out',  dur:4,   label:'Expire lente'},
      {kind:'hout', dur:t,   label:'Pause de contrôle'},
      {kind:'free', dur:30,  label:'Respiration normale'}
    ],
    steps:[5,8,12],
    stepLabel: v => 'pause ' + v + ' s'
  },

  nsdr: {
    name:'NSDR',
    tag:'NSDR',
    lede:"Non-Sleep Deep Rest : repos profond sans sommeil. Longues expirations et relâchement progressif, pour récupérer sans dormir.",
    how:"Allongé, yeux fermés, dans un endroit où tu ne seras pas dérangé. L'expiration doit être nettement plus longue que l'inspiration. Laisse le corps devenir lourd, sans chercher à t'endormir. Rien à performer ici : la séance fonctionne même si l'esprit vagabonde.",
    durations:[10,20,30],
    cycle: t => [
      {kind:'in',   dur:4,   label:'Inspire'},
      {kind:'out',  dur:t,   label:'Expire longue'},
      {kind:'free', dur:6,   label:'Relâche'}
    ],
    steps:[6,8,10],
    stepLabel: v => 'expire ' + v + ' s'
  }
};

function buildBreath(key, minutes, stepVal){
  const b = BREATH[key];
  const cycle = b.cycle(stepVal);
  const cycleLen = cycle.reduce((a,p)=>a+p.dur,0);
  const n = Math.max(1, Math.round(minutes * 60 / cycleLen));
  const steps = [];
  for(let i=0;i<n;i++){
    cycle.forEach(p=>steps.push({ ...p, cycle:i+1 }));
  }
  return steps;
}
function breathCycles(key, minutes, stepVal){
  const b = BREATH[key];
  const cycleLen = b.cycle(stepVal).reduce((a,p)=>a+p.dur,0);
  return Math.max(1, Math.round(minutes * 60 / cycleLen));
}

const DIFF = {
  facile:    { name:'Facile',    co2:.40, o2:.65 },
  normal:    { name:'Normal',    co2:.50, o2:.75 },
  difficile: { name:'Difficile', co2:.60, o2:.85 }
};

const CO2_REST0 = 80;   // 1:20
const CO2_STEP  = 10;

function floor5(x){ return Math.max(5, Math.floor(x/5)*5); }

function tableParams(type, pb, diffKey){
  const d = DIFF[diffKey] || DIFF.normal;
  if(type === 'co2'){
    return { type, rest: CO2_REST0, restStep: CO2_STEP, hold: floor5(pb * d.co2) };
  }
  const rest = Math.max(60, floor5(.25 * pb));
  const last = floor5(d.o2 * pb);
  const step = 5 * Math.max(1, Math.floor(last / 85));
  return { type, rest, last, step, first: last - 7*step };
}

/* Table sur mesure : la définition des rounds est portée par la table
   elle-même, aucun calcul dérivé du max. */
function buildCustom(rounds){
  const steps = [];
  (rounds || []).forEach((r,i)=>{
    steps.push({kind:'rest', dur: Math.max(5, r.rest|0), cycle:i+1});
    steps.push({kind:'hold', dur: Math.max(5, r.hold|0), cycle:i+1});
  });
  steps.push({kind:'calm', dur: CALM, cycle:(rounds||[]).length});
  return steps;
}

function buildTable(type, pb, diffKey, rounds){
  if(type === 'custom') return buildCustom(rounds);
  const p = tableParams(type, pb, diffKey);
  const steps = [];
  for(let i=0;i<ROUNDS;i++){
    if(type === 'co2'){
      steps.push({kind:'rest', dur: Math.max(10, p.rest - i*p.restStep), cycle:i+1});
      steps.push({kind:'hold', dur: p.hold, cycle:i+1});
    } else {
      steps.push({kind:'rest', dur: p.rest, cycle:i+1});
      steps.push({kind:'hold', dur: p.first + i*p.step, cycle:i+1});
    }
  }
  steps.push({kind:'calm', dur: CALM, cycle: ROUNDS});
  return steps;
}

/* En-tête façon STAmina : valeur variable (pas) valeur fixe */
function tableHeader(type, pb, diffKey, rounds){
  if(type === 'custom'){
    const rr = rounds || [];
    const holds = rr.map(r=>r.hold), rests = rr.map(r=>r.rest);
    const rg = a => a.length ? (Math.min(...a) === Math.max(...a)
      ? fmt(a[0]) : fmt(Math.min(...a)) + '→' + fmt(Math.max(...a))) : '—';
    return { variable: rg(rests), step: rr.length + ' rounds', fixed: rg(holds), custom:true };
  }
  const p = tableParams(type, pb, diffKey);
  return type === 'co2'
    ? { variable: fmt(p.rest), step: '-' + p.restStep, fixed: fmt(p.hold) }
    : { variable: fmt(p.first), step: '+' + p.step,    fixed: fmt(p.rest) };
}

/* Colorise l'en-tête : repos en vert, apnée en rouge, selon le type */
function headerColored(type, h){
  if(h.custom) return `<span class="tm-rest">${h.variable}</span> · <span class="tm-hold">${h.fixed}</span> · ${h.step}`;
  const v = type === 'co2'
    ? `<span class="tm-rest">${h.variable}</span> (${h.step}) · <span class="tm-hold">${h.fixed}</span>`
    : `<span class="tm-hold">${h.variable}</span> (${h.step}) · <span class="tm-rest">${h.fixed}</span>`;
  return `↻ ${ROUNDS} · ` + v;
}

function tableTotal(steps){ return steps.reduce((a,s)=>a+s.dur,0); }
function tableHoldTotal(steps){ return steps.filter(s=>s.kind==='hold').reduce((a,s)=>a+s.dur,0); }

/* ---------------------------------------------------------------------
   FORMAT
   --------------------------------------------------------------------- */
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function fmtLong(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  if(m === 0) return s + ' s';
  return m + ' min ' + (s ? String(s).padStart(2,'0') : '00');
}
function fmtHM(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  if(h === 0) return m + ' min';
  return h + ' h ' + String(m).padStart(2,'0');
}

function dateLabel(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}) +
         ' · ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

/* ---------------------------------------------------------------------
   SON + VIBRATION
   --------------------------------------------------------------------- */
let AC = null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, vol){
  if(!S.sound) return;
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(vol||.22, ac.currentTime + .012);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (dur||.18));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (dur||.18) + .04);
}
function buzz(pattern){
  if(!S.vibrate) return;
  if(navigator.vibrate) navigator.vibrate(pattern);
}
const CUE = {
  tick:   ()=>{ beep(660,.09,.16); buzz(30); },
  goHold: ()=>{ beep(392,.5,.28); buzz([0,180]); },
  endHold:()=>{ beep(880,.16,.26); setTimeout(()=>beep(1174,.28,.26),170); buzz([0,120,80,180]); },
  half:   ()=>{ beep(523,.12,.14); buzz(50); },
  done:   ()=>{ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.3,.26), i*180)); buzz([0,200,100,200,100,400]); }
};

   --------------------------------------------------------------------- */
let wakeLock = null;
async function lockScreen(){
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function unlockScreen(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState === 'visible'){
    if(RUN.active) lockScreen();
    if(RUN.active && !RUN.paused) tickLogic();
  }
});

/* ---------------------------------------------------------------------
   ÉTAT DE SESSION
   --------------------------------------------------------------------- */
const RUN = {
  active:false, type:null, tableId:null, difficulty:null, pb:null,
  breathKey:null, breathMin:null, restDone:0, steps:[], idx:0,
  stepStart:0, paused:false, pauseStart:0, pausedMs:0,
  results:[], raf:null, logic:null, cued:{}, countdown:0,
  freeMax:false
};

let route = 'home';
let gateSkipped = false;   // remis à zéro à chaque lancement de l'app
let pending = null;   // {type} pour l'écran de preview

function goto(r){ route = r; render(); window.scrollTo(0,0); }

/* ---------------------------------------------------------------------
   DÉMARRAGE / PILOTAGE
   --------------------------------------------------------------------- */
function startBreath(key, minutes, stepVal){
  audio();
  RUN.active = true;
  RUN.type = 'breath';
  RUN.tableId = null; RUN.difficulty = null; RUN.pb = S.pb;
  RUN.breathKey = key; RUN.breathMin = minutes;
  RUN.freeMax = false;
  RUN.steps = buildBreath(key, minutes, stepVal);
  RUN.idx = 0; RUN.results = [];
  RUN.paused = false; RUN.pausedMs = 0; RUN.cued = {}; RUN.restDone = 0;
  RUN.stepStart = Date.now();
  lockScreen();
  goto('run');
  loop();
  RUN.logic = setInterval(tickLogic, 200);
}

function startSession(type){
  audio();
  const t = (type === 'max') ? null : currentTable();
  RUN.active = true;
  RUN.type = type;
  RUN.tableId = t ? t.id : null;
  RUN.difficulty = t ? t.difficulty : null;
  RUN.pb = t ? t.pb : S.pb;
  RUN.freeMax = (type === 'max');
  RUN.steps = (type === 'max')
    ? [{kind:'hold', dur:0, cycle:1, free:true}]
    : buildTable(t.type, t.pb, t.difficulty, t.rounds);
  RUN.idx = 0;
  RUN.results = [];
  RUN.paused = false; RUN.pausedMs = 0; RUN.cued = {}; RUN.restDone = 0;
  lockScreen();
  if(type === 'max'){
    RUN.countdown = 3;
    RUN.stepStart = 0;
    route = 'run';
    runCountdown();
  } else {
    RUN.stepStart = Date.now();
    goto('run');
  }
  loop();
  RUN.logic = setInterval(tickLogic, 200);
}

function runCountdown(){
  RUN.stepStart = 0;
  render();
  const step = ()=>{
    if(RUN.countdown > 0){
      CUE.tick();
      render();
      RUN.countdown--;
      setTimeout(step, 1000);
    } else {
      RUN.countdown = 0;
      RUN.stepStart = Date.now();
      CUE.goHold();
      render();
    }
  };
  step();
}

function elapsedMs(){
  if(!RUN.stepStart) return 0;
  const now = RUN.paused ? RUN.pauseStart : Date.now();
  return now - RUN.stepStart - RUN.pausedMs;
}
function curStep(){ return RUN.steps[RUN.idx]; }

function loop(){
  cancelAnimationFrame(RUN.raf);
  const frame = ()=>{
    if(!RUN.active) return;
    paint();
    RUN.raf = requestAnimationFrame(frame);
  };
  RUN.raf = requestAnimationFrame(frame);
}

function tickLogic(){
  if(!RUN.active || RUN.paused || !RUN.stepStart) return;
  const st = curStep(); if(!st) return;
  const el = elapsedMs()/1000;

  if(st.free) return;               // test de max : pas de fin automatique

  const rem = st.dur - el;
  const key = RUN.idx + ':';

  if(st.kind !== 'hold'){
    if(rem <= 30 && rem > 29 && st.dur > 45 && !RUN.cued[key+'30']){ RUN.cued[key+'30']=1; CUE.half(); }
    if(rem <= 3.4 && !RUN.cued[key+'c'+Math.ceil(rem)] && rem > 0.2){
      RUN.cued[key+'c'+Math.ceil(rem)] = 1; CUE.tick();
    }
  } else {
    const half = st.dur/2;
    if(el >= half && !RUN.cued[key+'h']){ RUN.cued[key+'h']=1; CUE.half(); }
    if(rem <= 5.4 && rem > 0.2 && !RUN.cued[key+'c'+Math.ceil(rem)]){
      RUN.cued[key+'c'+Math.ceil(rem)] = 1; CUE.tick();
    }
  }

  if(rem <= 0) advance(st.dur);
}

function advance(actualHoldSec){
  const st = curStep();
  if(st.kind === 'hold'){
    RUN.results.push({planned: st.dur, actual: Math.round(actualHoldSec)});
    CUE.endHold();
  } else {
    RUN.restDone = (RUN.restDone || 0) + st.dur;
  }
  RUN.idx++;
  RUN.pausedMs = 0; RUN.paused = false;
  if(RUN.idx >= RUN.steps.length){ finish(true); return; }
  RUN.stepStart = Date.now();
  if(curStep().kind === 'hold') CUE.goHold();
  render();
}

function stopHoldEarly(){
  const st = curStep();
  if(!st || st.kind !== 'hold') return;
  const el = elapsedMs()/1000;
  if(st.free){                       // test de max
    RUN.results.push({planned:0, actual: Math.round(el)});
    CUE.endHold();
    finish(true);
    return;
  }
  advance(el);
}

function togglePause(){
  if(RUN.paused){
    RUN.pausedMs += Date.now() - RUN.pauseStart;
    RUN.paused = false;
  } else {
    RUN.pauseStart = Date.now();
    RUN.paused = true;
  }
  render();
}

function abortSession(){
  if(!confirm('Arrêter la séance en cours ?')) return;
  finish(false);
}

function finish(complete){
  clearInterval(RUN.logic); cancelAnimationFrame(RUN.raf);
  unlockScreen();
  RUN.active = false;
  if(complete) CUE.done();

  const totalHold = RUN.results.reduce((a,r)=>a+r.actual,0);
  if(RUN.results.length || RUN.type === 'breath'){
    const entry = {
      id: uid(),
      ts: Date.now(),
      type: RUN.type,
      tableId: RUN.tableId,
      difficulty: RUN.difficulty,
      pb: RUN.pb,
      holds: RUN.results.slice(),
      totalHold,
      totalRest: RUN.restDone || 0,
      breathKey: RUN.breathKey || null,
      breathMin: RUN.breathMin || null,
      done: complete && RUN.idx >= RUN.steps.length
    };
    S.history.unshift(entry);
    S.history = S.history.slice(0,120);
    // Le test de max propose la mise à jour du PB
    if(RUN.type === 'max'){
      const best = RUN.results[0].actual;
      if(best > S.pb){
        setTimeout(()=>{
          if(confirm('Nouveau max : ' + fmt(best) + '.\nMettre à jour ton max de référence ?')){
            S.pb = best; S.pbAt = Date.now(); save(); render();
          }
        }, 400);
      }
    }
    save();
  }
  lastSummary = RUN.results.length ? S.history[0] : null;
  goto(lastSummary ? 'summary' : 'home');
}
let lastSummary = null;

/* ---------------------------------------------------------------------
   PEINTURE DU CADRAN (rAF)
   --------------------------------------------------------------------- */
const R_RING = 138, C_RING = 2*Math.PI*R_RING;

function paint(){
  if(route !== 'run') return;
  const st = curStep(); if(!st) return;
  const big = document.getElementById('big');
  const small = document.getElementById('small');
  const ring = document.getElementById('ring');
  const waves = document.getElementById('waves');
  if(!big || !ring) return;

  if(RUN.countdown > 0 || !RUN.stepStart) return;

  const el = elapsedMs()/1000;
  let p, mainTxt, subTxt;

  if(st.free){
    p = Math.min(1, el / Math.max(60, S.pb * 1.2));
    mainTxt = fmt(el);
    subTxt = 'MAX ACTUEL ' + fmt(S.pb);
  } else if(st.kind === 'hold'){
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    subTxt = 'ÉCOULÉ ' + fmt(el) + '  ·  SUR ' + fmt(st.dur);
  } else if(RUN.type === 'breath'){
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    subTxt = st.label ? st.label.toUpperCase() : '';
  } else if(st.kind === 'calm'){
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    subTxt = 'RÉCUPÉRATION FINALE';
  } else {
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    const nx = RUN.steps[RUN.idx+1];
    subTxt = nx ? 'APNÉE SUIVANTE ' + fmt(nx.dur) : '';
  }

  big.textContent = mainTxt;
  if(small) small.textContent = subTxt;
  ring.style.strokeDashoffset = String(C_RING * (1 - p));
  if(waves) waves.setAttribute('transform', 'translate(0,' + (300 - p*310).toFixed(1) + ')');
}

  else if(route === 'manage')  html = viewManage();
  else if(route === 'breath')  html = viewBreath();

function parseTime(str){
  str = String(str||'').trim().replace(',', ':').replace(/\s/g,'');

  const m = str.match(/^(\d+):(\d{1,2})$/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

  if(v === null) return;
  const p = parseTime(v);
  if(!p || p < PB_MIN || p > PB_MAX){ alert('Valeur invalide (entre 0:15 et 15:00).'); return; }
  S.pb = p; S.pbAt = Date.now(); save(); render();
}

/* ---------- création de table ---------- */
let draft = null;
function ensureDraft(){
  if(!draft) draft = { type:'co2', difficulty:'normal', pb: S.pb, name:'' };
  return draft;
}
function setDraft(k,v){ ensureDraft()[k] = v; render(); }

function defaultName(d){
  if(d.type === 'custom') return 'Sur mesure · ' + (d.rounds ? d.rounds.length : 8) + ' rounds';
  return (d.type === 'co2' ? 'CO₂ ' : 'O₂ ') + fmt(d.pb) + (d.difficulty==='normal' ? '' : ' · ' + DIFF[d.difficulty].name);
}

function viewCreate(){
  const d = ensureDraft();
  const steps = buildTable(d.type, d.pb, d.difficulty, d.rounds);
  const h = tableHeader(d.type, d.pb, d.difficulty, d.rounds);
  return `
  <div class="screen">
    <div class="eyebrow">Nouvelle table</div>
    <h1>Créer.</h1>
    <p class="sub">Le max sert de base de calcul. Tout le reste en découle.</p>

    <label class="lbl">Type</label>
    <div class="seg" style="margin-bottom:20px">
      <button class="${d.type==='co2'?'on':''}" onclick="setDraft('type','co2')">CO₂</button>
      <button class="${d.type==='o2'?'on':''}" onclick="setDraft('type','o2')">O₂</button>
      <button class="${d.type==='custom'?'on':''}" onclick="setDraft('type','custom')">Sur mesure</button>
    </div>

    ${d.type === 'custom' ? roundsEditor(d) : `
      <label class="lbl">Difficulté</label>
      <div class="seg" style="margin-bottom:20px">
        ${Object.entries(DIFF).map(([k,v])=>
          `<button class="${d.difficulty===k?'on':''}" onclick="setDraft('difficulty','${k}')">${v.name}</button>`).join('')}
      </div>

      <label class="lbl">Max utilisé</label>
      ${timePicker(d.pb)}
    `}

    <label class="lbl" for="nameDraft">Nom de la table</label>
    <input class="field text" id="nameDraft" type="text" maxlength="60" value="${escapeHtml(d.name)}"
           placeholder="${escapeHtml(defaultName(d))}" oninput="draft.name=this.value">
    <p class="hint" style="margin-bottom:22px">Laisse vide pour utiliser le nom automatique.</p>

    <div class="card flat">
      <div class="tile-meta" style="margin:0">${headerColored(d.type, h)}</div>
      <div class="row" style="margin-top:10px"><span style="color:var(--mute);font-size:13.5px">Durée totale</span><span class="pt">${fmtLong(tableTotal(steps))}</span></div>
      <div class="row" style="margin-top:6px"><span style="color:var(--mute);font-size:13.5px">Dont apnée</span><span class="pt hold">${fmtLong(tableHoldTotal(steps))}</span></div>
    </div>

    ${planTable(steps)}

    <button class="btn primary" onclick="saveDraft()">Enregistrer la table</button>
    <button class="btn ghost" onclick="draft=null;goto('home')">Annuler</button>

    ${tabbar('home')}
  </div>`;
}
function defaultRounds(){
  return Array.from({length:8}, ()=>({ rest:120, hold:60 }));
}

function roundsEditor(d){
  if(!d.rounds) d.rounds = defaultRounds();
  const rows = d.rounds.map((r,i)=>`
    <div class="rnd">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <div class="rnd-f">
        <span class="rnd-lbl tm-rest">Repos</span>
        <input class="field rnd-in" type="text" inputmode="numeric" value="${fmt(r.rest)}"
               onchange="setRound(${i},'rest',this.value)">
      </div>
      <div class="rnd-f">
        <span class="rnd-lbl tm-hold">Apnée</span>
        <input class="field rnd-in" type="text" inputmode="numeric" value="${fmt(r.hold)}"
               onchange="setRound(${i},'hold',this.value)">
      </div>
      <button class="rnd-del" onclick="delRound(${i})" aria-label="Supprimer">✕</button>
    </div>`).join('');

  return `
    <div class="card flat" style="padding:16px 14px">
      <div class="row" style="margin-bottom:12px">
        <span style="font-size:13px;color:var(--mute)">Appliquer à tous les rounds</span>
      </div>
      <div class="row" style="gap:8px;margin-bottom:6px">
        <button class="btn ghost" style="margin:0;padding:11px;font-size:13.5px" onclick="fillAll('rest')">Repos identique</button>
        <button class="btn ghost" style="margin:0;padding:11px;font-size:13.5px" onclick="fillAll('hold')">Apnée identique</button>
      </div>
      <p class="hint" style="margin-top:10px">Format m:ss. Chaque round démarre par le repos, puis l'apnée.</p>
    </div>

    <div class="legend" style="margin-top:16px">
      <span><i style="background:var(--rest-c)"></i>Repos</span>
      <span><i style="background:var(--hold-c)"></i>Apnée</span>
    </div>
    <div style="margin-bottom:14px">${rows}</div>
    <button class="btn ghost" style="margin-bottom:22px" onclick="addRound()">Ajouter un round</button>
  `;
}

function keepName(){
  const el = document.getElementById('nameDraft');
  if(el && draft) draft.name = el.value;
}
function setRound(i, key, val){
  const d = ensureDraft(); keepName();
  const v = parseTime(val);
  if(!v || v < 5 || v > 1800){ toast('Durée invalide (5 s à 30:00).','err'); render(); return; }
  d.rounds[i][key] = v; render();
}
function addRound(){
  const d = ensureDraft(); keepName();
  if(d.rounds.length >= 20){ toast('20 rounds maximum.','err'); return; }
  const last = d.rounds[d.rounds.length-1] || { rest:120, hold:60 };
  d.rounds.push({ rest:last.rest, hold:last.hold });
  render();
}
function delRound(i){
  const d = ensureDraft(); keepName();
  if(d.rounds.length <= 1){ toast('Il faut au moins un round.','err'); return; }
  d.rounds.splice(i,1); render();
}
function fillAll(key){
  const d = ensureDraft(); keepName();
  const cur = fmt(d.rounds[0][key]);
  const v = parseTime(prompt(key === 'rest' ? 'Repos pour tous les rounds (m:ss)' : 'Apnée pour tous les rounds (m:ss)', cur));
  if(!v || v < 5 || v > 1800){ if(v !== null) toast('Durée invalide.','err'); return; }
  d.rounds.forEach(r=>r[key] = v); render();
}

const PB_MIN = 15;
const PB_MAX = 900;   // 15:00

function timePicker(sec){
  const m = Math.floor(sec/60), s = sec % 60;
  const mins = Array.from({length:16}, (_,i)=>i);
  const secs = Array.from({length:12}, (_,i)=>i*5);
  return `<div class="picker">
    <div class="picker-col">
      <select class="picker-sel" onchange="setDraftTime(this.value, null)">
        ${mins.map(v=>`<option value="${v}" ${v===m?'selected':''}>${v}</option>`).join('')}
      </select>
      <span class="picker-unit">min</span>
    </div>
    <span class="picker-sep">:</span>
    <div class="picker-col">
      <select class="picker-sel" onchange="setDraftTime(null, this.value)" ${m>=15?'disabled':''}>
        ${secs.map(v=>`<option value="${v}" ${v===s?'selected':''}>${String(v).padStart(2,'0')}</option>`).join('')}
      </select>
      <span class="picker-unit">sec</span>
    </div>
  </div>`;
}

function setDraftTime(mm, ss){
  const d = ensureDraft();
  let m = mm === null ? Math.floor(d.pb/60) : parseInt(mm,10);
  let s = ss === null ? d.pb % 60          : parseInt(ss,10);
  if(m >= 15){ m = 15; s = 0; }
  let v = Math.min(PB_MAX, Math.max(PB_MIN, m*60 + s));
  const el = document.getElementById('nameDraft');
  if(el) d.name = el.value;
  d.pb = v; render();
}
function saveDraft(){
  const d = ensureDraft();
  const el = document.getElementById('nameDraft');
  if(el) d.name = el.value;
  const t = {
    id: uid(),
    updatedAt: Date.now(),
    name: (d.name || '').trim() || defaultName(d),
    type: d.type, difficulty: d.difficulty, pb: d.pb,
    rounds: d.type === 'custom' ? JSON.parse(JSON.stringify(d.rounds || defaultRounds())) : null,
    createdAt: Date.now()
  };
  S.tables.unshift(t); save(); draft = null;
  pending = {tableId: t.id}; goto('preview');
}

function planTable(steps){
  const rows = [];
  const nb = Math.floor(steps.filter(s=>s.kind !== 'calm').length / 2);
  for(let i=0;i<nb;i++){
    const rest = steps[i*2], hold = steps[i*2+1];
    rows.push(`<div class="plan-row">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <span class="pt rest">${fmt(rest.dur)}</span>
      <span class="pt hold">${fmt(hold.dur)}</span>
    </div>`);
  }
  rows.push(`<div class="plan-row">
      <span class="pn">—</span>
      <span class="pt rest">${fmt(CALM)}</span>
      <span class="pt" style="color:var(--mute);font-size:13px">se calmer</span>
    </div>`);
  return `<div class="legend">
      <span><i style="background:var(--rest-c)"></i>Repos</span>
      <span><i style="background:var(--hold-c)"></i>Apnée</span>
    </div>
    <div class="plan">
      <div class="plan-row head"><span>#</span><span>Respirez</span><span>Retenez</span></div>
      ${rows.join('')}
    </div>`;
}

/* ---------- détail d'une table enregistrée ---------- */
function openTable(id){ pending = {tableId:id}; goto('preview'); }
function currentTable(){ return S.tables.find(t=>t.id === (pending && pending.tableId)); }

function viewPreview(){

    <p class="sub">${isCO2
      ? 'Apnée constante à ' + Math.round(DIFF[t.difficulty].co2*100) + ' % du max. La respiration perd 10 s à chaque cycle.'
      : 'Respiration constante. L\'apnée monte jusqu\'à ' + Math.round(DIFF[t.difficulty].o2*100) + ' % du max.'}</p>

    <div class="card flat">
      <div class="tile-meta" style="margin:0">${headerColored(t.type, h)}</div>

    </div>

function deleteTable(id){
  if(!confirm('Supprimer cette table ? Les séances déjà enregistrées sont conservées.')) return;
  S.tables = S.tables.filter(t=>t.id !== id);
  if(!S.deleted.includes(id)) S.deleted.push(id);
  save(); pending = null; goto('home');
}

/* ---------- run ---------- */
function viewRun(){
  const st = curStep();
  if(!st) return '';
  const isHold = st.kind === 'hold';
  const cycleTot = RUN.freeMax ? 1 : ROUNDS;

  if(RUN.countdown > 0){
    return `<div class="cd"><span>${RUN.countdown}</span></div>`;
  }

  const isCalm = st.kind === 'calm';
  const isBreath = RUN.type === 'breath';
  const phaseCls = (isHold || st.kind === 'hin' || st.kind === 'hout') ? 'hold' : 'rest';
  const label = st.label ? st.label.toUpperCase()
    : (st.free ? 'APNÉE LIBRE' : (isHold ? 'APNÉE' : (isCalm ? 'SE CALMER' : 'RESPIRE')));

  return `
  <div class="run phase-${phaseCls} ${phaseCls}">
    <div class="run-top">
      <span class="run-cycle">${RUN.freeMax ? 'TEST DE MAX'
        : isBreath ? BREATH[RUN.breathKey].name + ' · ' + st.cycle + ' / ' + RUN.steps[RUN.steps.length-1].cycle
        : 'CYCLE ' + st.cycle + ' / ' + cycleTot}</span>
      <button class="run-x" onclick="abortSession()">✕</button>
    </div>

    <div class="run-mid">
      <div class="phase-label ${phaseCls}">${label}</div>

      <div class="dial">
        <svg viewBox="0 0 300 300">
          <defs>
            <clipPath id="disc"><circle cx="150" cy="150" r="126"/></clipPath>
          </defs>
          <g clip-path="url(#disc)">
            <circle cx="150" cy="150" r="126" fill="rgba(255,255,255,.03)"/>
            <g id="waves" transform="translate(0,300)">
              <path id="waveA" class="wave-a" d="${wavePath(9)}"/>
              <path id="waveB" class="wave-b" d="${wavePath(6)}"/>
            </g>
          </g>
          <g transform="rotate(-90 150 150)">
            <circle cx="150" cy="150" r="${R_RING}" fill="none"
                    stroke="rgba(255,255,255,.08)" stroke-width="5"/>
            <circle id="ring" cx="150" cy="150" r="${R_RING}" fill="none"
                    stroke="${phaseCls === 'hold' ? 'var(--aqua)' : 'var(--air)'}" stroke-width="5" stroke-linecap="round"
                    stroke-dasharray="${C_RING}" stroke-dashoffset="${C_RING}"/>
          </g>
        </svg>
        <div class="dial-face">
          <div class="big" id="big">0:00</div>
          <div class="small" id="small"></div>
        </div>
      </div>

      <div class="next-up">${nextUpText()}</div>
    </div>

    <div class="run-ctl ${(isHold || isBreath) ? '' : 'solo'}">
      ${isBreath
        ? `<button class="btn ghost" onclick="togglePause()">${RUN.paused ? 'Reprendre' : 'Pause'}</button>
           <button class="btn primary" onclick="finish(true)">Terminer</button>`
        : isHold
          ? `<button class="btn ghost" onclick="togglePause()">${RUN.paused ? 'Reprendre' : 'Pause'}</button>
             <button class="btn ${st.free ? 'primary' : 'warm'}" onclick="stopHoldEarly()">${st.free ? 'Stopper' : "J'arrête l'apnée"}</button>`
          : isCalm
            ? `<button class="btn primary" onclick="finish(true)">Terminer la séance</button>`
            : `<button class="btn ghost" onclick="skipRest()">Passer à l'apnée</button>`}
    </div>
  </div>`;
}

function wavePath(amp){
  // Sinusoïde répétée sur 900px de large, remplie vers le bas.
  let d = 'M -300 0';
  for(let x=-300; x<600; x+=150){
    d += ` q 37.5 ${-amp} 75 0 t 75 0`;
  }
  d += ' L 600 340 L -300 340 Z';
  return d;
}

function nextUpText(){
  const st = curStep();
  if(!st || st.free) return 'Tu arrêtes quand tu veux.';
  if(RUN.type === 'breath'){
    const nx = RUN.steps[RUN.idx+1];
    return nx ? `Ensuite · <b>${nx.label}</b>` : 'Dernière phase.';
  }
  if(st.kind === 'calm') return 'Table bouclée. Respiration libre.';
  if(st.kind === 'rest'){
    const nx = RUN.steps[RUN.idx+1];
    return nx ? `Ensuite · <b>apnée ${fmt(nx.dur)}</b>` : '';
  }
  const nx = RUN.steps[RUN.idx+1];
  if(!nx) return 'Dernière apnée de la table.';
  return `Ensuite · <b>récup ${fmt(nx.dur)}</b>`;
}

function skipRest(){
  const st = curStep();
  if(!st || st.kind !== 'rest') return;
  RUN.idx++;
  RUN.pausedMs = 0; RUN.paused = false;
  RUN.stepStart = Date.now();
  CUE.goHold();
  render();
}

/* ---------- summary ---------- */

  return `
  <div class="screen">

    <button class="btn primary" onclick="goto('home')">Terminer</button>
    ${tabbar('home')}
  </div>`;
}
function typeLabel(t){ return t === 'co2' ? 'Table CO₂' : t === 'o2' ? 'Table O₂' : 'Test de max'; }

/* ---------- onglet Souffle ---------- */

let breathStep = null;

/* ---SEANCES-ANCHOR--- */
let calOpen  = false;
let calShift = 0;
let chartFilter = 'all';

function sessionBest(e){ return Math.max(0, ...(e.holds || []).map(h=>h.actual)); }
function typeTag(t){
  return t === 'co2' ? 'CO₂' : t === 'o2' ? 'O₂' : t === 'max' ? 'MAX'
       : t === 'custom' ? 'SUR' : 'SOUF';
}
function typeColor(t){
  return t === 'co2' ? 'var(--air)' : t === 'o2' ? 'var(--aqua)'
       : t === 'custom' ? 'var(--rest-c)' : 'var(--bone)';
}

function viewHistory(){
  const all   = S.history.slice().sort((a,b)=>a.ts - b.ts);
  const apnea = all.filter(e=>e.type !== 'breath');     // courbes : apnée seulement
  const best  = all.reduce((m,e)=>Math.max(m, sessionBest(e)), 0);
  const totalHold = all.reduce((m,e)=>m + (e.totalHold||0), 0);
  const totalRest = all.reduce((m,e)=>m + (e.totalRest||0), 0);
  const maxTries  = all.filter(e=>e.type === 'max').length;
  const breathN   = all.filter(e=>e.type === 'breath').length;

  const items = S.history.length ? S.history.map(e=>{
    const cls = e.type === 'co2' ? 'co2' : e.type === 'o2' ? 'o2' : 'max';
    const isB = e.type === 'breath';
    const title = isB
      ? (BREATH[e.breathKey] ? BREATH[e.breathKey].name : 'Respiration') + ' · ' + (e.breathMin||0) + ' min'
      : `${e.holds.length} apnée${e.holds.length>1?'s':''} · plus longue ${fmt(sessionBest(e))}`;
    return `<div class="hist">
      <div class="hist-badge ${cls}">${typeTag(e.type)}</div>
      <div class="hist-main">
        <div class="hist-t">${title}</div>
        <div class="hist-m">${dateLabel(e.ts)}${e.done ? '' : ' · interrompue'}</div>
      </div>
      <div class="hist-r">${isB ? (e.breathMin||0)+' min' : fmt(e.totalHold)}</div>
    </div>`;
  }).join('') : `<div class="empty">Aucune séance enregistrée.<br>Lance une table depuis l'accueil.</div>`;

  return `
  <div class="screen">
    <div class="eyebrow">Journal</div>
    <h1>Séances.</h1>
    <p class="sub">${S.history.length} séance${S.history.length>1?'s':''} · plus longue apnée ${best ? fmt(best) : '—'} · ${fmtLong(totalHold)} en apnée au total</p>

    <h2>Totaux</h2>
    <div class="card">
      <div class="stat-grid">
        <div class="stat"><div class="stat-v">${S.history.length}</div><div class="stat-l">Séances</div></div>
        <div class="stat"><div class="stat-v tm-hold">${fmtHM(totalHold)}</div><div class="stat-l">Temps d'apnée</div></div>
        <div class="stat"><div class="stat-v tm-rest">${fmtHM(totalRest)}</div><div class="stat-l">Temps de repos</div></div>
        <div class="stat"><div class="stat-v">${maxTries}</div><div class="stat-l">Tentatives de record</div></div>
      </div>
      ${breathN ? `<div class="row" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <span style="color:var(--mute);font-size:13px">Dont séances de souffle</span><span class="pt">${breathN}</span>
      </div>` : ''}
    </div>

    ${apnea.length >= 2 ? progressBlock(apnea) : ''}
    ${calendarBlock()}

    <h2 style="margin-top:26px">Historique</h2>
    ${items}
    ${tabbar('history')}
  </div>`;
}

/* --- courbe de progression --- */
function progressBlock(all){
  const pts = chartFilter === 'all' ? all : all.filter(e=>e.type === chartFilter);
  const chart = pts.length >= 2 ? progressChart(pts)
    : `<div class="empty" style="padding:26px;border:none;background:none">Pas encore assez de séances de ce type.</div>`;
  const tabs = [['all','Tout'],['o2','O₂'],['co2','CO₂'],['custom','Sur mesure'],['max','Max']];
  return `
    <h2>Progression</h2>
    <div class="seg" style="grid-template-columns:repeat(5,1fr);font-size:12px;margin-bottom:14px">
      ${tabs.map(([k,l])=>`<button class="${chartFilter===k?'on':''}" onclick="chartFilter='${k}';render()">${l}</button>`).join('')}
    </div>
    <div class="card flat" style="padding:16px 12px 12px">${chart}</div>`;
}

function progressChart(pts){
  const data = pts.slice(-40);
  const W = 320, H = 150, PL = 36, PR = 8, PT = 10, PBo = 20;
  const vals = data.map(sessionBest);
  const vmax = Math.max(...vals), vmin = Math.min(...vals);
  const top = Math.max(30, Math.ceil((vmax * 1.1) / 30) * 30);
  const bot = Math.max(0, Math.floor((vmin * .85) / 30) * 30);
  const span = Math.max(30, top - bot);
  const x = i => PL + (data.length === 1 ? 0 : i * (W - PL - PR) / (data.length - 1));
  const y = v => PT + (1 - (v - bot) / span) * (H - PT - PBo);

  const grid = [0, .5, 1].map(f=>{
    const v = bot + f * span, yy = y(v);
    return `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}" stroke="rgba(111,216,209,.10)" stroke-width="1"/>
      <text x="${PL-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${fmt(v)}</text>`;
  }).join('');

  const series = {};
  data.forEach((e,i)=>{ (series[e.type] = series[e.type] || []).push([x(i), y(sessionBest(e))]); });

  const paths = Object.entries(series).map(([t,p])=>{
    if(p.length < 2) return '';
    let d = `M ${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
    for(let i=1;i<p.length;i++){
      const px = p[i-1][0], py = p[i-1][1], cx = p[i][0], cy = p[i][1], mx = (px+cx)/2;
      d += ` C ${mx.toFixed(1)} ${py.toFixed(1)}, ${mx.toFixed(1)} ${cy.toFixed(1)}, ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    }
    return `<path d="${d}" fill="none" stroke="${typeColor(t)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  }).join('');

  const dots = data.map((e,i)=>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(sessionBest(e)).toFixed(1)}" r="2.6" fill="${typeColor(e.type)}"/>`).join('');

  const dlab = ts => new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${grid}${paths}${dots}
    <text x="${PL}" y="${H-5}" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${dlab(data[0].ts)}</text>
    <text x="${W-PR}" y="${H-5}" text-anchor="end" font-size="9" fill="rgba(140,163,168,.9)" font-family="Plus Jakarta Sans,sans-serif">${dlab(data[data.length-1].ts)}</text>
  </svg>
  <p class="hint" style="margin:8px 4px 0">Plus longue apnée de chaque séance.</p>`;
}

/* --- calendrier repliable --- */
function calendarBlock(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + calShift);
  const yy = base.getFullYear(), mm = base.getMonth();
  const label = base.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});

  const byDay = {};
  S.history.forEach(e=>{
    const d = new Date(e.ts);
    if(d.getFullYear() === yy && d.getMonth() === mm){
      const k = d.getDate();
      (byDay[k] = byDay[k] || []).push(e.type);
    }
  });

  const offset = (new Date(yy, mm, 1).getDay() + 6) % 7;   // semaine du lundi
  const days = new Date(yy, mm+1, 0).getDate();
  const today = new Date();
  const isThisMonth = today.getFullYear() === yy && today.getMonth() === mm;

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="cal-cell"></div>`;
  for(let d=1;d<=days;d++){
    const types = [...new Set(byDay[d] || [])];
    const now = isThisMonth && today.getDate() === d;
    cells += `<div class="cal-cell${types.length?' has':''}${now?' now':''}">
      <span>${d}</span>
      <div class="cal-dots">${types.map(t=>`<i style="background:${typeColor(t)}"></i>`).join('')}</div>
    </div>`;
  }

  const count = Object.keys(byDay).length;

  return `
    <h2 style="margin-top:26px">Calendrier</h2>
    <div class="card flat" style="padding:0;overflow:hidden">
      <button class="cal-head" onclick="calOpen=!calOpen;render()">
        <span class="cal-title">${label}</span>
        <span class="cal-meta">${count} jour${count>1?'s':''} d'entraînement</span>
        <span class="cal-chev${calOpen?' up':''}">⌄</span>
      </button>
      ${calOpen ? `
        <div class="cal-body">
          <div class="cal-nav">
            <button onclick="calShift--;render()">◀</button>
            <button onclick="calShift=0;render()" ${calShift===0?'disabled':''}>Aujourd'hui</button>
            <button onclick="calShift++;render()" ${calShift>=0?'disabled':''}>▶</button>
          </div>
          <div class="cal-grid head">${['L','M','M','J','V','S','D'].map(d=>`<div>${d}</div>`).join('')}</div>
          <div class="cal-grid">${cells}</div>
        </div>` : ''}
    </div>`;
}

  authBusy = true; authMsg = ''; render();

    if(up){

      if(d.user && !d.session){
        authBusy = false;
        authMsg = 'Compte créé. Confirme ton adresse via le mail reçu, puis connecte-toi.';
        authMode = 'in'; render(); return;
      }
    } else {
      await signIn(email, pass);
    }
    const u = await currentUser();
    if(u){
      S.cloudEmail = u.email;
      authDraft = { email:'', pass:'', pass2:'' };
      authBusy = false; authMsg = '';
      save(); render();
      await syncNow();
      const next = authIntent; authIntent = null;
      if(next) next();
    } else {
      authBusy = false; authMsg = 'Connexion impossible. Réessaie.'; render();
    }
  }catch(e){
    authBusy = false;
    authMsg = traduireErreur(e && e.message);
    render();
  }
}

function traduireErreur(m){
  m = String(m || '');
  if(/Invalid login/i.test(m))          return 'E-mail ou mot de passe incorrect.';
  if(/already registered|User already/i.test(m)) return 'Cette adresse a déjà un compte. Passe en connexion.';
  if(/Email not confirmed/i.test(m))    return 'Adresse pas encore confirmée : vérifie ta boîte mail.';
  if(/rate limit|too many|For security/i.test(m)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/Password should be/i.test(m))     return 'Mot de passe trop faible : 8 caractères minimum.';
  if(/Failed to fetch|network|NetworkError/i.test(m)) return "Pas de réseau. L'app reste utilisable hors ligne.";
  return m || 'Erreur inconnue.';
}


/* ---------- guide : comment s'entraîner ---------- */
let guideOpen = null;

function guideSection(id, title, body){
  const open = guideOpen === id;
  return `<div class="card flat" style="padding:0;overflow:hidden;margin-bottom:10px">
    <button class="cal-head" style="grid-template-areas:'title chev'" onclick="guideOpen=${open?'null':`'${id}'`};render()">
      <span class="cal-title" style="text-transform:none">${title}</span>
      <span class="cal-chev${open?' up':''}">⌄</span>
    </button>
    ${open ? `<div class="cal-body guide">${body}</div>` : ''}
  </div>`;
}

function viewGuide(){
  return `
  <div class="screen">
    <div class="eyebrow">Méthode</div>
    <h1>S'entraîner.</h1>
    <p class="sub">Ce que font les tables, comment les placer dans une semaine, et où sont les limites.</p>

    <div class="safety">
      <ul>
        <li><b>À sec, toujours.</b> Jamais dans l'eau, jamais au bord d'un bassin, jamais dans un bain. Une syncope à sec fait tomber ; dans l'eau, elle noie.</li>
        <li><b>Allongé ou assis</b> dans un endroit sûr. Jamais debout, au volant, en marchant, ni en hauteur.</li>
        <li>Problème cardiaque, respiratoire, hypertension, épilepsie, grossesse : avis médical avant de commencer.</li>
      </ul>
    </div>

    ${guideSection('quoi', 'Ce que tu entraînes vraiment', `
      <p>L'envie de respirer ne vient pas du manque d'oxygène mais de l'accumulation de gaz carbonique. Ce sont deux signaux distincts, et les deux tables travaillent chacune l'un d'eux.</p>
      <p><b class="tm-hold">La table CO₂</b> garde des apnées de durée constante et raccourcit les repos. Le gaz carbonique n'a plus le temps d'être évacué, donc chaque apnée démarre avec un niveau plus élevé que la précédente. Tu ne vas jamais très loin en durée, mais tu passes beaucoup de temps dans l'inconfort. C'est un entraînement de tolérance : apprendre à rester posé quand le corps réclame.</p>
      <p><b class="tm-hold">La table O₂</b> fait l'inverse. Les repos restent longs et identiques, les apnées s'allongent progressivement. Chaque répétition descend un peu plus bas en oxygène que la précédente. C'est un entraînement d'adaptation : le corps apprend à fonctionner avec moins.</p>
      <p>Une table CO₂ paraît plus dure sur le moment, une table O₂ laisse plus fatigué après. Ce n'est pas une impression.</p>
    `)}

    ${guideSection('avant', 'Avant la séance', `
      <p>Choisis un moment où tu n'as rien derrière. Une table demande vingt à trente minutes, et finir dans la précipitation ruine l'intérêt de l'exercice.</p>
      <p>Estomac plutôt vide : compte deux à trois heures après un repas complet. Une digestion en cours augmente la consommation d'oxygène et raccourcit tout.</p>
      <p>Pas de café dans l'heure qui précède, pas d'effort intense dans les deux heures. Allonge-toi, ou installe-toi le dos calé, et laisse cinq minutes au rythme cardiaque pour redescendre avant de lancer le chrono.</p>
      <p>Le froid, le bruit, un vêtement serré à la taille : tout ce qui mobilise l'attention coûte des secondes.</p>
    `)}

    ${guideSection('pendant', 'Pendant les phases', `
      <p><b class="tm-rest">La respiration</b> se fait normalement. C'est le point le plus souvent mal compris : il ne s'agit pas de se charger en oxygène. Le sang est déjà saturé au repos, on ne peut pas y ajouter grand-chose. Respire calmement, par le ventre, sans forcer l'amplitude.</p>
      <p><b>L'hyperventilation est à proscrire.</b> Souffler fort et vite avant une apnée fait chuter le gaz carbonique et retarde artificiellement l'envie de respirer. L'apnée paraît plus facile, mais l'oxygène, lui, s'épuise au même rythme. C'est exactement le mécanisme des syncopes sans signe avant-coureur.</p>
      <p>La dernière inspiration se prend sans excès, autour de quatre-vingts pour cent de ta capacité. Un thorax gonflé à bloc crée une tension qui se paie en contractions précoces.</p>
      <p><b class="tm-hold">Pendant l'apnée</b>, ne bouge pas. Chaque geste consomme. Le corps se détache en trois temps : d'abord le calme, puis les premières contractions du diaphragme, puis leur intensification. Les contractions sont normales et attendues, elles ne signalent aucun danger immédiat — elles marquent le début du travail utile.</p>
    `)}

    ${guideSection('arret', 'Quand arrêter', `
      <p>Une table s'interrompt, elle ne se force pas. Le bouton d'arrêt d'apnée est là pour ça, et l'utiliser n'est pas un échec : c'est le comportement correct.</p>
      <p>Tu arrêtes immédiatement, sans discussion, devant l'un de ces signes : vertige, fourmillements dans les mains ou les lèvres, trouble de la vision, sensation de chaleur qui monte, contractions devenues ingérables, ou perte du fil de ce que tu fais.</p>
      <p>Après une apnée interrompue, reprends une respiration ample et laisse le temps de récupération complet avant de décider si tu continues. Écourter la récupération pour rattraper le programme est la meilleure façon de transformer une séance ratée en séance dangereuse.</p>
      <p>Si tu as dû arrêter trois apnées d'affilée, la table est trop dure pour aujourd'hui. Ce n'est pas une question de volonté : ton max du jour dépend du sommeil, du stress et de la digestion, et il varie facilement de vingt pour cent.</p>
    `)}

    ${guideSection('semaine', 'Placer les tables dans la semaine', `
      <p>Une table par séance, jamais deux. Enchaîner une CO₂ et une O₂ dans la même session cumule les deux fatigues sans bénéfice supplémentaire.</p>
      <p>Deux à trois séances par semaine suffisent largement à progresser. Au-delà, la récupération devient le facteur limitant et les gains s'aplatissent.</p>
      <p>Alterne les types plutôt que de les empiler : une CO₂, un jour de repos, une O₂. Si tu ne devais en garder qu'une, la CO₂ est celle qui rend service le plus vite, parce que la tolérance à l'inconfort progresse plus rapidement que l'adaptation physiologique.</p>
      <p>Les tables tolèrent mal d'être posées juste après une grosse séance de sport. Place-les le matin, ou sur un jour léger.</p>
    `)}

    ${guideSection('max', 'Le test de max', `
      <p>Le max sert de base de calcul à toutes tes tables : le fausser fausse tout le reste. Prends une valeur atteinte confortablement, pas un record arraché un jour de forme.</p>
      <p>Teste-le rarement, une fois par mois au plus. Un test de max est une séance à lui seul, il ne s'ajoute pas à une table.</p>
      <p>S'il progresse de plus de vingt pour cent d'un coup, méfie-toi : c'est souvent le signe d'une hyperventilation involontaire plutôt que d'un vrai gain.</p>
      <p>Et un max qui stagne pendant des semaines n'a rien d'anormal. La tolérance progresse avant la durée, et ça ne se voit pas sur le chrono.</p>
    `)}

    ${guideSection('souffle', 'Où placent les pratiques de souffle', `
      <p>Les exercices de l'onglet Souffle ne remplacent pas les tables et ne s'y substituent pas dans la progression. Ils travaillent autre chose : la régulation du système nerveux, la qualité du relâchement, l'habitude de respirer par le nez.</p>
      <p>Ils se placent bien les jours sans table, ou juste avant une table pour arriver posé. Le Buteyko est le plus proche du travail de tolérance au gaz carbonique ; le NSDR sert la récupération.</p>
      <p>C'est pour ça qu'ils n'ont pas de courbe de progression : il n'y a rien à battre.</p>
    `)}

    <p class="hint" style="margin-top:20px">Ce guide résume des principes largement partagés dans la pratique de l'apnée. Il ne remplace pas une formation encadrée : si tu comptes pratiquer dans l'eau un jour, passe par un club et un binôme, jamais par une app.</p>

    <button class="btn ghost" style="margin-top:14px" onclick="goto('settings')">Retour</button>
    ${tabbar('settings')}
  </div>`;
}

        </div>
        <div class="row" style="margin-top:6px">
          <span style="color:var(--mute);font-size:13px">Séances</span><span class="pt">${S.history.length}</span>

    <div class="card flat">
      <p style="font-size:13.5px;color:var(--mute);margin:0 0 10px"><b style="color:var(--bone)">Table CO₂</b> — 8 apnées de durée identique, calées sur ${Math.round(DIFF.facile.co2*100)} / ${Math.round(DIFF.normal.co2*100)} / ${Math.round(DIFF.difficile.co2*100)} % du max selon la difficulté. La respiration démarre à ${fmt(CO2_REST0)} et perd ${CO2_STEP} s à chaque cycle, jusqu'à 0:10. Le CO₂ s'accumule, l'envie de respirer arrive de plus en plus tôt.</p>

function wipe(){
  if(!confirm('Effacer ton max, ton historique et tes réglages ?')) return;
  localStorage.removeItem(LS);
  location.reload();
}

/* ---------- tabbar ---------- */

  const t = (key,label,path)=>`<button class="${active===key?'on':''}" onclick="goto('${key==='home'?'home':key}')">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${path}</svg>${label}</button>`;
  return `<nav class="tabbar" style="grid-template-columns:repeat(4,1fr)">
    ${t('home','Tables','<circle cx="12" cy="12" r="8"/><path d="M4.5 14c2-1.6 4-1.6 6 0s4 1.6 6 0"/>')}
    ${t('breath','Souffle','<path d="M12 20c3.5 0 6-2.2 6-5 0-2.4-1.8-4-4-4-1.6 0-2.6.9-3 1.8"/><path d="M12 20c-3.5 0-6-2.2-6-5 0-2.4 1.8-4 4-4"/><path d="M12 11V4"/>')}
    ${t('history','Séances','<path d="M4 6h16M4 12h16M4 18h10"/>')}
    ${t('settings','Réglages','<circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/>')}
  </nav>`;
}

  initSb().auth.onAuthStateChange((evt)=>{
    if(evt === 'PASSWORD_RECOVERY'){ recoveryMode = true; render(); }
  });
}

// Reprise d'une session cloud existante, sans bloquer l'affichage
(async ()=>{
  const u = await currentUser();
  if(u){ S.cloudEmail = u.email; render(); syncNow(); }
})();

  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
