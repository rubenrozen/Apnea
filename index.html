<style>
:root{
  --abyss:#0A1C23;
  --deep:#123039;
  --slate:#1B4451;
  --aqua:#7FC6BE;
  --aqua-deep:#54968F;
  --air:#E4AE8C;
  --air-deep:#A9704D;
  --bone:#EDF2F1;
  --mute:#8CA3A8;
  --danger:#E0796C;
  --prog:#9BB8E0;        /* programme — bleu pâle */
  --hold-c:#E2796B;      /* apnée — rouge */
  --rest-c:#7FBE8C;      /* repos — vert  */
  --ease:cubic-bezier(.22,.61,.36,1);
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --line:rgba(127,198,190,.11);
  --font-d:'Outfit',system-ui,sans-serif;
  --font-n:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-b:'Plus Jakarta Sans',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:
    radial-gradient(120% 70% at 50% -8%, #133741 0%, transparent 58%),
    var(--abyss);
  background-attachment:fixed;
  color:var(--bone);
  font-family:var(--font-b);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font-family:inherit}

/* ---------- shell ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;padding:calc(var(--safe-t) + 22px) 20px calc(var(--safe-b) + 108px);max-width:560px;width:100%;margin:0 auto}
.screen.bare{padding-bottom:calc(var(--safe-b) + 24px)}

.eyebrow{font-family:var(--font-b);font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--aqua-deep)}
h1{font-family:var(--font-d);font-weight:600;font-size:35px;letter-spacing:-.028em;margin:8px 0 6px;line-height:1.1}
h2{font-family:var(--font-d);font-weight:600;font-size:19px;letter-spacing:-.02em;margin:0 0 12px}
.sub{color:var(--mute);font-size:14.5px;line-height:1.6;margin:0 0 26px}

/* ---------- cards ---------- */
.card{background:linear-gradient(158deg,rgba(26,78,100,.42),rgba(12,37,50,.34));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 28px -18px rgba(0,0,0,.8)}
.card.flat{background:rgba(12,37,50,.30);box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}

.pb-val{font-family:var(--font-n);font-weight:300;font-size:54px;line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.pb-unit{font-family:var(--font-b);font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.link{font-size:13px;font-weight:600;color:var(--aqua);border-bottom:1px solid rgba(111,216,209,.35);padding-bottom:1px}

/* ---------- mode tiles ---------- */
.tile{display:block;width:100%;text-align:left;
  background:linear-gradient(158deg,rgba(22,66,86,.34),rgba(12,37,50,.30));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:12px;
  box-shadow:0 8px 26px -20px rgba(0,0,0,.9);
  transition:border-color .35s var(--ease),transform .35s var(--ease),background .35s var(--ease)}
.tile:active{transform:scale(.988);border-color:rgba(111,216,209,.22)}
.tile-top{display:flex;align-items:baseline;gap:10px}
.tile-tag{font-family:var(--font-b);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--aqua)}
.tile-tag.warm{color:var(--air)}
.tm-hold{color:var(--hold-c)}
.tm-rest{color:var(--rest-c)}
.legend{display:flex;gap:16px;align-items:center;margin:-4px 2px 14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tile-name{font-family:var(--font-d);font-weight:600;font-size:17.5px;letter-spacing:-.018em}
.tile-desc{color:var(--mute);font-size:13.5px;margin-top:5px;line-height:1.45}
.tile-alt{color:var(--aqua-deep);font-size:12px;font-weight:500;margin-top:4px;letter-spacing:.01em}
/* ---------- programme ---------- */
.prog-card{border-color:rgba(155,184,224,.26);
  background:linear-gradient(158deg,rgba(48,72,104,.34),rgba(16,34,46,.32))}
.prog-tag{color:var(--prog) !important;background:rgba(155,184,224,.12);
  padding:4px 9px;border-radius:99px;font-size:10.5px;flex:none}
.prog-invite{border-color:rgba(155,184,224,.22);
  background:linear-gradient(158deg,rgba(48,72,104,.26),rgba(16,34,46,.28))}
.prog-name{font-family:var(--font-d);font-weight:600;font-size:18px;letter-spacing:-.018em}
.prog-sub{font-size:12.5px;color:var(--mute);margin-top:3px}
.prog-focus{font-size:13px;color:var(--mute);line-height:1.55;margin:14px 0 0}
.prog-bar{height:4px;border-radius:99px;background:rgba(155,184,224,.14);margin:16px 0 8px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--prog);border-radius:99px;
  transition:width .6s var(--ease)}
.prog-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.pslots{margin-top:16px;display:flex;flex-direction:column;gap:7px}
.pslot{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 13px;
  border-radius:14px;background:rgba(10,28,35,.42);border:1px solid rgba(155,184,224,.13);
  transition:opacity .3s var(--ease),background .3s var(--ease)}
.pslot.done{opacity:.5}
.pslot:active{background:rgba(10,28,35,.7)}
.pslot-tag{font-family:var(--font-b);font-weight:700;font-size:10.5px;letter-spacing:.06em;
  min-width:34px;text-align:center;flex:none}
.pslot-tag.co2{color:var(--air)} .pslot-tag.o2{color:var(--aqua)}
.pslot-tag.br{color:var(--prog)} .pslot-tag.max{color:var(--bone)}
.pslot-n{flex:1;font-size:13.5px;font-weight:500;min-width:0}
.pslot-n em{display:block;font-style:normal;font-family:var(--font-n);font-weight:500;
  font-size:12px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
.pslot-c{color:var(--mute);font-size:15px;flex:none}

.risks{display:flex;flex-direction:column;gap:9px}
.risk{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:15px 16px;
  border-radius:var(--r-md);background:rgba(12,37,50,.26);border:1px solid var(--line);
  transition:border-color .3s var(--ease),background .3s var(--ease)}
.risk.on{border-color:rgba(127,198,190,.34);background:rgba(127,198,190,.07)}
.risk-box{width:22px;height:22px;border-radius:7px;flex:none;margin-top:1px;
  border:1.5px solid rgba(127,198,190,.3);display:grid;place-items:center;
  font-size:12px;color:#08221F;transition:background .3s var(--ease)}
.risk.on .risk-box{background:var(--aqua);border-color:var(--aqua)}
.risk-txt{flex:1;min-width:0}
.risk-txt b{display:block;font-size:14px;font-weight:600;line-height:1.4}
.risk-txt em{display:block;font-style:normal;font-size:12.5px;color:var(--mute);
  line-height:1.55;margin-top:5px}

.pweek{border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;margin-bottom:9px;
  background:rgba(12,37,50,.22)}
.pweek.now{border-color:rgba(155,184,224,.34);background:rgba(48,72,104,.24)}
.pweek.past{opacity:.55}
.pweek.next{opacity:.8}
.pweek-h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.pweek-n{font-family:var(--font-d);font-weight:600;font-size:14.5px}
.pweek-p{flex:1;font-size:12px;color:var(--mute)}
.pweek-c{font-family:var(--font-n);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.pweek-s{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);padding:4px 0}
.pweek-s.ok{color:var(--aqua)}

.pin-on{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--aqua-deep);
  background:rgba(127,198,190,.10);padding:3px 8px;border-radius:99px;margin-left:auto}
.tile-meta{font-family:var(--font-n);font-weight:500;font-size:13.5px;letter-spacing:.01em;color:var(--bone);opacity:.72;margin-top:10px;font-variant-numeric:tabular-nums}

/* ---------- segmented ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:rgba(6,18,28,.55);border:1px solid var(--line);border-radius:var(--r-md);padding:5px}
.seg button{padding:11px 4px;border-radius:13px;font-size:13.5px;font-weight:600;color:var(--mute);
  transition:background .4s var(--ease),color .3s var(--ease)}
.seg button.on{background:rgba(111,216,209,.14);color:var(--bone);box-shadow:0 2px 12px -6px rgba(111,216,209,.5)}

/* ---------- table preview ---------- */
.plan{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;background:rgba(12,37,50,.22)}
.plan-row{display:grid;grid-template-columns:38px 1fr 1fr;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid rgba(111,216,209,.09)}
.plan-row:last-child{border-bottom:none}
.plan-row.head{background:rgba(12,37,50,.6);padding:9px 14px}
.plan-row.head span{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.pn{font-family:var(--font-n);font-weight:500;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.pt{font-family:var(--font-n);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pt.rest{color:var(--rest-c)}
.pt.hold{color:var(--hold-c)}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:17px;border-radius:var(--r-md);font-family:var(--font-b);font-weight:600;
  font-size:15.5px;letter-spacing:.005em;text-align:center;
  transition:transform .4s var(--ease),opacity .3s var(--ease),box-shadow .4s var(--ease),background .3s var(--ease)}
.btn:active{transform:scale(.978)}
.btn.primary{background:linear-gradient(152deg,#9AD6CE,#6FB4AC);color:#08221F;
  box-shadow:0 10px 26px -16px rgba(127,198,190,.6)}
.btn.ghost{background:rgba(111,216,209,.04);border:1px solid rgba(111,216,209,.20);color:var(--bone)}
.btn.warm{background:var(--air);color:#2A1206}
.btn+.btn{margin-top:10px}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(3,1fr);
  will-change:auto;
  background:rgba(10,28,35,.92);backdrop-filter:blur(18px) saturate(1.2);border-top:1px solid rgba(127,198,190,.10);
  padding:9px 0 calc(var(--safe-b) + 9px);z-index:40}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:11px;font-weight:600}
.tabbar button.on{color:var(--aqua)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ---------- RUN screen ---------- */
.run ~ .tabbar,.run .tabbar{display:none}
.run{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 14px) 20px calc(var(--safe-b) + 20px);
  background:radial-gradient(125% 80% at 50% 6%,#15414C 0%,#0A1C23 64%);
  transition:background .9s var(--ease)}
.run.phase-hold{background:radial-gradient(125% 80% at 50% 6%,#154550 0%,#081A20 64%)}
.run.phase-rest{background:radial-gradient(125% 80% at 50% 6%,#3A2E2B 0%,#131A1C 64%)}

.run-top{display:flex;align-items:center;justify-content:space-between}
.run-cycle{font-family:var(--font-b);font-weight:500;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.run-x{font-size:22px;line-height:1;color:var(--mute);padding:6px 10px}

.run-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.phase-label{font-family:var(--font-b);font-weight:600;font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;text-align:center}
.phase-label.hold{color:var(--aqua)}
.phase-label.rest{color:var(--air)}

.dial{position:relative;width:min(78vw,320px);aspect-ratio:1}
.dial svg{width:100%;height:100%;display:block}
.dial-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

<body>
<div class="app" id="app"></div>

<script src="./config.js" onerror="window.STATIQUE_CONFIG=null"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   STATIQUE — tables O2 / CO2
   Single-file PWA. Vanilla JS. localStorage.
   ===================================================================== */

// Clé volontairement inchangée malgré le renommage en Inspir :
// la modifier ferait perdre les données déjà stockées sur les appareils.
/* =====================================================================
   INTERNATIONALISATION

   Le texte français sert de clé : t("Créer une table") cherche la
   traduction et retombe sur le français si elle manque. Aucune clé à
   inventer, aucun écran cassé quand une chaîne n'est pas encore
   traduite, et la migration se fait progressivement.

   Le français vit dans le code, les autres langues dans i18n/<lg>.json,
   chargés à la demande. L'app démarre donc toujours, même hors ligne.
   ===================================================================== */

const LANGS = {
  fr: { name:'Français',  flag:'FR' },
  en: { name:'English',   flag:'EN' },
  es: { name:'Español',   flag:'ES' },
  it: { name:'Italiano',  flag:'IT' }
};

let LANG = 'fr';
let DICT = {};          // { "texte français": "traduction" }
const MISSING = new Set();

function detectLang(){
  const saved = (()=>{ try{ return JSON.parse(localStorage.getItem(LS) || '{}').lang; }catch(e){ return null; } })();
  if(saved && LANGS[saved]) return saved;
  const nav = (navigator.language || 'fr').slice(0,2).toLowerCase();
  return LANGS[nav] ? nav : 'en';   // repli anglais, pas français
}

async function loadLang(lg){
  if(lg === 'fr'){ DICT = {}; LANG = 'fr'; return; }
  try{
    const r = await fetch('./i18n/' + lg + '.json', { cache:'no-cache' });
    if(!r.ok) throw new Error('404');
    DICT = await r.json();
    LANG = lg;
  }catch(e){
    // Traduction indisponible : on reste en français plutôt que de planter
    DICT = {}; LANG = 'fr';
  }
}

function tBlock(str){
  return t(String(str).replace(/\s+/g, ' ').trim());
}

function t(str, vars){
  let out = DICT[str];
  if(out === undefined){
    if(LANG !== 'fr') MISSING.add(str);
    out = str;
  }
  if(vars) for(const k in vars) out = out.split('{'+k+'}').join(vars[k]);
  return out;
}

/* Traduction après rendu : on parcourt les nœuds de texte plutôt que
   d'envelopper 261 chaînes à la main. Les nombres sont neutralisés en
   {0}, {1}… pour qu'une même phrase serve quelle que soit la valeur. */
function tPattern(str){
  if(DICT[str] !== undefined) return DICT[str];
  const nums = [];
  const key = str.replace(/\d+/g, m => { nums.push(m); return '{' + (nums.length-1) + '}'; });
  const tr = DICT[key];
  if(tr === undefined){ MISSING.add(key); return str; }
  return tr.replace(/\{(\d+)\}/g, (m,i) => nums[i] !== undefined ? nums[i] : m);
}

function translateDom(root){
  if(LANG === 'fr') return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    // Les blocs déjà traduits en entier ne repassent pas nœud par nœud
    if(n.parentElement && n.parentElement.closest('[data-t]')) continue;
    const raw = n.nodeValue, trimmed = raw.trim();
    if(trimmed.length < 2 || !/[A-Za-zÀ-ÿ]{2}/.test(trimmed)) continue;
    const out = tPattern(trimmed);
    if(out !== trimmed) n.nodeValue = raw.replace(trimmed, out);
  }
  root.querySelectorAll('[placeholder]').forEach(el=>{
    const v = el.getAttribute('placeholder');
    if(v && v.trim()) el.setAttribute('placeholder', tPattern(v.trim()));
  });
  root.querySelectorAll('[aria-label]').forEach(el=>{
    const v = el.getAttribute('aria-label');
    if(v && v.trim()) el.setAttribute('aria-label', tPattern(v.trim()));
  });
}

async function setLang(lg){
  if(!LANGS[lg]) return;
  await loadLang(lg);
  S.lang = lg; save(); render();
  toast(t('Langue changée.'));
}

/* Formats sensibles à la langue */
function locale(){ return { fr:'fr-FR', en:'en-GB', es:'es-ES', it:'it-IT' }[LANG] || 'fr-FR'; }

const APP_VERSION = '1.0.0';
const APP_BUILD   = 16;

const LS  = 'statique.v1';
const LSR = 'inspir.run';     // séance en cours, pour la reprise après interruption
let S = {
  pb: 120,                 // max statique en secondes
  pbAt: 0,                 // horodatage de la dernière modif du max (arbitrage de synchro)
  onboarded: false,
  tables: [],              // {id, name, type, difficulty, pb, createdAt, updatedAt}
  history: [],             // {id, ts, tableId, type, difficulty, pb, holds, totalHold, done}
  deleted: [],             // ids de tables supprimées localement, à propager
  deletedSessions: [],     // idem pour les séances
  disclaimer: null,        // {acceptedAt, version, points} — trace d'acceptation
  lang: null,              // langue choisie ; null = détection automatique
  program: null,           // {id, duration, startDate}
  sound: true,
  vibrate: true,
  voice: true,
  prep: 0,                 // préparation avant la séance, en secondes (0 = aucune)
  pbHistory: [],           // [{ts, pb}] évolution du max de référence
  cloudEmail: null         // e-mail du compte lié, null si usage local seul
};

function load(){
  try{ const r = JSON.parse(localStorage.getItem(LS)); if(r) S = Object.assign(S, r); }catch(e){}
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  queueSync();
}

/* Trace l'évolution du max : un point par changement, au plus un par jour. */
function notePb(v){
  if(!Array.isArray(S.pbHistory)) S.pbHistory = [];
  const last = S.pbHistory[S.pbHistory.length-1];
  const sameDay = last && new Date(last.ts).toDateString() === new Date().toDateString();
  if(last && last.pb === v){ return; }
  if(sameDay) S.pbHistory[S.pbHistory.length-1] = { ts: Date.now(), pb: v };
  else        S.pbHistory.push({ ts: Date.now(), pb: v });
  S.pbHistory = S.pbHistory.slice(-200);
}

/* =====================================================================
   SYNCHRO SUPABASE

   Doctrine : localStorage reste la source de vérité en lecture.
   L'app démarre et tourne sans réseau ; le cloud n'est qu'une copie
   partagée entre appareils. Arbitrage des conflits : dernière écriture
   gagnante, par comparaison d'horodatage.
   ===================================================================== */

/* Config injectée au build depuis les secrets GitHub (voir config.js).
   Absente en local tant que tu n'as pas créé ton config.js : dans ce cas
   l'app reste pleinement fonctionnelle, simplement sans synchro. */
const CFG = window.STATIQUE_CONFIG || null;
const cloudConfigured = !!(CFG && CFG.url && CFG.key);

let sb = null;
let syncState = { busy:false, queued:false, last:0, error:null };

function initSb(){
  if(sb) return sb;
  // window.supabase peut manquer si le CDN n'a pas répondu (hors ligne au
  // premier chargement) : l'app doit rester utilisable sans planter.
  if(!cloudConfigured || !window.supabase) return null;
  sb = window.supabase.createClient(CFG.url.replace(/\/+$/,''), CFG.key, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
  return sb;
}

function uid(){
  if(crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}

/* --- Envoi des changements locaux --- */
async function cloudPush(user){
  const c = initSb();

  if(S.deleted.length){
    const { error } = await c.from('tables')
      .update({ archived:true }).in('id', S.deleted).eq('user_id', user.id);
    if(!error) S.deleted = [];
  }

  if(Array.isArray(S.deletedSessions) && S.deletedSessions.length){
    const { error } = await c.from('sessions')
      .delete().in('id', S.deletedSessions).eq('user_id', user.id);
    if(!error) S.deletedSessions = [];
  }

  await c.from('profiles').upsert({
    id: user.id, pb: S.pb, sound: S.sound, vibrate: S.vibrate,
    disclaimer_accepted_at: S.disclaimer ? new Date(S.disclaimer.acceptedAt).toISOString() : null,
    disclaimer_version: S.disclaimer ? S.disclaimer.version : null,
    updated_at: new Date(S.pbAt || Date.now()).toISOString()
  }, { onConflict:'id' });

  if(S.tables.length){
    await c.from('tables').upsert(S.tables.map(t=>({
      id: t.id, user_id: user.id, name: t.name, type: t.type,
      difficulty: t.difficulty === 'normal' || t.difficulty === 'facile' || t.difficulty === 'difficile' ? t.difficulty : 'normal',
      pb: t.pb, archived: false, pinned: !!t.pinned,
      created_at: new Date(t.createdAt).toISOString(),
      updated_at: new Date(t.updatedAt || t.createdAt).toISOString()
    })), { onConflict:'id' });
  }

  if(S.history.length){
    await c.from('sessions').upsert(S.history.map(h=>({
      id: h.id, user_id: user.id, table_id: h.tableId || null,
      type: h.type, difficulty: h.difficulty || null, pb: h.pb,
      holds: h.holds, done: !!h.done, note: h.note || null,
      total_rest: h.totalRest || 0,
      breath_key: h.breathKey || null, breath_min: h.breathMin || null,
      started_at: new Date(h.ts).toISOString()
    })), { onConflict:'id' });
  }
}

/* --- Récupération et fusion --- */
async function cloudPull(user){
  const c = initSb();
  const [prof, tabs, sess] = await Promise.all([
    c.from('profiles').select('*').eq('id', user.id).maybeSingle(),
    c.from('tables').select('*').eq('user_id', user.id).eq('archived', false),
    c.from('sessions').select('*').eq('user_id', user.id).order('started_at',{ascending:false}).limit(200)
  ]);

  // Profil : la valeur la plus récente l'emporte
  if(prof.data){
    const remoteAt = new Date(prof.data.updated_at).getTime();
    if(remoteAt > (S.pbAt || 0)){
      S.pb = prof.data.pb; S.pbAt = remoteAt;
      S.sound = prof.data.sound; S.vibrate = prof.data.vibrate;
    }
    // La trace d'acceptation ne se perd jamais : on garde la plus ancienne
    if(prof.data.disclaimer_accepted_at && !disclaimerAccepted()){
      S.disclaimer = {
        acceptedAt: new Date(prof.data.disclaimer_accepted_at).getTime(),
        version: prof.data.disclaimer_version || '1.0',
        points: RISKS.map(r=>r.id)
      };
    }
  }

  // Tables : fusion par id, la plus récemment modifiée gagne
  if(tabs.data){
    const byId = new Map(S.tables.map(t=>[t.id, t]));
    for(const r of tabs.data){
      if(S.deleted.includes(r.id)) continue;
      const local = byId.get(r.id);
      const remoteAt = new Date(r.updated_at).getTime();
      if(!local || remoteAt > (local.updatedAt || local.createdAt || 0)){
        byId.set(r.id, {
          id: r.id, name: r.name, type: r.type, difficulty: r.difficulty,
          pb: r.pb, pinned: !!r.pinned,
          createdAt: new Date(r.created_at).getTime(), updatedAt: remoteAt
        });
      }
    }
    S.tables = [...byId.values()].sort((a,b)=>b.createdAt - a.createdAt);
  }

  // Séances : union simple, elles sont immuables
  if(sess.data){
    const byId = new Map(S.history.map(h=>[h.id, h]));
    const gone = Array.isArray(S.deletedSessions) ? S.deletedSessions : [];
    for(const r of sess.data){
      if(byId.has(r.id) || gone.includes(r.id)) continue;
      byId.set(r.id, {
        id: r.id, ts: new Date(r.started_at).getTime(), tableId: r.table_id,
        type: r.type, difficulty: r.difficulty, pb: r.pb,
        holds: r.holds || [], totalHold: r.total_hold, done: r.done,
        totalRest: r.total_rest || 0, note: r.note || null,
        breathKey: r.breath_key || null, breathMin: r.breath_min || null
      });
    }
    S.history = [...byId.values()].sort((a,b)=>b.ts - a.ts).slice(0,200);
  }
}

/* --- Orchestration --- */
async function syncNow(){
  if(syncState.busy){ syncState.queued = true; return; }
  const user = await currentUser();
  if(!user) return;
  syncState.busy = true; syncState.error = null;
  try{
    await cloudPush(user);
    await cloudPull(user);
    S.cloudEmail = user.email;
    syncState.last = Date.now();
    try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
    if(['settings','home','history','account'].includes(route)) render();
  }catch(e){
    const m = (e && e.message) ? e.message : '';
    // Un jeton expiré doit être signalé, sinon l'app affiche "Synchronisé"
    // alors que chaque envoi échoue en silence.
    if(/JWT|jwt expired|401|Invalid Refresh Token|refresh_token/i.test(m)){
      S.cloudEmail = null;
      try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(_){}
      syncState.error = 'Session expirée. Reconnecte-toi pour reprendre la synchronisation.';
      toast('Session expirée, reconnexion nécessaire.','err');
    } else {
      syncState.error = m || 'Synchro impossible';
    }
  }finally{
    syncState.busy = false;
    if(syncState.queued){ syncState.queued = false; setTimeout(syncNow, 800); }
  }
}

let syncTimer = null;
function queueSync(){
  if(!navigator.onLine) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
window.addEventListener('online', ()=>syncNow());

/* --- Migration des identifiants locaux vers des UUID --- */
function migrateIds(){
  let touched = false;
  const map = {};
  S.tables.forEach(t=>{
    if(!/^[0-9a-f-]{36}$/i.test(t.id)){ const n = uid(); map[t.id] = n; t.id = n; touched = true; }
    if(!t.updatedAt) t.updatedAt = t.createdAt || Date.now();
  });
  S.history.forEach(h=>{
    if(!h.id){ h.id = uid(); touched = true; }
    if(h.tableId && map[h.tableId]) h.tableId = map[h.tableId];
  });
  if(!S.pbAt){ S.pbAt = Date.now(); touched = true; }
  if(!Array.isArray(S.deleted)){ S.deleted = []; touched = true; }
  if(touched) try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
}

/* ---------------------------------------------------------------------
   MOTEUR DE TABLES  —  calqué sur STAmina (rétro-ingénierie sur 20 tables)

   Structure : 8 cycles, chaque cycle = respiration PUIS apnée,
   suivis d'une phase finale "se calmer" de 1:00.

   CO2 : apnée constante, respiration décroissante 1:20 -> 0:10 (pas -10 s)
   O2  : respiration constante, apnée croissante

        respiration = max(60, floor5(0.25 * max))
        derniere    = floor5(PCT * max)
        pas         = 5 * max(1, floor(derniere / 85))
        premiere    = derniere - 7 * pas

   La difficulté ne touche qu'un seul coefficient par table.
   --------------------------------------------------------------------- */

/* ==MOTEUR-DEBUT== */
const ROUNDS = 8;
const CALM   = 60;

/* =====================================================================
   RESPIRATION — pratiques hors apnée
   Chaque pratique est une boucle de phases répétée N cycles.
   Phases : in (inspire) · hin (rétention poumons pleins) ·
            out (expire) · hout (rétention poumons vides) · free (libre)
   ===================================================================== */

/* Certaines pratiques allongent leur côté au fil de la séance :
   b.progressive donne le nombre de secondes gagnées entre le premier
   et le dernier palier. La durée totale reste calée sur la cible. */
function breathPlan(key, minutes, stepVal){
  const b = BREATH[key];
  const grow = b.progressive || 0;
  const target = minutes * 60;

  if(!grow){
    const len = b.cycle(stepVal).reduce((a,p)=>a+p.dur,0);
    const n = Math.max(1, Math.round(target / len));
    return { n, valueAt: () => stepVal };
  }

  // Longueur moyenne d'un cycle sur la rampe, pour estimer le nombre de cycles
  const avg = b.cycle(stepVal + grow/2).reduce((a,p)=>a+p.dur,0);
  const n = Math.max(2, Math.round(target / avg));
  const valueAt = i => stepVal + Math.round(grow * i / (n - 1));
  return { n, valueAt };
}

function buildBreath(key, minutes, stepVal){
  const b = BREATH[key];
  const { n, valueAt } = breathPlan(key, minutes, stepVal);
  const steps = [];
  for(let i=0;i<n;i++){
    b.cycle(valueAt(i)).forEach(p=>steps.push({ ...p, cycle:i+1 }));
  }
  return steps;
}

function breathCycles(key, minutes, stepVal){
  return breathPlan(key, minutes, stepVal).n;
}

const DIFF = {
  facile:    { name:'Facile',    co2:.40, o2:.65 },
  normal:    { name:'Normal',    co2:.50, o2:.75 },
  difficile: { name:'Difficile', co2:.60, o2:.85 }
};

const CO2_REST0 = 80;   // 1:20
const CO2_STEP  = 10;

function floor5(x){ return Math.max(5, Math.floor(x/5)*5); }

function tableParams(type, pb, diffKey){
  const d = DIFF[diffKey] || DIFF.normal;
  if(type === 'co2'){
    return { type, rest: CO2_REST0, restStep: CO2_STEP, hold: floor5(pb * d.co2) };
  }
  const rest = Math.max(60, floor5(.25 * pb));
  const last = floor5(d.o2 * pb);
  const step = 5 * Math.max(1, Math.floor(last / 85));
  return { type, rest, last, step, first: last - 7*step };
}

/* Table sur mesure : la définition des rounds est portée par la table
   elle-même, aucun calcul dérivé du max. */
function buildCustom(rounds){
  const steps = [];
  (rounds || []).forEach((r,i)=>{
    steps.push({kind:'rest', dur: Math.max(5, r.rest|0), cycle:i+1});
    steps.push({kind:'hold', dur: Math.max(5, r.hold|0), cycle:i+1});
  });
  steps.push({kind:'calm', dur: CALM, cycle:(rounds||[]).length});
  return steps;
}

function buildTable(type, pb, diffKey, rounds){
  if(type === 'custom') return buildCustom(rounds);
  const p = tableParams(type, pb, diffKey);
  const steps = [];
  for(let i=0;i<ROUNDS;i++){
    if(type === 'co2'){
      steps.push({kind:'rest', dur: Math.max(10, p.rest - i*p.restStep), cycle:i+1});
      steps.push({kind:'hold', dur: p.hold, cycle:i+1});
    } else {
      steps.push({kind:'rest', dur: p.rest, cycle:i+1});
      steps.push({kind:'hold', dur: p.first + i*p.step, cycle:i+1});
    }
  }
  steps.push({kind:'calm', dur: CALM, cycle: ROUNDS});
  return steps;
}

/* En-tête façon STAmina : valeur variable (pas) valeur fixe */
function tableHeader(type, pb, diffKey, rounds){
  if(type === 'custom'){
    const rr = rounds || [];
    const holds = rr.map(r=>r.hold), rests = rr.map(r=>r.rest);
    const rg = a => a.length ? (Math.min(...a) === Math.max(...a)
      ? fmt(a[0]) : fmt(Math.min(...a)) + '→' + fmt(Math.max(...a))) : '—';
    return { variable: rg(rests), step: rr.length + ' rounds', fixed: rg(holds), custom:true };
  }
  const p = tableParams(type, pb, diffKey);
  return type === 'co2'
    ? { variable: fmt(p.rest), step: '-' + p.restStep, fixed: fmt(p.hold) }
    : { variable: fmt(p.first), step: '+' + p.step,    fixed: fmt(p.rest) };
}

/* Colorise l'en-tête : repos en vert, apnée en rouge, selon le type */
function headerColored(type, h){
  if(h.custom) return `<span class="tm-rest">${h.variable}</span> · <span class="tm-hold">${h.fixed}</span> · ${h.step}`;
  const v = type === 'co2'
    ? `<span class="tm-rest">${h.variable}</span> (${h.step}) · <span class="tm-hold">${h.fixed}</span>`
    : `<span class="tm-hold">${h.variable}</span> (${h.step}) · <span class="tm-rest">${h.fixed}</span>`;
  return `↻ ${ROUNDS} · ` + v;
}

function tableTotal(steps){ return steps.reduce((a,s)=>a+s.dur,0); }
function tableHoldTotal(steps){ return steps.filter(s=>s.kind==='hold').reduce((a,s)=>a+s.dur,0); }

/* =====================================================================
   PROGRAMMES

   Doctrine : le max de référence joue déjà le rôle de modulateur

   passe donc par quatre leviers : le retest du max, la difficulté,
   le volume hebdomadaire et le mélange CO2 / O2 / souffle.

   Une phase = un focus + un nombre de semaines + une semaine type.
   Une durée plus longue ajoute des phases, elle n'étire pas les
   existantes.

/* --- lecture de l'état du programme en cours --- */
function progDef(){ return S.program ? PROGRAMS[S.program.id] : null; }

function progPhases(){
  const d = progDef();
  if(!d || !S.program) return [];
  const list = d.phases[S.program.duration] || [];
  let start = 1;
  return list.map(p=>{
    const o = Object.assign({}, p, { weekStart:start, weekEnd:start + p.weeks - 1 });
    start += p.weeks;
    return o;
  });
}
function progTotalWeeks(){ return progPhases().reduce((a,p)=>a+p.weeks, 0); }

/* Semaine courante, calée sur la date de départ. Bornée à la dernière. */
function progWeek(){
  if(!S.program) return 1;
  const days = Math.floor((Date.now() - S.program.startDate) / 86400000);
  return Math.min(progTotalWeeks(), Math.max(1, Math.floor(days/7) + 1));
}
function progPhaseAt(week){
  return progPhases().find(p=> week >= p.weekStart && week <= p.weekEnd) || null;
}
function progDone(){ return progWeek() >= progTotalWeeks() && progSlotsDone(progWeek()) >= progSlots(progWeek()).length; }

/* Créneaux d'une semaine, avec une clé stable pour le suivi */
function progSlots(week){
  const ph = progPhaseAt(week);
  if(!ph) return [];
  return ph.week.map((sl,i)=> Object.assign({}, sl, {
    key: S.program.id + ':' + S.program.duration + ':w' + week + ':' + i,
    phase: ph.id, phaseName: ph.name, week, index:i
  }));
}
function slotDone(key){ return S.history.some(e=> e.programSlot === key); }
function progSlotsDone(week){ return progSlots(week).filter(sl=>slotDone(sl.key)).length; }

/* Assiduité : créneaux honorés sur créneaux proposés depuis le départ */
function progAdherence(){
  let total = 0, done = 0;
  for(let w=1; w<=progWeek(); w++){
    const sl = progSlots(w);
    total += sl.length;
    done  += sl.filter(x=>slotDone(x.key)).length;
  }
  return { total, done, pct: total ? Math.round(done*100/total) : 0 };
}

/* Table virtuelle dérivée d'un créneau : jamais écrite en bibliothèque */
function slotTable(sl){
  if(sl.t === 'breath' || sl.t === 'max') return null;
  return {
    id: 'prog:' + sl.key,
    program: true,
    programSlot: sl.key,
    name: (sl.t === 'co2' ? 'CO₂' : 'O₂') + ' · ' + DIFF[sl.d].name,
    type: sl.t,
    difficulty: sl.d,
    pb: S.pb,
    rounds: null,
    createdAt: S.program ? S.program.startDate : Date.now()
  };
}

function startProgram(id, duration){
  S.program = { id, duration, startDate: Date.now() };
  save(); goto('home');
  toast('Programme lancé : ' + PROGRAMS[id].name + ' · ' + duration + ' semaines.');
}

}

/* ---------------------------------------------------------------------
   FORMAT
   --------------------------------------------------------------------- */
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function fmtLong(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  if(m === 0) return s + ' s';
  return m + ' min ' + (s ? String(s).padStart(2,'0') : '00');
}
function fmtHM(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  if(h === 0) return m + ' min';
  return h + ' h ' + String(m).padStart(2,'0');
}

function dateLabel(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(locale(),{weekday:'short',day:'numeric',month:'short'}) +
         ' · ' + d.toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'});
}

/* ---------------------------------------------------------------------
   SON + VIBRATION
   --------------------------------------------------------------------- */
let AC = null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, vol){
  if(!S.sound) return;
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(vol||.22, ac.currentTime + .012);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (dur||.18));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (dur||.18) + .04);
}
function buzz(pattern){
  if(!S.vibrate) return;
  if(navigator.vibrate) navigator.vibrate(pattern);
}
/* ---------------------------------------------------------------------
   VOIX — annonce des minutes restantes
   Sur iOS la synthèse doit être débloquée par un geste utilisateur :
   primeVoice() est appelé au lancement d'une séance.
   --------------------------------------------------------------------- */
let voiceReady = false;

function primeVoice(){
  if(voiceReady || !S.voice || !window.speechSynthesis) return;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0; u.lang = 'fr-FR';
    window.speechSynthesis.speak(u);
    voiceReady = true;
  }catch(e){}
}

function say(text){
  if(!S.voice || !window.speechSynthesis) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.95;
    u.pitch = 1;
    u.volume = 0.9;
    const fr = window.speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
    if(fr.length) u.voice = fr[0];
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function stopVoice(){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }

const CUE = {
  tick:   ()=>{ beep(660,.09,.16); buzz(30); },
  goHold: ()=>{ beep(392,.5,.28); buzz([0,180]); },
  endHold:()=>{ beep(880,.16,.26); setTimeout(()=>beep(1174,.28,.26),170); buzz([0,120,80,180]); },
  half:   ()=>{ beep(523,.12,.14); buzz(50); },
  done:   ()=>{ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.3,.26), i*180)); buzz([0,200,100,200,100,400]); }
};

const RUN = {

function startBreath(key, minutes, stepVal){
  if(!disclaimerAccepted()){ requireDisclaimer(()=>startBreath(key, minutes, stepVal)); return; }

  const slot = RUN.programSlot || null;

/* Le guide recommande une seule table par jour : on le rappelle
   sans jamais bloquer. */
function launchTable(type){
  if(!disclaimerAccepted()){ requireDisclaimer(()=>launchTable(type)); return; }
  const t = currentTable();
  if(t && t.program){ startSession(type); return; }   // le programme gère déjà le rythme
  const today = new Date().toDateString();
  const already = S.history.find(e=>
    e.type !== 'breath' && e.type !== 'max' && new Date(e.ts).toDateString() === today);
  if(!already){ startSession(type); return; }
  openModal({
    title:"Déjà une table aujourd'hui",
    body:"Tu as fait une séance de type " + typeLabel(already.type) + " il y a " +
         Math.max(1, Math.round((Date.now()-already.ts)/3600000)) + " h. Enchaîner deux tables le même jour cumule la fatigue sans bénéfice supplémentaire.",
    actions:[
      { label:'Lancer quand même', kind:'primary', fn:()=>startSession(type) },
      { label:'Une autre fois' }
    ]
  });
}

function startSession(type){
  if(!disclaimerAccepted()){ requireDisclaimer(()=>startSession(type)); return; }
  audio(); primeVoice();
  const t = (type === 'max') ? null : currentTable();
  const slot = RUN.programSlot || (t && t.programSlot) || null;
  RUN.active = true;
  RUN.type = type;
  RUN.programSlot = slot;
  RUN.tableId = t ? t.id : null;
  RUN.difficulty = t ? t.difficulty : null;
  RUN.pb = t ? t.pb : S.pb;
  RUN.freeMax = (type === 'max');
  RUN.steps = (type === 'max')
    ? [{kind:'hold', dur:0, cycle:1, free:true}]
    : buildTable(t.type, t.pb, t.difficulty, t.rounds);
  if(type !== 'max' && S.prep > 0){
    RUN.steps.unshift({ kind:'prep', dur: S.prep, cycle: 1, label:'Installe-toi' });
  }
  RUN.idx = 0;
  RUN.results = [];
  RUN.paused = false; RUN.pausedMs = 0; RUN.cued = {}; RUN.restDone = 0;
  lockScreen();
  if(type === 'max'){
    RUN.countdown = 3;
    RUN.stepStart = 0;
    route = 'run';
    runCountdown();
  } else {
    RUN.stepStart = Date.now();
    goto('run');
  }
  loop();
  RUN.logic = setInterval(tickLogic, 200);
}

function runCountdown(){
  RUN.stepStart = 0;
  render();
  const step = ()=>{
    if(RUN.countdown > 0){
      CUE.tick();
      render();
      RUN.countdown--;
      setTimeout(step, 1000);
    } else {
      RUN.countdown = 0;
      RUN.stepStart = Date.now();
      CUE.goHold();
      render();
    }
  };
  step();
}

/* Sauvegarde de la séance en cours après chaque phase, pour pouvoir
   reprendre si l'app est fermée, si un appel arrive, ou après un plantage. */
function saveRun(){
  if(!RUN.active) return;
  try{
    localStorage.setItem(LSR, JSON.stringify({
      v: 1, ts: Date.now(),
      type: RUN.type, tableId: RUN.tableId, difficulty: RUN.difficulty, pb: RUN.pb,
      breathKey: RUN.breathKey, breathMin: RUN.breathMin,
      steps: RUN.steps, idx: RUN.idx, results: RUN.results, restDone: RUN.restDone || 0,
      freeMax: RUN.freeMax
    }));
  }catch(e){}
}
function clearRun(){ try{ localStorage.removeItem(LSR); }catch(e){} }

function pendingRun(){
  try{
    const r = JSON.parse(localStorage.getItem(LSR));
    if(!r || r.v !== 1 || !r.steps || r.idx >= r.steps.length) return null;
    if(Date.now() - r.ts > 6*3600*1000) return null;   // trop vieux, on oublie
    return r;
  }catch(e){ return null; }
}

function resumeRun(){
  const r = pendingRun();
  if(!r) return;
  audio(); primeVoice();
  Object.assign(RUN, {
    active:true, type:r.type, tableId:r.tableId, difficulty:r.difficulty, pb:r.pb,
    breathKey:r.breathKey, breathMin:r.breathMin, freeMax:!!r.freeMax,
    steps:r.steps, idx:r.idx, results:r.results||[], restDone:r.restDone||0,
    paused:false, pausedMs:0, cued:{}, countdown:0
  });
  RUN.stepStart = Date.now();          // la phase interrompue redémarre au début
  lockScreen(); goto('run'); loop();
  RUN.logic = setInterval(tickLogic, 200);
  toast('Séance reprise au cycle ' + (curStep() ? curStep().cycle : 1) + '.');
}

function discardRun(){ clearRun(); render(); }

function elapsedMs(){
  if(!RUN.stepStart) return 0;
  const now = RUN.paused ? RUN.pauseStart : Date.now();
  return now - RUN.stepStart - RUN.pausedMs;
}
function curStep(){ return RUN.steps[RUN.idx]; }

function loop(){
  cancelAnimationFrame(RUN.raf);
  const frame = ()=>{
    if(!RUN.active) return;
    paint();
    RUN.raf = requestAnimationFrame(frame);
  };
  RUN.raf = requestAnimationFrame(frame);
}

function tickLogic(){
  if(!RUN.active || RUN.paused || !RUN.stepStart) return;
  const st = curStep(); if(!st) return;
  const el = elapsedMs()/1000;

  if(st.free) return;               // test de max : pas de fin automatique

  const rem = st.dur - el;
  const key = RUN.idx + ':';

  // Annonce vocale à chaque minute pleine restante (apnée et repos, hors souffle)
  if(RUN.type !== 'breath' && !st.free && rem > 55){
    const mm = Math.round(rem / 60);
    if(mm >= 1 && Math.abs(rem - mm*60) <= 0.35 && !RUN.cued[key+'v'+mm]){
      RUN.cued[key+'v'+mm] = 1;
      say(mm === 1 ? 'Une minute' : mm + ' minutes');
    }
  }

  if(st.kind !== 'hold'){
    if(rem <= 30 && rem > 29 && st.dur > 45 && !RUN.cued[key+'30']){ RUN.cued[key+'30']=1; CUE.half(); }
    if(rem <= 3.4 && !RUN.cued[key+'c'+Math.ceil(rem)] && rem > 0.2){
      RUN.cued[key+'c'+Math.ceil(rem)] = 1; CUE.tick();
    }
  } else {
    const half = st.dur/2;
    if(el >= half && !RUN.cued[key+'h']){ RUN.cued[key+'h']=1; CUE.half(); }
    if(rem <= 5.4 && rem > 0.2 && !RUN.cued[key+'c'+Math.ceil(rem)]){
      RUN.cued[key+'c'+Math.ceil(rem)] = 1; CUE.tick();
    }
    // Décompte vocal de reprise : on ne veut pas ouvrir les yeux ici
    const MOTS = {3:'trois', 2:'deux', 1:'un'};
    const c = Math.ceil(rem);
    if(rem <= 3.4 && rem > 0.2 && MOTS[c] && !RUN.cued[key+'sv'+c]){
      RUN.cued[key+'sv'+c] = 1; say(MOTS[c]);
    }
  }

  if(rem <= 0) advance(st.dur);
}

function advance(actualHoldSec){
  const st = curStep();
  if(st.kind === 'hold'){
    RUN.results.push({planned: st.dur, actual: Math.round(actualHoldSec)});
    CUE.endHold();
    if(RUN.steps[RUN.idx+1]) say('Respire');
  } else {
    RUN.restDone = (RUN.restDone || 0) + st.dur;
  }
  RUN.idx++;
  RUN.pausedMs = 0; RUN.paused = false;
  if(RUN.idx >= RUN.steps.length){ finish(true); return; }
  RUN.stepStart = Date.now();
  saveRun();
  if(curStep().kind === 'hold') CUE.goHold();
  render();
}

function stopHoldEarly(){
  const st = curStep();
  if(!st || st.kind !== 'hold') return;
  const el = elapsedMs()/1000;
  if(st.free){                       // test de max
    RUN.results.push({planned:0, actual: Math.round(el)});
    CUE.endHold();
    finish(true);
    return;
  }
  advance(el);
}

function togglePause(){
  if(RUN.paused){
    RUN.pausedMs += Date.now() - RUN.pauseStart;
    RUN.paused = false;
  } else {
    RUN.pauseStart = Date.now();
    RUN.paused = true;
  }
  render();
}

function abortSession(){
  askConfirm('Arrêter la séance ?',
    'Les apnées déjà réalisées seront enregistrées dans ton journal.',
    'Arrêter', ()=>finish(false), true);
}

function finish(complete){
  clearInterval(RUN.logic); cancelAnimationFrame(RUN.raf);
  stopVoice(); unlockScreen(); clearRun();
  RUN.active = false;
  if(complete) CUE.done();

  const totalHold = RUN.results.reduce((a,r)=>a+r.actual,0);
  if(RUN.results.length || RUN.type === 'breath'){
    const entry = {
      id: uid(),
      ts: Date.now(),
      type: RUN.type,
      tableId: (RUN.tableId && !String(RUN.tableId).startsWith('prog:')) ? RUN.tableId : null,
      difficulty: RUN.difficulty,
      pb: RUN.pb,
      holds: RUN.results.slice(),
      totalHold,
      totalRest: RUN.restDone || 0,
      programSlot: RUN.programSlot || null,
      breathKey: RUN.breathKey || null,
      breathMin: RUN.breathMin || null,
      done: complete && RUN.idx >= RUN.steps.length
    };
    S.history.unshift(entry);
    S.history = S.history.slice(0,120);
    // Le test de max propose la mise à jour du PB
    if(RUN.type === 'max'){
      const best = RUN.results[0].actual;
      if(best > S.pb){
        setTimeout(()=>{
          askConfirm('Nouveau record : ' + fmt(best),
            'Ton max de référence est actuellement de ' + fmt(S.pb) + '. Le mettre à jour recalculera les prochaines tables générées.',
            'Mettre à jour',
            ()=>{ S.pb = best; S.pbAt = Date.now(); notePb(best); save(); render(); toast('Max de référence mis à jour.'); });
        }, 500);
      }
    }
    save();
  }
  noteDraft = { rpe:0, contractions:null, text:'' };
  lastSummary = (RUN.results.length || RUN.type === 'breath') ? S.history[0] : null;
  goto(lastSummary ? 'summary' : 'home');
}
let lastSummary = null;

/* ---------------------------------------------------------------------
   PEINTURE DU CADRAN (rAF)
   --------------------------------------------------------------------- */
const R_RING = 138, C_RING = 2*Math.PI*R_RING;

function paint(){
  if(route !== 'run') return;
  const st = curStep(); if(!st) return;
  const big = document.getElementById('big');
  const small = document.getElementById('small');
  const ring = document.getElementById('ring');
  const waves = document.getElementById('waves');
  if(!big || !ring) return;

  if(RUN.countdown > 0 || !RUN.stepStart) return;

  const el = elapsedMs()/1000;
  let p, mainTxt, subTxt;

  if(st.free){
    p = Math.min(1, el / Math.max(60, S.pb * 1.2));
    mainTxt = fmt(el);
    subTxt = 'MAX ACTUEL ' + fmt(S.pb);
  } else if(st.kind === 'hold'){
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    subTxt = 'ÉCOULÉ ' + fmt(el) + '  ·  SUR ' + fmt(st.dur);
  } else if(RUN.type === 'breath'){
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    subTxt = st.label ? st.label.toUpperCase() : '';
  } else if(st.kind === 'calm'){
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    subTxt = 'RÉCUPÉRATION FINALE';
  } else {
    p = Math.min(1, el / st.dur);
    mainTxt = fmt(Math.max(0, st.dur - el));
    const nx = RUN.steps[RUN.idx+1];
    subTxt = nx ? 'APNÉE SUIVANTE ' + fmt(nx.dur) : '';
  }

  big.textContent = mainTxt;
  if(small) small.textContent = LANG === 'fr' ? subTxt : tPattern(subTxt);

  // Équivalent textuel pour lecteur d'écran : phase + minute entamée
  const live = document.getElementById('srLive');
  if(live){
    const tag = (st.label || (st.kind === 'hold' ? 'Apnée' : st.kind === 'calm' ? 'Se calmer' : st.kind === 'prep' ? 'Préparation' : 'Respiration'))
      + ' — ' + mainTxt;
    if(live.dataset.t !== tag && (Math.round(el) % 15 === 0 || el < 1)){
      live.dataset.t = tag; live.textContent = tag;
    }
  }
  ring.style.strokeDashoffset = String(C_RING * (1 - p));
  if(waves) waves.setAttribute('transform', 'translate(0,' + (300 - p*310).toFixed(1) + ')');
}

   RENDU
   --------------------------------------------------------------------- */
let toastData = null;      // {msg, kind}
let toastTimer = null;

function toast(msg, kind){
  clearTimeout(toastTimer);
  toastData = { msg, kind: kind || 'ok' };
  render();
  toastTimer = setTimeout(()=>{ toastData = null; render(); }, kind === 'err' ? 4200 : 2600);
}
function toastHtml(){
  if(!toastData) return '';
  return `<div class="toast ${toastData.kind === 'err' ? 'err' : ''}" onclick="toastData=null;render()">
    <span class="toast-ico">${toastData.kind === 'err' ? '!' : '✓'}</span>
    <span class="toast-txt">${escapeHtml(toastData.msg)}</span>
  </div>`;
}

let modal = null;   // {title, body, actions:[{label, kind, fn}]}

function openModal(m){ modal = m; render(); }
function closeModal(){ modal = null; render(); }

function modalHtml(){
  if(!modal) return '';
  return `<div class="veil" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <div class="sheet-grip"></div>
      <h3>${modal.title}</h3>
      ${modal.body ? `<p>${modal.body}</p>` : ''}
      ${modal.input ? `<input class="field${modal.input.text?' text':''}" id="modalIn"
          type="text" inputmode="${modal.input.numeric?'numeric':'text'}"
          value="${escapeHtml(modal.input.value||'')}"
          placeholder="${escapeHtml(modal.input.placeholder||'')}"
          style="margin-bottom:18px">` : ''}
      ${modal.actions.map((a,i)=>
        `<button class="btn ${a.kind||'ghost'}" onclick="modalAction(${i})">${a.label}</button>`).join('')}
    </div>
  </div>`;
}
function modalAction(i){
  const a = modal && modal.actions[i];
  if(!a) return;
  const el = document.getElementById('modalIn');
  const val = el ? el.value : null;
  closeModal();
  if(a.fn) a.fn(val);
}

/* Remplace confirm() : les boîtes natives sont bloquées par Safari
   en mode PWA après le premier usage. */
function askConfirm(title, body, okLabel, fn, danger){
  openModal({
    title, body,
    actions:[
      { label: okLabel, kind: danger ? 'ghost' : 'primary', fn },
      { label: 'Annuler' }
    ]
  });
}

/* Remplace prompt() */
function askValue(title, body, value, fn, opts){
  openModal({
    title, body,
    input: Object.assign({ value, numeric:true }, opts||{}),
    actions:[ { label:'Valider', kind:'primary', fn }, { label:'Annuler' } ]

}

function goToLogin(mode){
  authMode = mode || 'in';
  authMsg = '';
  goto('account');
}

function requireAccount(then){
  if(S.cloudEmail){ then(); return; }
  if(!cloudConfigured){
    openModal({
      title:'Compte indisponible',
      body:"La synchronisation n'est pas configurée sur cette instance. Tu peux continuer sans compte, mais tes tables resteront sur cet appareil.",
      actions:[{label:'Continuer quand même', kind:'primary', fn:then}, {label:'Annuler'}]
    });
    return;
  }
  authIntent = then;
  openModal({
    title:'Un compte est nécessaire',
    body:"Créer une table demande un compte, pour que tes tables et tes séances te suivent d'un appareil à l'autre et survivent à une réinstallation. Tu reviendras ici juste après.",

  const app = document.getElementById('app');
  let html = '';
  if(recoveryMode)             html = viewRecovery();

  else if(route === 'preview') html = viewPreview();
  else if(route === 'create')  html = viewCreate();
  else if(route === 'account') html = viewAccount();
  else if(route === 'manage')  html = viewManage();
  else if(route === 'breath')  html = viewBreath();
  else if(route === 'breathDetail') html = viewBreathDetail();
  else if(route === 'guide')   html = viewGuide();
  else if(route === 'session') html = viewSession();
  else if(route === 'help')    html = viewHelp();
  else if(route === 'programs')      html = viewPrograms();
  else if(route === 'programOffer')  html = viewProgramOffer();
  else if(route === 'programDetail') html = viewProgramDetail();
  else if(route === 'disclaimer')    html = viewDisclaimer();

}

function parseTime(str){
  str = String(str||'').trim().replace(',', ':').replace(/\s/g,'');
  if(/^\d+$/.test(str)) return parseInt(str,10);
  const m = str.match(/^(\d+):(\d{1,2})$/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

/* Extrait les rounds d'une table calculée pour les rendre éditables un à un.
   La table cesse alors d'être dérivée du max : elle devient autonome. */
function roundsFromGenerated(type, pb, diff, rounds){
  const steps = buildTable(type, pb, diff, rounds).filter(st=>st.kind !== 'calm');
  const out = [];
  for(let i=0;i<steps.length;i+=2){
    out.push({ rest: steps[i].dur, hold: steps[i+1] ? steps[i+1].dur : 60 });
  }
  return out;
}

function convertToCustom(){
  const d = ensureDraft();
  if(d.type === 'custom') return;
  keepName();
  const src = d.type;
  d.rounds = roundsFromGenerated(d.type, d.pb, d.difficulty, null);
  d.type = 'custom';
  if(!d.name) d.name = (src === 'co2' ? 'CO₂ ' : 'O₂ ') + fmt(d.pb) + ' personnalisée';
  render();
  toast('Table déverrouillée : chaque round est modifiable.');
}

function roundsEditor(d){
  if(!d.rounds) d.rounds = defaultRounds();
  const rows = d.rounds.map((r,i)=>`
    <div class="rnd">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <div class="rnd-f">
        <span class="rnd-lbl tm-rest">Repos</span>
        <button class="field rnd-in" onclick="openRound(${i},'rest')">${fmt(r.rest)}</button>
      </div>
      <div class="rnd-f">
        <span class="rnd-lbl tm-hold">Apnée</span>
        <button class="field rnd-in" onclick="openRound(${i},'hold')">${fmt(r.hold)}</button>
      </div>
      <button class="rnd-del" onclick="delRound(${i})" aria-label="Supprimer">✕</button>
    </div>`).join('');

  return `
    <div class="card flat" style="padding:16px 14px">
      <div class="row" style="margin-bottom:12px">
        <span style="font-size:13px;color:var(--mute)">Appliquer à tous les rounds</span>
      </div>
      <div class="row" style="gap:8px;margin-bottom:6px">
        <button class="btn ghost" style="margin:0;padding:11px;font-size:13.5px" onclick="fillAll('rest')">Repos identique</button>
        <button class="btn ghost" style="margin:0;padding:11px;font-size:13.5px" onclick="fillAll('hold')">Apnée identique</button>

      <span><i style="background:var(--rest-c)"></i>Repos</span>
      <span><i style="background:var(--hold-c)"></i>Apnée</span>

/* Sélecteur de durée d'un round, présenté comme celui du max :
   deux menus déroulants dans une feuille, plutôt qu'une saisie texte. */
let rpick = null;   // { i, key, m, s }

function openRound(i, key){
  keepName();
  const d = ensureDraft();
  const v = d.rounds[i][key];
  rpick = { i, key, m: Math.floor(v/60), s: v % 60 };
  render();
}
function setRpick(field, val){
  if(!rpick) return;
  rpick[field] = parseInt(val, 10);
  if(rpick.m >= 30){ rpick.m = 30; rpick.s = 0; }
  render();
}
function applyRpick(){
  if(!rpick) return;
  const d = ensureDraft();
  const v = Math.max(5, Math.min(1800, rpick.m*60 + rpick.s));
  d.rounds[rpick.i][rpick.key] = v;
  rpick = null; render();
}
function closeRpick(){ rpick = null; render(); }

function rpickHtml(){
  if(!rpick) return '';
  const isRest = rpick.key === 'rest';
  const mins = Array.from({length:31}, (_,i)=>i);
  const secs = Array.from({length:12}, (_,i)=>i*5);
  return `<div class="veil" onclick="if(event.target===this)closeRpick()">
    <div class="sheet">
      <div class="sheet-grip"></div>
      <h3><span class="${isRest?'tm-rest':'tm-hold'}">${isRest?'Repos':'Apnée'}</span> · round ${rpick.i+1}</h3>
      <div class="picker" style="justify-content:center">
        <div class="picker-col">
          <select class="picker-sel" onchange="setRpick('m', this.value)">
            ${mins.map(v=>`<option value="${v}" ${v===rpick.m?'selected':''}>${v}</option>`).join('')}
          </select>
          <span class="picker-unit">min</span>
        </div>
        <span class="picker-sep">:</span>
        <div class="picker-col">
          <select class="picker-sel" onchange="setRpick('s', this.value)" ${rpick.m>=30?'disabled':''}>
            ${secs.map(v=>`<option value="${v}" ${v===rpick.s?'selected':''}>${String(v).padStart(2,'0')}</option>`).join('')}
          </select>
          <span class="picker-unit">sec</span>
        </div>
      </div>
      <button class="btn primary" onclick="applyRpick()">Valider</button>
      <button class="btn ghost" onclick="closeRpick()">Annuler</button>
    </div>
  </div>`;
}

function keepName(){
  const el = document.getElementById('nameDraft');
  if(el && draft) draft.name = el.value;
}
function setRound(i, key, val){
  const d = ensureDraft(); keepName();
  const v = parseTime(val);
  if(!v || v < 5 || v > 1800){ toast('Durée invalide (5 s à 30:00).','err'); render(); return; }
  d.rounds[i][key] = v; render();
}
function addRound(){
  const d = ensureDraft(); keepName();
  if(d.rounds.length >= 20){ toast('20 rounds maximum.','err'); return; }
  const last = d.rounds[d.rounds.length-1] || { rest:120, hold:60 };
  d.rounds.push({ rest:last.rest, hold:last.hold });
  render();
}
function delRound(i){
  const d = ensureDraft(); keepName();
  if(d.rounds.length <= 1){ toast('Il faut au moins un round.','err'); return; }
  d.rounds.splice(i,1); render();
}
function fillAll(key){
  const d = ensureDraft(); keepName();
  askValue(key === 'rest' ? 'Repos identique' : 'Apnée identique',
    'Cette durée sera appliquée aux ' + d.rounds.length + ' rounds. Format m:ss.',
    fmt(d.rounds[0][key]),
    (val)=>{
      const v = parseTime(val);
      if(!v || v < 5 || v > 1800){ toast('Durée invalide (5 s à 30:00).','err'); return; }
      d.rounds.forEach(r=>r[key] = v); render();
    });
}

const PB_MIN = 15;
const PB_MAX = 900;   // 15:00

function timePicker(sec){
  const m = Math.floor(sec/60), s = sec % 60;
  const mins = Array.from({length:16}, (_,i)=>i);
  const secs = Array.from({length:12}, (_,i)=>i*5);
  return `<div class="picker">
    <div class="picker-col">
      <select class="picker-sel" onchange="setDraftTime(this.value, null)">
        ${mins.map(v=>`<option value="${v}" ${v===m?'selected':''}>${v}</option>`).join('')}
      </select>
      <span class="picker-unit">min</span>
    </div>
    <span class="picker-sep">:</span>
    <div class="picker-col">
      <select class="picker-sel" onchange="setDraftTime(null, this.value)" ${m>=15?'disabled':''}>
        ${secs.map(v=>`<option value="${v}" ${v===s?'selected':''}>${String(v).padStart(2,'0')}</option>`).join('')}
      </select>
      <span class="picker-unit">sec</span>
    </div>
  </div>`;
}

function setDraftTime(mm, ss){
  const d = ensureDraft();
  let m = mm === null ? Math.floor(d.pb/60) : parseInt(mm,10);
  let s = ss === null ? d.pb % 60          : parseInt(ss,10);
  if(m >= 15){ m = 15; s = 0; }
  let v = Math.min(PB_MAX, Math.max(PB_MIN, m*60 + s));
  const el = document.getElementById('nameDraft');
  if(el) d.name = el.value;
  d.pb = v; render();
}
function saveDraft(){
  const d = ensureDraft();
  const el = document.getElementById('nameDraft');
  if(el) d.name = el.value;

  const fields = {
    name: (d.name || '').trim() || defaultName(d),
    type: d.type,
    difficulty: d.difficulty,
    pb: d.pb,
    rounds: d.type === 'custom' ? JSON.parse(JSON.stringify(d.rounds || defaultRounds())) : null,
    updatedAt: Date.now()
  };

  let id = editingId;
  if(id){
    const t = S.tables.find(x=>x.id === id);
    if(t) Object.assign(t, fields);
  } else {
    id = uid();
    S.tables.unshift(Object.assign({ id, createdAt: Date.now() }, fields));
  }

  const wasEdit = !!editingId;
  save(); draft = null; editingId = null;
  pending = { tableId: id }; goto('preview');
  toast(wasEdit ? 'Table modifiée.' : 'Table enregistrée.');
}

function planTable(steps){
  const rows = [];
  const nb = Math.floor(steps.filter(s=>s.kind !== 'calm').length / 2);
  for(let i=0;i<nb;i++){
    const rest = steps[i*2], hold = steps[i*2+1];
    rows.push(`<div class="plan-row">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <span class="pt rest">${fmt(rest.dur)}</span>
      <span class="pt hold">${fmt(hold.dur)}</span>
    </div>`);
  }
  rows.push(`<div class="plan-row">
      <span class="pn">—</span>
      <span class="pt rest">${fmt(CALM)}</span>
      <span class="pt" style="color:var(--mute);font-size:13px">se calmer</span>
    </div>`);
  return `<div class="legend">
      <span><i style="background:var(--rest-c)"></i>Repos</span>
      <span><i style="background:var(--hold-c)"></i>Apnée</span>
    </div>
    <div class="plan">
      <div class="plan-row head"><span>#</span><span>Respirez</span><span>Retenez</span></div>
      ${rows.join('')}
    </div>`;
}

/* ---------- détail d'une table enregistrée ---------- */
function openTable(id){ pending = {tableId:id}; goto('preview'); }
function currentTable(){
  const id = pending && pending.tableId;
  if(!id) return null;
  if(String(id).startsWith('prog:')){
    const key = String(id).slice(5);
    const sl = progSlots(progWeek()).find(x=>x.key === key);
    return sl ? slotTable(sl) : null;
  }
  return S.tables.find(t=>t.id === id);
}

function openProgramTable(key){ pending = { tableId: 'prog:' + key }; goto('preview'); }

/* Lance directement un créneau souffle ou un test de max */
function startProgramSlot(key){
  const sl = progSlots(progWeek()).find(x=>x.key === key);
  if(!sl) return;
  if(sl.t === 'max'){ RUN.programSlot = key; startSession('max'); return; }
  if(sl.t === 'breath'){
    const b = BREATH[sl.b];
    if(!b) return;
    RUN.programSlot = key;
    startBreath(sl.b, b.durations[Math.min(1, b.durations.length-1)], b.steps[1]);
  }
}

function viewPreview(){
  const t = currentTable();
  if(!t) return viewHome();
  const steps = buildTable(t.type, t.pb, t.difficulty, t.rounds);
  const h = tableHeader(t.type, t.pb, t.difficulty, t.rounds);
  const isCO2 = t.type === 'co2';
  return `
  <div class="screen">
    <div class="eyebrow">${t.program ? 'Programme · ' : ''}${isCO2 ? 'Table CO₂' : 'Table O₂'} · ${DIFF[t.difficulty].name}</div>
    <h1>${escapeHtml(t.name)}</h1>
    <p class="sub">${isCO2
      ? 'Apnée constante à ' + Math.round(DIFF[t.difficulty].co2*100) + ' % du max. La respiration perd 10 s à chaque cycle.'
      : 'Respiration constante. L\'apnée monte jusqu\'à ' + Math.round(DIFF[t.difficulty].o2*100) + ' % du max.'}</p>

    <div class="card flat">
      <div class="tile-meta" style="margin:0">${headerColored(t.type, h)}</div>
      <div class="row" style="margin-top:10px"><span style="color:var(--mute);font-size:13.5px">Max utilisé</span><span class="pt">${fmt(t.pb)}</span></div>
      <div class="row" style="margin-top:6px"><span style="color:var(--mute);font-size:13.5px">Durée totale</span><span class="pt">${fmtLong(tableTotal(steps))}</span></div>
      <div class="row" style="margin-top:6px"><span style="color:var(--mute);font-size:13.5px">Dont apnée</span><span class="pt hold">${fmtLong(tableHoldTotal(steps))}</span></div>
    </div>

    ${planTable(steps)}

    <p class="hint" style="margin-bottom:16px">Chaque cycle commence par la respiration, puis l'apnée. La première respiration sert de ventilation préparatoire.</p>

    <button class="btn primary" onclick="launchTable('${t.type}')">Lancer la table</button>
    ${t.program ? `
      <button class="btn ghost" onclick="goto('home')">Retour</button>
      <p class="hint" style="text-align:center">Table générée par ton programme depuis ton max courant. Elle n'est pas enregistrée dans ta bibliothèque.</p>
    ` : `
      <div class="row" style="gap:10px;margin-top:10px">
        <button class="btn ghost" style="margin:0;padding:13px" onclick="editTable('${t.id}')">Modifier</button>
        <button class="btn ghost" style="margin:0;padding:13px" onclick="duplicateTable('${t.id}')">Dupliquer</button>
      </div>
      ${t.type !== 'custom' ? `<button class="btn ghost" onclick="customizeTable('${t.id}')">Personnaliser les rounds</button>` : ''}
      <button class="btn ghost" onclick="togglePin('${t.id}')">${t.pinned ? 'Retirer des épinglées' : 'Épingler en haut'}</button>
      <button class="btn ghost" onclick="goto('home')">Retour</button>
      <button class="btn ghost" style="color:var(--danger);border-color:rgba(224,121,108,.28)"
              onclick="deleteTable('${t.id}')">Supprimer cette table</button>
    `}

    ${tabbar('home')}
  </div>`;
}
function deleteTable(id){
  const t = S.tables.find(x=>x.id === id);
  askConfirm(
    'Supprimer cette table ?',
    (t ? '« ' + t.name +' » sera retirée de ta bibliothèque. ' : '') +
    'Les séances déjà enregistrées avec elle sont conservées dans ton journal.',
    'Supprimer',
    ()=>{
      S.tables = S.tables.filter(x=>x.id !== id);
      if(!S.deleted.includes(id)) S.deleted.push(id);
      save(); pending = null; goto('home');
      toast('Table supprimée.');
    },
    true
  );
}

/* ---------- run ---------- */
function viewRun(){
  const st = curStep();
  if(!st) return '';
  const isHold = st.kind === 'hold';
  const cycleTot = RUN.freeMax ? 1 : ROUNDS;

  if(RUN.countdown > 0){
    return `<div class="cd"><span>${RUN.countdown}</span></div>`;
  }

  const isCalm = st.kind === 'calm';
  const isPrep = st.kind === 'prep';
  const isBreath = RUN.type === 'breath';
  const phaseCls = (isHold || st.kind === 'hin' || st.kind === 'hout') ? 'hold' : 'rest';
  const label = st.label ? t(st.label).toUpperCase()
    : (st.free ? 'APNÉE LIBRE' : (isHold ? 'APNÉE' : (isCalm ? 'SE CALMER' : 'RESPIRE')));

  return `
  <div class="run phase-${phaseCls} ${phaseCls}">
    <div class="run-top">
      <span class="run-cycle">${RUN.freeMax ? 'TEST DE MAX'
        : isBreath ? BREATH[RUN.breathKey].name + ' · ' + st.cycle + ' / ' + RUN.steps[RUN.steps.length-1].cycle
        : 'CYCLE ' + st.cycle + ' / ' + cycleTot}</span>
      <button class="run-x" onclick="abortSession()" aria-label="Arrêter la séance">✕</button>
    </div>

    <div class="run-mid">
      <div class="phase-label ${phaseCls}">${label}</div>

      <div class="dial">
        <svg viewBox="0 0 300 300">
          <defs>
            <clipPath id="disc"><circle cx="150" cy="150" r="126"/></clipPath>
          </defs>
          <g clip-path="url(#disc)">
            <circle cx="150" cy="150" r="126" fill="rgba(255,255,255,.03)"/>
            <g id="waves" transform="translate(0,300)">
              <path id="waveA" class="wave-a" d="${wavePath(9)}"/>
              <path id="waveB" class="wave-b" d="${wavePath(6)}"/>
            </g>
          </g>
          <g transform="rotate(-90 150 150)">
            <circle cx="150" cy="150" r="${R_RING}" fill="none"
                    stroke="rgba(255,255,255,.08)" stroke-width="5"/>
            <circle id="ring" cx="150" cy="150" r="${R_RING}" fill="none"
                    stroke="${phaseCls === 'hold' ? 'var(--aqua)' : 'var(--air)'}" stroke-width="5" stroke-linecap="round"
                    stroke-dasharray="${C_RING}" stroke-dashoffset="${C_RING}"/>
          </g>
        </svg>
        <div class="dial-face">
          <div class="big" id="big" aria-hidden="true">0:00</div>
          <div class="small" id="small" aria-hidden="true"></div>
        </div>
        <div class="sr" id="srLive" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>

      <div class="next-up">${nextUpText()}</div>
    </div>

    <div class="run-ctl ${(isHold || isBreath) ? '' : 'solo'}">
      ${isBreath
        ? `<button class="btn ghost" onclick="togglePause()">${RUN.paused ? 'Reprendre' : 'Pause'}</button>
           <button class="btn primary" onclick="finish(true)">Terminer</button>`
        : isHold
          ? `<button class="btn ghost" onclick="togglePause()">${RUN.paused ? 'Reprendre' : 'Pause'}</button>
             <button class="btn ${st.free ? 'primary' : 'warm'}" onclick="stopHoldEarly()">${st.free ? 'Stopper' : "J'arrête l'apnée"}</button>`
          : isCalm
            ? `<button class="btn primary" onclick="finish(true)">Terminer la séance</button>`
            : isPrep
              ? `<button class="btn ghost" onclick="skipRest()">Je suis prêt</button>`
              : `<button class="btn ghost" onclick="skipRest()">Passer à l'apnée</button>`}
    </div>
  </div>`;
}

function wavePath(amp){
  // Sinusoïde répétée sur 900px de large, remplie vers le bas.
  let d = 'M -300 0';
  for(let x=-300; x<600; x+=150){
    d += ` q 37.5 ${-amp} 75 0 t 75 0`;
  }
  d += ' L 600 340 L -300 340 Z';
  return d;
}

function nextUpText(){
  const st = curStep();
  if(!st || st.free) return 'Tu arrêtes quand tu veux.';
  if(RUN.type === 'breath'){
    const nx = RUN.steps[RUN.idx+1];
    return nx ? `Ensuite · <b>${nx.label}</b>` : 'Dernière phase.';
  }
  if(st.kind === 'prep') return 'Allonge-toi, respire normalement.';
  if(st.kind === 'calm') return 'Table bouclée. Respiration libre.';
  if(st.kind === 'rest'){
    const nx = RUN.steps[RUN.idx+1];
    return nx ? `Ensuite · <b>apnée ${fmt(nx.dur)}</b>` : '';
  }
  const nx = RUN.steps[RUN.idx+1];
  if(!nx) return 'Dernière apnée de la table.';
  return `Ensuite · <b>récup ${fmt(nx.dur)}</b>`;
}

function skipRest(){
  const st = curStep();
  if(!st || (st.kind !== 'rest' && st.kind !== 'prep')) return;
  RUN.idx++;
  RUN.pausedMs = 0; RUN.paused = false;
  RUN.stepStart = Date.now();
  CUE.goHold();
  render();
}

/* ---------- détail d'une séance passée ---------- */
function openSession(id){ pending = { sessionId:id }; noteDraft = { rpe:0, contractions:null, text:'' }; goto('session'); }

function viewSession(){
  const e = S.history.find(x=>x.id === (pending && pending.sessionId));
  if(!e) return viewHistory();
  const isB = e.type === 'breath';
  const rows = (e.holds || []).map((h,i)=>{
    const off = h.planned ? h.actual - h.planned : 0;
    const col = h.planned && off < -2 ? 'var(--air)' : 'var(--hold-c)';
    return `<div class="plan-row">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <span class="pt" style="color:var(--mute)">${h.planned ? fmt(h.planned) : '—'}</span>
      <span class="pt" style="color:${col}">${fmt(h.actual)}</span>
    </div>`;
  }).join('');

  const table = e.tableId ? S.tables.find(t=>t.id === e.tableId) : null;

  return `
  <div class="screen">
    <div class="eyebrow">${e.done ? 'Séance terminée' : 'Séance interrompue'}</div>
    <h1>${isB && BREATH[e.breathKey] ? BREATH[e.breathKey].name : typeLabel(e.type)}</h1>
    <p class="sub">${dateLabel(e.ts)}${e.difficulty && DIFF[e.difficulty] ? ' · ' + DIFF[e.difficulty].name : ''}${table ? ' · ' + escapeHtml(table.name) : ''}</p>

    <div class="card">
      <div class="stat-grid">
        ${isB
          ? `<div class="stat"><div class="stat-v">${e.breathMin||0} min</div><div class="stat-l">Pratique</div></div>
             <div class="stat"><div class="stat-v">${(e.holds||[]).length||'—'}</div><div class="stat-l">Cycles notés</div></div>`
          : `<div class="stat"><div class="stat-v tm-hold">${fmt(e.totalHold||0)}</div><div class="stat-l">Temps d'apnée</div></div>
             <div class="stat"><div class="stat-v">${fmt(sessionBest(e))}</div><div class="stat-l">Plus longue</div></div>
             <div class="stat"><div class="stat-v tm-rest">${fmt(e.totalRest||0)}</div><div class="stat-l">Temps de repos</div></div>
             <div class="stat"><div class="stat-v">${(e.holds||[]).length}</div><div class="stat-l">Apnées</div></div>`}
      </div>
      ${e.pb ? `<div class="row" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <span style="color:var(--mute);font-size:13px">Max de référence du jour</span><span class="pt">${fmt(e.pb)}</span></div>` : ''}
    </div>

    ${rows ? `<div class="legend">
        <span><i style="background:var(--rest-c)"></i>Prévu</span>
        <span><i style="background:var(--hold-c)"></i>Réalisé</span>
      </div>
      <div class="plan">
        <div class="plan-row head"><span>#</span><span>Prévu</span><span>Réalisé</span></div>
        ${rows}
      </div>` : ''}

    ${noteBlock(e)}

    <button class="btn ghost" style="margin-top:18px" onclick="goto('history')">Retour</button>
    <button class="btn ghost" style="color:var(--danger);border-color:rgba(224,121,108,.28)"
            onclick="deleteSession('${e.id}')">Supprimer cette séance</button>
    ${tabbar('history')}
  </div>`;
}

function deleteSession(id){
  const e = S.history.find(x=>x.id === id);
  askConfirm('Supprimer cette séance ?',
    'Elle disparaîtra de ton journal et de tes statistiques. ' +
    (e ? 'Séance du ' + dateLabel(e.ts) + '.' : ''),
    'Supprimer',
    ()=>{
      S.history = S.history.filter(x=>x.id !== id);
      if(!Array.isArray(S.deletedSessions)) S.deletedSessions = [];
      S.deletedSessions.push(id);
      save(); pending = null; goto('history');
      toast('Séance supprimée.');
    }, true);
}

/* ---------- note de ressenti ---------- */
let noteDraft = { rpe:0, contractions:null, text:'' };

const RPE = [
  { v:1, l:'Facile',      d:"Aucune difficulté, je pouvais aller plus loin" },
  { v:2, l:'Confortable', d:"Inconfort léger, bien géré" },
  { v:3, l:'Engagé',      d:"Il a fallu travailler, mais sans lutter" },
  { v:4, l:'Dur',         d:"Lutte sur les derniers cycles" },
  { v:5, l:'Limite',      d:"À la limite de ce que je peux tenir" }
];

function noteBlock(e){
  const n = e.note || noteDraft;
  const saved = !!e.note;
  return `
    <h2 style="margin-top:26px">Ressenti</h2>
    ${saved ? `
      <div class="card flat">
        <div class="row"><span style="color:var(--mute);font-size:13.5px">Difficulté</span>
          <span class="pt" style="font-size:16px">${RPE[(n.rpe||1)-1] ? RPE[(n.rpe||1)-1].l : '—'}</span></div>
        ${n.contractions ? `<div class="row" style="margin-top:8px">
          <span style="color:var(--mute);font-size:13.5px">Contractions</span>
          <span class="pt" style="font-size:16px">à partir du cycle ${n.contractions}</span></div>` : ''}
        ${n.text ? `<p style="font-size:13.5px;color:var(--mute);margin:14px 0 0;line-height:1.6">${escapeHtml(n.text)}</p>` : ''}
        <button class="btn ghost" style="margin-top:14px" onclick="editNote('${e.id}')">Modifier le ressenti</button>
      </div>` : `
      <p class="hint" style="margin:-4px 0 14px">Deux séances au même chrono peuvent être vécues très différemment. C'est ce qui explique tes écarts d'un jour à l'autre.</p>
      <div class="card">
        <label class="lbl">Difficulté perçue</label>
        <div class="rpe">
          ${RPE.map(r=>`<button class="rpe-b ${noteDraft.rpe===r.v?'on':''}" onclick="noteDraft.rpe=${r.v};render()">${r.v}</button>`).join('')}
        </div>
        <p class="hint" style="margin:8px 0 18px;min-height:32px">${noteDraft.rpe ? RPE[noteDraft.rpe-1].d : 'De 1 (facile) à 5 (à la limite).'}</p>

        ${e.holds && e.holds.length > 1 ? `
          <label class="lbl">Premières contractions</label>
          <div class="rpe" style="flex-wrap:wrap">
            ${e.holds.map((h,i)=>`<button class="rpe-b sm ${noteDraft.contractions===i+1?'on':''}" onclick="noteDraft.contractions=${i+1};render()">${i+1}</button>`).join('')}
            <button class="rpe-b sm ${noteDraft.contractions===0?'on':''}" onclick="noteDraft.contractions=0;render()">—</button>
          </div>
          <p class="hint" style="margin:8px 0 18px">Numéro du cycle où elles sont apparues.</p>` : ''}

        <label class="lbl" for="noteTxt">Commentaire</label>
        <textarea class="field text" id="noteTxt" rows="3" maxlength="400"
          placeholder="Sommeil, stress, position, ce qui a joué…"
          oninput="noteDraft.text=this.value">${escapeHtml(noteDraft.text||'')}</textarea>
      </div>
      <button class="btn ghost" onclick="saveNote('${e.id}')">Enregistrer le ressenti</button>`}`;
}

function saveNote(id){
  const el = document.getElementById('noteTxt');
  if(el) noteDraft.text = el.value;
  if(!noteDraft.rpe){ toast('Choisis une difficulté perçue.','err'); return; }
  const e = S.history.find(x=>x.id === id);
  if(!e){ toast('Séance introuvable.','err'); return; }
  e.note = { rpe:noteDraft.rpe, contractions:noteDraft.contractions || null, text:(noteDraft.text||'').trim() };
  if(lastSummary && lastSummary.id === id) lastSummary = e;
  save(); render();
  toast('Ressenti enregistré.');
}
function editNote(id){
  const e = S.history.find(x=>x.id === id);
  if(!e) return;
  noteDraft = { rpe:e.note.rpe, contractions:e.note.contractions, text:e.note.text };
  delete e.note; save(); render();
}

/* ---------- summary ---------- */
function viewSummary(){
  const e = lastSummary;
  if(!e) return viewHome();
  const rows = e.holds.map((h,i)=>{
    const off = h.planned ? h.actual - h.planned : 0;
    const col = h.planned && off < -2 ? 'var(--air)' : 'var(--aqua)';
    return `<div class="plan-row" style="grid-template-columns:38px 1fr 1fr">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <span class="pt" style="color:var(--mute)">${h.planned ? fmt(h.planned) : '—'}</span>
      <span class="pt" style="color:${col}">${fmt(h.actual)}</span>
    </div>`;
  }).join('');
  return `
  <div class="screen">
    <div class="eyebrow">${e.done ? 'Table terminée' : 'Séance interrompue'}</div>
    <h1>${e.done ? 'C\'est plié.' : 'Bien joué quand même.'}</h1>
    <p class="sub">${typeLabel(e.type)}${e.difficulty && DIFF[e.difficulty] ? ' · ' + DIFF[e.difficulty].name : ''} · ${dateLabel(e.ts)}</p>

    <div class="card">
      <div class="row">
        <div><div class="pb-val">${fmt(e.totalHold)}</div><div class="pb-unit">Temps total en apnée</div></div>
        <div style="text-align:right"><div class="pb-val" style="font-size:38px">${e.holds.length}</div><div class="pb-unit">apnées</div></div>
      </div>
    </div>

    <div class="plan">
      <div class="plan-row head"><span>#</span><span>Prévu</span><span>Réalisé</span></div>
      ${rows}
    </div>

    ${noteBlock(e)}

    <button class="btn primary" style="margin-top:18px" onclick="goto('home')">Terminer</button>
    ${tabbar('home')}
  </div>`;
}
function typeLabel(t){ return t === 'co2' ? 'Table CO₂' : t === 'o2' ? 'Table O₂' : 'Test de max'; }

/* ---------- onglet Souffle ---------- */
let breathSel = null;   // clé de la pratique ouverte
let breathMin = null;
let breathStep = null;

function viewBreath(){
  const cards = Object.entries(BREATH).map(([k,b])=>`
    <button class="tile" onclick="openBreath('${k}')">

  return `
  <div class="screen">
    <div class="eyebrow">Respiration</div>

function openBreath(k){

}

function viewBreathDetail(){
  const b = BREATH[breathSel];
  if(!b) return viewBreath();
  const cycles = breathCycles(breathSel, breathMin, breathStep);
  const cycle = b.cycle(breathStep);

  return `
  <div class="screen">

    <p class="sub" data-t>${t(b.lede)}</p>

    <h2>Comment faire</h2>
    <div class="card flat">
      <p data-t style="font-size:13.5px;color:var(--mute);margin:0;line-height:1.65">${t(b.how)}</p>

    <h2 style="margin-top:26px">Durée</h2>
